<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ressources</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
</head>
<body>
<main class="page" id="app"></main>
<script type="module">
import { $, icon, mountShell, registerSW } from "/assets/app.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
registerSW();
mountShell({ role:"kine", active:"", back:"history" });

const link = (href, ico, title, sub) => `<a class="list-item" href="${href}"><span class="li-ico">${icon(ico)}</span><span class="li-main"><span class="li-title">${title}</span><span class="li-sub">${sub}</span></span><span class="li-end">${icon("chevron")}</span></a>`;

$("#app").innerHTML = `
  <div class="page-head"><h1>Ressources</h1><p class="lead">Tout ce qui sert au bilan et aux patients. Les réglages sont dans Outils.</p></div>
  <section class="section">
    <div class="section-title">Bilan et examen</div>
    <div class="list">
      ${link("/tests.html", "stethoscope", "Tests cliniques et fonctionnels", "Technique, valeurs diagnostiques, vidéo")}
      ${link("/nerfs.html", "body", "Territoires nerveux", "Dermatomes, nerfs périphériques, racines, muscles et réflexes")}
      ${link("/questionnaires.html", "list", "Questionnaires", "Oswestry, QuickDASH, KOOS… remplis par le patient, score automatique")}
    </div>
  </section>
  <section class="section">
    <div class="section-title">Programmes</div>
    <div class="list">
      ${link("/programmes_admin.html", "layers", "Modèles", "Pathologies, post-opératoire, prévention, par niveau")}
      ${link("/programmescourse.html", "run", "Reprise de course", "Générer un programme progressif course et marche")}
      ${link("/respir/index.html", "wind", "Respiration guidée", "RespiR")}
      ${link("/mes_programmes.html", "star", "Séances favorites", "Enregistrées sur cet appareil")}
    </div>
  </section>
  <section class="section">
    <div class="section-title">Pour les patients</div>
    <div class="list">
      ${link("/conseils.html", "book", "Fiches conseils", "Courtes fiches et affiches « L'info kiné du mois »")}
      ${link("/salle-attente.html", "maximize", "Mode salle d'attente", "Les affiches en plein écran, l'une après l'autre, sur une tablette ou un écran")}
      ${link("/ordonnance.html", "file", "Ordonnance", "Ordonnance pré-remplie, datée du jour : Word, impression ou PDF")}
    </div>
  </section>`;
</script>
</body>
</html>
