<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabinet de kinésithérapie – Gabriel LAVEAU – Loudun</title>
<meta name="description" content="Cabinet de kinésithérapie de Gabriel LAVEAU à Loudun : adresse, téléphone, horaires et soins à domicile.">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
<style>
  /* Page publique du cabinet (lien à mettre sur la fiche Google Maps).
     Page indépendante : aucun lien vers l'application. Tout vient de Réglages du cabinet : nom, profession, logo, téléphone, adresse, horaires, annonce. */
  .cab{ width:min(100% - 2*var(--gutter, 16px), 720px); margin:0 auto; padding:28px 0 48px; display:flex; flex-direction:column; gap:18px; }
  .cab-head{ display:flex; gap:16px; align-items:center; }
  .cab-head img{ width:72px; height:72px; object-fit:contain; border-radius:var(--r-md); background:#fff; border:1px solid var(--line); flex:none; }
  .cab-head h1{ margin:0; font-size:clamp(1.4rem, 5vw, 2rem); line-height:1.15; }
  .cab-head p{ margin:4px 0 0; color:var(--ink-2); }
  .cab-actions{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; }
  .cab-map{ width:100%; height:260px; border:0; border-radius:var(--r-md); display:block; background:var(--surface-2); }
  .cab-foot{ text-align:center; font-size:var(--fs-sm); color:var(--ink-3); }
  .cab .panel h2{ font-size:var(--fs-lg); display:flex; align-items:center; gap:10px; margin:0 0 10px; }
  .cab .panel h2 svg{ width:22px; height:22px; color:var(--lagon); }
  .cab-call span{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.15; }
  .cab-call small{ font-size:var(--fs-sm); font-weight:600; opacity:.9; white-space:nowrap; }
  .cab-head .hor-etat{ margin:8px 0 0; }
  .cab .hor-etat{ font-size:var(--fs-sm); }
</style>
</head>
<body>
<main class="cab" id="cab"><div class="loading" style="min-height:50dvh"><div class="spinner"></div><span>Chargement…</span></div></main>
<script type="module">
import { $, esc, icon } from "/assets/app.js";
import { settings, loadSettings, currentAnnonce, logoSrc } from "/assets/settings.js";
import * as H from "/assets/horaires.js";

function render(){
  const c = settings.cabinet || {};
  const tel = String(c.telephone || "").trim(), adr = String(c.adresse || "").trim();
  const adrLigne = adr.replace(/\s*\n\s*/g, ", ");
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(adrLigne);
  const hor = H.renseignes(c.horaires), st = H.etat(c.horaires), note = H.normaliser(c.horaires).note.trim();
  const a = currentAnnonce();
  document.title = `${c.titre || "Kinésithérapie"} – ${c.nom}${adr ? " – " + ((adr.split("\n").pop().match(/\d{5}\s+(.+)$/) || [])[1] || "") : ""}`;
  $("#cab").innerHTML = `
    <header class="cab-head">
      <img src="${esc(logoSrc())}" alt="">
      <div><h1>${esc(c.nom)}</h1><p>${esc(c.titre || "")}</p>${hor ? `<span class="hor-etat ${st.cls}">${esc(st.texte)}</span>` : ""}</div>
    </header>
    ${a ? `<div class="notice annonce">${icon("bell")}<span>${esc(a.texte).replace(/\n/g, "<br>")}</span></div>` : ""}
    <div class="cab-actions">
      ${tel ? `<a class="btn primary big cab-call" href="tel:${esc(tel.replace(/[^\d+]/g, ""))}">${icon("call")}<span><b>Appeler</b><small>${esc(tel)}</small></span></a>` : ""}
      ${adr ? `<a class="btn big" href="${esc(maps)}" target="_blank" rel="noopener">${icon("pin")}Itinéraire</a>` : ""}
    </div>
    ${hor ? `
    <section class="panel">
      <h2>${icon("clock")}Horaires</h2>
      ${H.tableauHTML(c.horaires)}
    </section>` : ""}
    ${adr ? `
    <section class="panel">
      <h2>${icon("pin")}Adresse</h2>
      <p style="margin:0 0 12px">${esc(adr).replace(/\n/g, "<br>")}</p>
      <iframe class="cab-map" title="Plan d'accès" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(adrLigne)}&output=embed"></iframe>
    </section>` : ""}
    <p class="cab-foot">${esc(c.nom)}${c.titre ? " · " + esc(c.titre) : ""}</p>`;
}
render();
loadSettings({ force:true }).then(render);
</script>
</body>
</html>
