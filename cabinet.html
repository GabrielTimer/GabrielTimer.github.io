<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cabinet de kinésithérapie – Gabriel LAVEAU – Loudun</title>
<meta name="description" content="Cabinet de kinésithérapie de Gabriel LAVEAU à Loudun : adresse, téléphone, horaires et soins à domicile.">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
<style>
  /* Page publique du cabinet (lien à mettre sur la fiche Google Maps).
     Page indépendante : aucun lien vers l'application (sauf le bouton « Retour », visible seulement dans l'appli installée). Tout vient de Réglages du cabinet : nom, profession, logo, téléphone, adresse, horaires, annonce. */
  .cab{ width:min(100% - 2*var(--gutter, 16px), 720px); margin:0 auto; padding:28px 0 48px; display:flex; flex-direction:column; gap:18px; }
  .cab-head{ display:flex; gap:16px; align-items:center; }
  .cab-head img{ width:88px; height:88px; object-fit:contain; border-radius:50%; flex:none; filter:drop-shadow(0 2px 6px rgba(20,48,58,.15)); }
  .cab-head h1{ margin:0; font-size:clamp(1.4rem, 5vw, 2rem); line-height:1.15; }
  .cab-head p{ margin:4px 0 0; color:var(--ink-2); }
  .cab-actions{ display:grid; grid-template-columns:repeat(auto-fit, minmax(180px, 1fr)); gap:10px; }
  .cab-map{ width:100%; height:260px; border:0; border-radius:var(--r-md); display:block; background:var(--surface-2); }
  .cab-gal{ display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin:0 calc(-1 * var(--gutter, 16px)); padding:0 var(--gutter, 16px) 4px; scrollbar-width:none; }
  .cab-gal::-webkit-scrollbar{ display:none; }
  .cab-gal button{ flex:0 0 min(82%, 420px); scroll-snap-align:center; border:0; padding:0; background:none; cursor:zoom-in; text-align:left; font:inherit; color:inherit; }
  .cab-gal button:only-child{ flex-basis:100%; }
  .cab-gal img{ width:100%; aspect-ratio:4/3; object-fit:cover; border-radius:var(--r-md); display:block; background:var(--surface-2); }
  .cab-gal figcaption{ font-size:var(--fs-sm); color:var(--ink-2); margin-top:6px; }
  .cab-lb{ border:0; padding:0; background:transparent; max-width:100vw; max-height:100dvh; width:100vw; height:100dvh; }
  .cab-lb::backdrop{ background:rgba(5,15,20,.92); }
  .cab-lb figure{ margin:0; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; padding:16px; box-sizing:border-box; }
  .cab-lb img{ max-width:100%; max-height:calc(100dvh - 110px); object-fit:contain; border-radius:8px; }
  .cab-lb figcaption{ color:#fff; text-align:center; }
  .cab-lb .lb-btn{ position:fixed; top:50%; transform:translateY(-50%); width:48px; height:48px; border-radius:50%; border:0; background:rgba(255,255,255,.15); color:#fff; display:grid; place-items:center; cursor:pointer; }
  .cab-lb .lb-prev{ left:10px; } .cab-lb .lb-next{ right:10px; }
  .cab-lb .lb-close{ position:fixed; top:12px; right:12px; width:44px; height:44px; border-radius:50%; border:0; background:rgba(255,255,255,.15); color:#fff; display:grid; place-items:center; cursor:pointer; }
  .cab-lb svg{ width:22px; height:22px; }
  .cab-msg{ display:flex; gap:14px; align-items:flex-start; padding:16px 18px; border-radius:var(--r-lg, 18px); background:var(--warn-soft); border:2px solid var(--warn); color:var(--ink); font-size:var(--fs-md, 1rem); line-height:1.45; font-weight:600; text-decoration:none; }
  .cab-msg svg{ width:28px; height:28px; flex:none; margin-top:1px; color:var(--warn); }
  .cab-msg b{ white-space:nowrap; color:var(--warn); font-weight:800; }
  .cab-retour{ align-self:flex-start; }
  .cab-foot{ text-align:center; font-size:var(--fs-sm); color:var(--ink-3); }
  .cab .panel h2{ font-size:var(--fs-lg); display:flex; align-items:center; gap:10px; margin:0 0 10px; }
  .cab .panel h2 svg{ width:22px; height:22px; color:var(--lagon); }
  .cab-call span{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.15; }
  .cab-call small{ font-size:var(--fs-sm); font-weight:600; opacity:.9; white-space:nowrap; }
  .cab-head .hor-etat{ margin:8px 0 0; }
  .cab .hor-etat{ font-size:var(--fs-sm); }
</style>
</head>
<body>
<dialog class="cab-lb" id="lb"></dialog>
<main class="cab" id="cab"><div class="loading" style="min-height:50dvh"><div class="spinner"></div><span>Chargement…</span></div></main>
<script type="module">
import { $, esc, icon } from "/assets/app.js";
import { settings, loadSettings, currentAnnonce, logoSrc, docLogoSrc } from "/assets/settings.js";
import * as H from "/assets/horaires.js";

/* Ouverte depuis l'application installée (écran d'accueil du téléphone) : pas de barre de navigation,
   donc un bouton pour revenir. Invisible pour les visiteurs venus de Google Maps (navigateur normal). */
const dansAppli = matchMedia("(display-mode: standalone)").matches || navigator.standalone === true;
const retourHTML = () => dansAppli ? `<button class="btn cab-retour" type="button" id="retour">${icon("back")}Retour à l'application</button>` : "";
function brancherRetour(){
  const b = $("#retour"); if(!b) return;
  b.onclick = () => {
    if(window.opener){ window.close(); return; }
    if(history.length > 1){ history.back(); return; }
    location.href = "/index.html";
  };
}

function render(){
  const c = settings.cabinet || {};
  const tel = String(c.telephone || "").trim(), adr = String(c.adresse || "").trim();
  const adrLigne = adr.replace(/\s*\n\s*/g, ", ");
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(adrLigne);
  const hor = H.renseignes(c.horaires), st = H.etat(c.horaires), note = H.normaliser(c.horaires).note.trim();
  const a = currentAnnonce();
  document.title = `${c.titre || "Kinésithérapie"} – ${c.nom}${adr ? " – " + ((adr.split("\n").pop().match(/\d{5}\s+(.+)$/) || [])[1] || "") : ""}`;
  const msg = String(c.message ?? "").trim();
  const msgHTML = msg ? esc(msg).replace(/ ([:;!?])/g, "\u00a0$1").replace(/\{telephone\}/g, tel ? `<b>${esc(tel)}</b>` : "le cabinet").replace(/\n/g, "<br>") : "";
  $("#cab").innerHTML = `
    ${retourHTML()}
    ${msg ? (tel ? `<a class="cab-msg" href="tel:${esc(tel.replace(/[^\d+]/g, ""))}">${icon("call")}<span>${msgHTML}</span></a>` : `<div class="cab-msg">${icon("info")}<span>${msgHTML}</span></div>`) : ""}
    <header class="cab-head">
      <img src="${esc(docLogoSrc())}" alt="Masseur-Kinésithérapeute">
      <div><h1>${esc(c.nom)}</h1><p>${esc(c.titre || "")}</p>${hor ? `<span class="hor-etat ${st.cls}">${esc(st.texte)}</span>` : ""}</div>
    </header>
    ${a ? `<div class="notice annonce">${icon("bell")}<span>${esc(a.texte).replace(/\n/g, "<br>")}</span></div>` : ""}
    <div class="cab-actions">
      ${tel ? `<a class="btn primary big cab-call" href="tel:${esc(tel.replace(/[^\d+]/g, ""))}">${icon("call")}<span><b>Appeler</b><small>${esc(tel)}</small></span></a>` : ""}
      ${adr ? `<a class="btn big" href="${esc(maps)}" target="_blank" rel="noopener">${icon("pin")}Itinéraire</a>` : ""}
    </div>
    <div id="gal"></div>
    ${hor ? `
    <section class="panel">
      <h2>${icon("clock")}Horaires</h2>
      ${H.tableauHTML(c.horaires)}
    </section>` : ""}
    ${adr ? `
    <section class="panel">
      <h2>${icon("pin")}Adresse</h2>
      <p style="margin:0 0 12px">${esc(adr).replace(/\n/g, "<br>")}</p>
      <iframe class="cab-map" title="Plan d'accès" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://www.google.com/maps?q=${encodeURIComponent(adrLigne)}&output=embed"></iframe>
    </section>` : ""}
    <p class="cab-foot">${esc(c.nom)}${c.titre ? " · " + esc(c.titre) : ""}<br><a href="/confidentialite.html">Données personnelles</a></p>`;
  brancherRetour();
}
/* ---------- Photos (Réglages du cabinet → Photos) ---------- */
let photos = [];
function galerie(){
  const box = $("#gal"); if(!box) return;
  box.innerHTML = photos.length ? `<div class="cab-gal">${photos.map((p, i) => `<button type="button" data-i="${i}"><figure style="margin:0"><img src="${esc(p.data)}" alt="${esc(p.legende || "Photo du cabinet")}" loading="lazy">${p.legende ? `<figcaption>${esc(p.legende)}</figcaption>` : ""}</figure></button>`).join("")}</div>` : "";
  box.querySelectorAll("[data-i]").forEach(b => b.onclick = () => ouvrir(Number(b.dataset.i)));
}
const lb = $("#lb");
let cur = 0;
function ouvrir(i){
  cur = (i + photos.length) % photos.length;
  const p = photos[cur], plus = photos.length > 1;
  lb.innerHTML = `<figure><img src="${esc(p.data)}" alt="${esc(p.legende || "Photo du cabinet")}">${p.legende ? `<figcaption>${esc(p.legende)}</figcaption>` : ""}</figure>
    <button class="lb-close" type="button" aria-label="Fermer">${icon("close")}</button>
    ${plus ? `<button class="lb-btn lb-prev" type="button" aria-label="Photo précédente">${icon("back")}</button><button class="lb-btn lb-next" type="button" aria-label="Photo suivante">${icon("chevron")}</button>` : ""}`;
  lb.querySelector(".lb-close").onclick = () => lb.close();
  lb.querySelector(".lb-prev")?.addEventListener("click", () => ouvrir(cur - 1));
  lb.querySelector(".lb-next")?.addEventListener("click", () => ouvrir(cur + 1));
  if(!lb.open) lb.showModal();
}
lb.addEventListener("click", e => { if(e.target === lb || e.target.tagName === "FIGURE") lb.close(); });
let x0 = null;
lb.addEventListener("touchstart", e => { x0 = e.touches[0].clientX; }, { passive:true });
lb.addEventListener("touchend", e => { if(x0 === null || photos.length < 2) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 50) ouvrir(cur + (dx < 0 ? 1 : -1)); });
document.addEventListener("keydown", e => { if(!lb.open) return; if(e.key === "ArrowRight") ouvrir(cur + 1); if(e.key === "ArrowLeft") ouvrir(cur - 1); });

render();
loadSettings({ force:true }).then(() => { render(); galerie(); });
import("/assets/cloud.js").then(C => C.getPhotosCabinet()).then(l => { photos = l; galerie(); }).catch(() => {});
</script>
</body>
</html>
