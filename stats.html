<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Statistiques du cabinet</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
<style>
  .kpis.four{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (min-width:800px){ .kpis.four{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .bars{ position:relative; }
  .bars svg{ width:100%; height:auto; display:block; overflow:visible; }
  .bars .b{ fill:var(--lagon); }
  .bars .b:hover{ fill:var(--lagon-strong); }
  .bars text{ fill:var(--ink-3); font-size:12px; }
  .bars svg{ max-height:260px; }
  .bars .v{ fill:var(--ink); font-weight:700; }
  .stat-cols{ display:grid; gap:16px; }
  @media (min-width:1000px){ .stat-cols{ grid-template-columns:1fr 1fr; align-items:start; } }
  .stat-cols > .panel + .panel{ margin-top:0; }
  .tbl td.n, .tbl th.n{ text-align:right; white-space:nowrap; font-variant-numeric:tabular-nums; }
  .meter{ display:inline-block; width:60px; height:6px; border-radius:3px; background:var(--surface-3); vertical-align:middle; margin-right:8px; overflow:hidden; }
  .meter i{ display:block; height:100%; background:var(--lagon); }
  .good{ color:var(--ok); font-weight:700; } .bad{ color:var(--danger); font-weight:700; }
</style>
</head>
<body>
<main class="page wide" id="app"><div class="loading"><div class="spinner"></div><span>Calcul des statistiques…</span></div></main>
<script type="module">
import { $, esc, icon, mountShell, registerSW, errorHTML, emptyHTML, fmtNum, startOfDay, groupProgrammes, evaTrend } from "/assets/app.js";
import { fmtScore } from "/assets/questionnaires.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
registerSW();
mountShell({ role:"kine", active:"", back:"/admin_tools.html" });
const C = await import("/assets/cloud.js");
const P = await import("/assets/patient.js");
const app = $("#app");
const DAY = 864e5;

let patients, seances, suivis, questionnaires;
try{
  [patients, seances, suivis, questionnaires] = await Promise.all([C.listPatients(), C.listAllSeances(), C.listAllSuivis().catch(() => []), C.listQuestionnaires().catch(() => [])]);
}catch(err){ app.innerHTML = errorHTML(err); throw err; }
seances = seances.filter(s => s.data && Array.isArray(s.data.exercices) && patients.some(p => p.cle === s.cle));

if(!seances.length){
  app.innerHTML = `<div class="page-head"><h1>Statistiques du cabinet</h1></div><div class="panel">${emptyHTML({ ico:"chart", title:"Pas encore de données", text:"Les statistiques apparaîtront quand vos patients auront fait leurs premières séances." })}</div>`;
  throw new Error("vide");
}

/* ---------- Calculs ---------- */
const byPatient = new Map();
seances.forEach(s => { if(!byPatient.has(s.cle)) byPatient.set(s.cle, []); byPatient.get(s.cle).push(s); });
const progs = [];
byPatient.forEach((list, cle) => groupProgrammes(list).programmes.forEach(p => progs.push({ ...p, cle })));
const now = Date.now();
const actifs = progs.filter(p => !p.termine && p.seances.some(s => s.datePrevue && new Date(s.datePrevue) > now - 21 * DAY));
const regs = actifs.map(p => P.regularity(p.seances)).filter(r => r !== null);
const regMoy = regs.length ? Math.round(regs.reduce((a, b) => a + b, 0) / regs.length) : null;
const valid30 = seances.filter(s => s.terminee && s.dateValidation && s.dateValidation > now - 30 * DAY).length;
const trends = progs.map(p => evaTrend(p.evas)).filter(Boolean);
const deltaMoy = trends.length ? trends.reduce((a, t) => a + t.delta, 0) / trends.length : null;

/* Séances validées par semaine, 12 dernières semaines */
const monday = d => { const x = startOfDay(d); x.setDate(x.getDate() - ((x.getDay() + 6) % 7)); return x.getTime(); };
const thisMon = monday(new Date());
/* Pas de « 7 × 24 h » : le changement d'heure décalerait les semaines */
const weeks = Array.from({ length:12 }, (_, i) => { const d = new Date(thisMon); d.setDate(d.getDate() - (11 - i) * 7); return d.getTime(); });
const perWeek = weeks.map(w => seances.filter(s => s.terminee && s.dateValidation && monday(s.dateValidation) === w).length);

/* Par programme (même nom) */
const byName = new Map();
progs.forEach(p => { const k = p.nom.trim(); if(!byName.has(k)) byName.set(k, []); byName.get(k).push(p); });
const rows = [...byName.entries()].map(([nom, list]) => {
  const r = list.map(p => P.regularity(p.seances)).filter(x => x !== null);
  const t = list.map(p => evaTrend(p.evas)).filter(Boolean);
  return {
    nom, n: list.length, patients: new Set(list.map(p => p.cle)).size,
    reg: r.length ? Math.round(r.reduce((a, b) => a + b, 0) / r.length) : null,
    debut: t.length ? t.reduce((a, x) => a + x.debut, 0) / t.length : null,
    fin: t.length ? t.reduce((a, x) => a + x.fin, 0) / t.length : null,
    termines: list.filter(p => p.termine).length
  };
}).sort((a, b) => b.n - a.n || a.nom.localeCompare(b.nom, "fr"));

/* Questionnaires : évolution moyenne entre premier et dernier score */
const qRows = questionnaires.map(q => {
  const per = new Map();
  suivis.filter(s => s.type === "questionnaire" && s.qid === q.id && typeof s.score === "number").sort((a, b) => a.date - b.date)
    .forEach(s => { if(!per.has(s.cle)) per.set(s.cle, []); per.get(s.cle).push(s.score); });
  const pairs = [...per.values()].filter(v => v.length >= 2);
  return { q, n: per.size, deb: pairs.length ? pairs.reduce((a, v) => a + v[0], 0) / pairs.length : null, fin: pairs.length ? pairs.reduce((a, v) => a + v[v.length - 1], 0) / pairs.length : null, paires: pairs.length };
}).filter(r => r.n);

/* ---------- Affichage ---------- */
function barsSVG(values, labels){
  const W = 640, H = 200, pl = 8, pr = 8, pt = 18, pb = 26;
  const max = Math.max(4, ...values);
  const bw = (W - pl - pr) / values.length;
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Séances validées par semaine">
    <line x1="${pl}" x2="${W - pr}" y1="${H - pb}" y2="${H - pb}" stroke="var(--line)"/>
    ${values.map((v, i) => {
      const h = v / max * (H - pt - pb), x = pl + i * bw + bw * .18, w = bw * .64, y = H - pb - h;
      return `<g><title>Semaine du ${labels[i]} : ${v} séance${v > 1 ? "s" : ""}</title>
        ${v ? `<path class="b" d="M${x} ${H - pb} V${y + 4} q0 -4 4 -4 h${w - 8} q4 0 4 4 V${H - pb} Z"/>` : ""}
        ${v ? `<text class="v" x="${x + w / 2}" y="${y - 5}" text-anchor="middle">${v}</text>` : ""}
        ${i % 2 === 1 || values.length <= 8 ? `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${labels[i]}</text>` : ""}</g>`;
    }).join("")}
  </svg>`;
}
const wLabels = weeks.map(w => new Date(w).toLocaleDateString("fr-FR", { day:"numeric", month:"short" }).replace(".", ""));
const dlt = (a, b, sens = "bas") => { if(a === null || b === null) return "–"; const d = Math.round((b - a) * 10) / 10; if(!d) return "stable"; const good = sens === "haut" ? d > 0 : d < 0; return `<span class="${good ? "good" : "bad"}">${d > 0 ? "+" : ""}${fmtNum(d)}</span>`; };

app.innerHTML = `
  <div class="page-head"><h1>Statistiques du cabinet</h1><p class="lead">Calculées à partir des séances faites par vos patients dans l'application.</p></div>
  <section class="kpis four">
    <div class="kpi"><span class="k-val">${actifs.length}</span><span class="k-lab">programmes en cours</span></div>
    <div class="kpi"><span class="k-val">${regMoy === null ? "–" : regMoy + "<span style='font-size:.6em'>%</span>"}</span><span class="k-lab">d'assiduité moyenne (programmes en cours)</span></div>
    <div class="kpi"><span class="k-val">${valid30}</span><span class="k-lab">séances faites ces 30 derniers jours</span></div>
    <div class="kpi"><span class="k-val">${deltaMoy === null ? "–" : `${deltaMoy > 0 ? "+" : ""}${fmtNum(deltaMoy)}`}</span><span class="k-lab">points de douleur en moyenne, du début à la fin des programmes</span></div>
  </section>

  <section class="panel section">
    <div class="panel-head"><h2 style="font-size:var(--fs-lg)">Séances faites par semaine</h2><span class="badge">12 dernières semaines</span></div>
    <div class="bars">${barsSVG(perWeek, wLabels)}</div>
  </section>

  <div class="stat-cols section">
    <section class="panel">
      <div class="panel-head"><h2 style="font-size:var(--fs-lg)">Programmes les plus prescrits</h2></div>
      <div style="overflow-x:auto"><table class="tbl"><thead><tr><th>Programme</th><th class="n">Prescrit</th><th class="n">Assiduité</th><th class="n">Douleur</th></tr></thead><tbody>
      ${rows.slice(0, 15).map(r => `<tr><td><strong>${esc(r.nom)}</strong><br><span class="small muted">${r.patients} patient${r.patients > 1 ? "s" : ""}, ${r.termines} terminé${r.termines > 1 ? "s" : ""}</span></td>
        <td class="n">${r.n}</td>
        <td class="n">${r.reg === null ? "–" : `<span class="meter"><i style="width:${r.reg}%"></i></span>${r.reg} %`}</td>
        <td class="n">${r.debut === null ? "–" : `${fmtNum(r.debut)} → ${fmtNum(r.fin)}<br>${dlt(r.debut, r.fin)}`}</td></tr>`).join("")}
      </tbody></table></div>
      <p class="small muted" style="margin-top:10px">Douleur : moyenne des premières et des dernières mesures (0 à 10) de chaque programme.</p>
    </section>
    <section class="panel">
      <div class="panel-head"><h2 style="font-size:var(--fs-lg)">Questionnaires</h2></div>
      ${qRows.length ? `<table class="tbl"><thead><tr><th>Questionnaire</th><th class="n">Patients</th><th class="n">Évolution moyenne</th></tr></thead><tbody>
        ${qRows.map(r => `<tr><td><strong>${esc(r.q.nom)}</strong></td><td class="n">${r.n}</td><td class="n">${r.paires ? `${esc(fmtScore(r.deb, r.q))} → ${esc(fmtScore(r.fin, r.q))}<br>${dlt(r.deb, r.fin, r.q.sens === "haut" ? "haut" : "bas")}` : `<span class="muted">une seule mesure</span>`}</td></tr>`).join("")}
      </tbody></table>` : `<p class="muted small">Les résultats apparaîtront quand vos patients auront rempli des questionnaires.</p>`}
      <div class="notice" style="margin-top:14px">${icon("info")}<span class="small">Ces chiffres décrivent votre patientèle dans l'application : ils ne remplacent pas une étude et ne tiennent pas compte des séances au cabinet.</span></div>
    </section>
  </div>`;
</script>
</body>
</html>
