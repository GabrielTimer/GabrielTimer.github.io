<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Outils</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
<style>
  .log{ font-family:var(--mono); font-size:var(--fs-xs); background:var(--surface-2); border-radius:var(--r-md); padding:12px; max-height:220px; overflow:auto; white-space:pre-wrap; }
</style>
</head>
<body>
<main class="page" id="app"></main>
<script type="module">
import { $, esc, icon, mountShell, registerSW, toast, confirmDialog, kineHint } from "/assets/app.js";
const { requireKine } = await import("/assets/kine.js");
const user = await requireKine();
registerSW();
mountShell({ role:"kine", active:"" });
const C = await import("/assets/cloud.js");

const link = (href, ico, title, sub) => `<a class="list-item" href="${href}"><span class="li-ico">${icon(ico)}</span><span class="li-main"><span class="li-title">${title}</span><span class="li-sub">${sub}</span></span><span class="li-end">${icon("chevron")}</span></a>`;

$("#app").innerHTML = `
  <div class="page-head"><h1>Outils</h1></div>
  <div class="list">
    ${link("/programmescourse.html", "run", "Reprise de course", "Générer un programme progressif course et marche")}
    ${link("/pathologies.html", "stethoscope", "Programmes par pathologie", "Points de départ prêts à adapter")}
    ${link("/programmes_admin.html", "layers", "Modèles du cabinet", "Vos séances types")}
    ${link("/mes_programmes.html", "star", "Séances favorites", "Enregistrées sur cet appareil")}
    ${link("/historique.html", "history", "Historique de cet appareil", "Séances lancées depuis ici")}
    ${link("/admin_exercises.html", "file", "Gestion des exercices (JSON)", "Préparer de nouveaux exercices pour la bibliothèque")}
    ${link("/respir/index.html", "wind", "Respiration guidée", "RespiR")}
    ${link("/reglages.html", "settings", "Réglages", "Thème, sons, taille du texte")}
  </div>

  <section class="section panel" id="migration">
    <div class="panel-head"><h2 style="font-size:var(--fs-lg)">Importer les anciens programmes</h2></div>
    <p class="muted">Copie les programmes de l'ancienne version dans la nouvelle organisation sécurisée : un dossier par patient, avec son code d'accès personnel. Les anciens programmes ne sont pas effacés. Vous pouvez relancer l'import sans risque de doublon.</p>
    <div class="row wrap" style="margin-top:14px">
      <button class="btn primary" type="button" id="mig">${icon("upload")}Lancer l'import</button>
      <span class="small muted" id="mig-count"></span>
    </div>
    <div class="log" id="mig-log" hidden></div>
  </section>

  <section class="section panel">
    <div class="panel-head"><h2 style="font-size:var(--fs-lg)">Compte</h2></div>
    <p class="muted">Connecté avec <strong>${esc(user.email || "")}</strong>.</p>
    <div style="margin-top:14px"><button class="btn danger" type="button" id="logout">${icon("logout")}Se déconnecter</button></div>
  </section>`;

C.listLegacy().then(l => { $("#mig-count").textContent = `${l.length} ancien${l.length > 1 ? "s" : ""} document${l.length > 1 ? "s" : ""} trouvé${l.length > 1 ? "s" : ""}.`; }).catch(() => { $("#mig-count").textContent = ""; });

$("#mig").onclick = async () => {
  if(!await confirmDialog({ title:"Importer les anciens programmes ?", message:"Un dossier sera créé pour chaque patient, avec un nouveau code d'accès. Il faudra ensuite envoyer ce nouveau lien à chaque patient.", confirm:"Importer" })) return;
  const log = $("#mig-log"); log.hidden = false; log.textContent = "Import en cours…\n";
  $("#mig").disabled = true;
  try{
    const r = await C.migrateLegacy(msg => { log.textContent += msg + "\n"; log.scrollTop = log.scrollHeight; });
    log.textContent += `\nTerminé : ${r.patients} patient(s) créé(s), ${r.seances} séance(s) et ${r.modeles} modèle(s) importés.`;
    toast("Import terminé.", { type:"ok", action:{ label:"Voir les patients", run:() => location.href = "/patients.html" } });
  }catch(err){
    log.textContent += "\nErreur : " + (err.message || err);
    toast("L'import n'a pas abouti.", { type:"err" });
  }finally{ $("#mig").disabled = false; }
};
$("#logout").onclick = async () => {
  await C.logoutKine(); kineHint.set(false); location.replace("/index.html");
};
if(location.hash === "#migration") setTimeout(() => $("#migration").scrollIntoView({ behavior:"smooth" }), 200);
</script>
</body>
</html>
