<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modèles</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .mo-head{ display:flex; gap:12px; align-items:flex-end; justify-content:space-between; flex-wrap:wrap; }
  .mo-tools{ display:flex; flex-direction:column; gap:12px; margin:6px 0 16px; }
  .mo-selects{ display:flex; gap:8px; flex-wrap:wrap; }
  .mo-selects .select{ flex:1 1 150px; max-width:240px; }
  @media (max-width:560px){
    .mo-selects .select{ max-width:none; flex:1 1 calc(50% - 4px); min-width:0; }
    .mo-selects #patho{ flex-basis:100%; }
  }
  .mo-grid{ display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .mo-card{ position:relative; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); overflow:hidden; display:flex; flex-direction:column; }
  .mo-cover{ aspect-ratio:16/9; background:#fff; border:0; padding:0; cursor:pointer; overflow:hidden; display:block; width:100%; }
  .mo-cover img{ width:100%; height:100%; object-fit:cover; object-position:top; }
  .mo-cover .ph-img{ width:100%; height:100%; }
  .mo-own{ position:absolute; top:10px; left:10px; }
  .mo-body{ padding:14px 16px 4px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .mo-body h2{ font-size:var(--fs-lg); }
  .mo-levels{ display:flex; gap:6px; flex-wrap:wrap; margin-top:2px; }
  .mo-levels button{ border:1px solid var(--line); background:var(--surface); color:var(--ink-2); border-radius:999px; padding:4px 11px; font:inherit; font-size:var(--fs-sm); font-weight:700; cursor:pointer; }
  .mo-levels button[aria-pressed="true"]{ background:var(--lagon); border-color:var(--lagon); color:#fff; }
  .mo-actions{ display:flex; gap:8px; padding:12px 16px 16px; }
  .mo-actions .btn.primary{ flex:1; }
  .mo-exos{ display:flex; flex-direction:column; gap:10px; }
  .mo-exo{ display:flex; gap:12px; align-items:center; }
  .mo-exo img,.mo-exo .ph-img{ width:72px; height:56px; object-fit:contain; background:#fff; border-radius:var(--r-sm); border:1px solid var(--line); flex:none; }
  .mo-more{ margin-top:28px; }
  #lieux button{ display:inline-flex; align-items:center; gap:6px; }
  #lieux svg{ width:18px; height:18px; }
</style>
</head>
<body>
<main class="page wide" id="app"></main>
<script type="module">
import { $, $$, esc, icon, store, params, mountShell, exoTabsHTML, registerSW, toast, confirmDialog, openSheet, loadingHTML, emptyHTML, errorHTML, exoImageHTML, sessionDuration, fmtDuree, plural, setRunProgram, debounce } from "/assets/app.js";
import { norm } from "/assets/library.js";
import { evolTexte } from "/assets/evolution.js";
import { categories, niveaux, BUILTIN, normModele, groupModeles, coverOf, asProgram, catLabel, niveauLabel, isBuiltinHidden, choisirOptions } from "/assets/modeles.js";
import { toggleInList } from "/assets/settings.js";
import { ZONES, PATHOLOGIES as PATHOS, SPECIALITES, specialitesDe } from "/assets/classement.js";
import { openFilterDrawer, renderActifs, effacerFiltres, filterButtonHTML } from "/assets/filter-drawer.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
registerSW();
mountShell({ role:"kine", active:"bibliotheque" });
const C = await import("/assets/cloud.js");
const app = $("#app");

/* ---------- Filtres (mémorisés, ou imposés par l'adresse) ---------- */
/* Libellé du bouton de niveau (avec le numéro de copie s'il y a plusieurs versions au même niveau) */
const levelButton = m => `${m.niveau ? niveauLabel(m.niveau) : "Sans niveau"}${m.doublon ? ` (${m.doublon})` : ""}`;
const KEY = "gt_modeles_filters";
const asList = v => Array.isArray(v) ? v.filter(Boolean).map(String) : (v ? [String(v)] : []);
const F = (() => {
  const s = store.get(KEY, {}) || {};
  /* Anciennes préférences (un seul choix par filtre) reprises en listes */
  return { q: s.q || "", mine: !!s.mine || s.source === "mine", masques: !!s.masques || s.source === "masques",
    lieu: asList(s.lieu), cat: asList(s.cat), zone: asList(s.zone), spec: asList(s.spec), patho: asList(s.patho), niveau: asList(s.niveau) };
})();
const FACETS = [
  { k:"lieu", label:"Maison ou cabinet", ph:"Maison et cabinet" },
  { k:"cat", label:"Catégorie", ph:"Toutes les catégories" },
  { k:"zone", label:"Zone du corps", ph:"Toutes les zones" },
  { k:"spec", label:"Spécialité", ph:"Toutes les spécialités" },
  { k:"patho", label:"Pathologie", ph:"Toutes les pathologies", search:true },
  { k:"niveau", label:"Niveau", ph:"Tous les niveaux" }
];
const LIEUX = [["HEP", "À la maison"], ["CABINET", "Au cabinet"]];
const toutEffacer = () => { F.q = ""; F.mine = false; FACETS.forEach(f => F[f.k] = []); F.masques = false; };
/* Zone du corps et pathologie d'un modèle, déduites de sa zone et de son nom */
const ZN = ZONES.map(z => [z, norm(z)]);
const zoneOf = m => {
  const k = norm(m.zoneLabel);
  if(!k) return "";
  const exact = ZN.find(([, n]) => n === k) || ZN.find(([, n]) => k.includes(n) || n.includes(k));
  if(exact) return exact[0];
  if(/cheville|pied/.test(k)) return "Cheville et pied";
  if(/poignet|main/.test(k)) return "Poignet et main";
  if(/cou|cervic/.test(k)) return "Cervicales";
  if(/lomb|rachis/.test(k)) return "Dos";
  return m.zoneLabel;
};
const pathosOf = m => { const t = norm([m.nom, m.titre].join(" ")); return PATHOS.filter(p => p.re.test(t)).map(p => p.nom); };
/* Spécialités d'un modèle : celles de ses pathologies, sinon d'après sa catégorie */
const specsOf = m => {
  const s = new Set(pathosOf(m).flatMap(specialitesDe));
  if(m.categorie === "postop") s.add("Orthopédie");
  if(m.categorie === "prevention") s.add("Prévention et posture");
  if(/chute|equilibre/.test(norm(m.nom))) s.add("Gériatrie et chutes");
  return SPECIALITES.filter(x => s.has(x));
};
if(params.get("cat")) F.cat = [params.get("cat")];
/* Retour après l'enregistrement d'un modèle : tous les filtres sont retirés pour qu'il soit visible */
const nouveau = params.get("nouveau");
if(nouveau) toutEffacer();
if(params.get("zone")){
  const z = params.get("zone");
  const b = BUILTIN.find(m => m.raw.zone === z);
  F.zone = asList(b ? zoneOf(b) : (ZONES.find(x => norm(x) === norm(z.replace(/_/g, " "))) || ""));
}
const save = () => store.set(KEY, F);

app.innerHTML = `
  <div class="page-head exo-head"><h1>Exercices</h1><a class="btn primary" id="new" href="/config.html?modele=new">${icon("plus")}Nouveau modèle</a></div>
  ${exoTabsHTML("modeles")}
  <p class="lead exo-lead">Programmes prêts à l'emploi et vos séances types. Choisissez un modèle et un niveau, puis adaptez-le pour un patient.</p>
  <div class="mo-tools lib-tools">
    <div class="lib-search-row">
      <label class="input-icon"><span class="sr-only">Rechercher</span>${icon("search")}<input class="input" id="q" type="search" placeholder="Rechercher : lombalgie, LCA, épaule…" value="${esc(F.q)}"></label>
      ${filterButtonHTML()}
      <button class="btn lib-mine-btn" type="button" id="mine" aria-pressed="${F.mine}" title="Seulement mes modèles">${icon("folder")}<span class="lbl">Mes modèles</span></button>
    </div>
    <div class="lib-active" id="actifs" hidden></div>
  </div>
  <div class="small muted" id="count" style="margin-bottom:10px"></div>
  <div id="list">${loadingHTML()}</div>
  <section class="mo-more"><div class="list">
    <a class="list-item" href="/mes_programmes.html"><span class="li-ico">${icon("star")}</span><span class="li-main"><span class="li-title">Séances favorites</span><span class="li-sub">Enregistrées sur cet appareil</span></span><span class="li-end">${icon("chevron")}</span></a>
    <a class="list-item" href="/programmescourse.html"><span class="li-ico">${icon("run")}</span><span class="li-main"><span class="li-title">Reprise de course</span><span class="li-sub">Générateur de programme progressif</span></span><span class="li-end">${icon("chevron")}</span></a>
  </div></section>`;

let mine = [];
const chosen = new Map(); // groupe → id du niveau affiché
/* Les modèles fournis masqués, ou remplacés par votre version, ne s'affichent pas
   (sauf avec le filtre « Modèles fournis masqués »). */
const all = () => {
  const replaced = new Set(mine.map(m => m.remplace).filter(Boolean));
  const builtins = BUILTIN.filter(b => !replaced.has(b.id) && (F.masques ? isBuiltinHidden(b.id) : !isBuiltinHidden(b.id)));
  return F.masques ? builtins : [...mine, ...builtins];
};

/* ---------- Actions ---------- */
const findM = id => all().find(m => m.id === id);
const useIt = async m => { m = await choisirOptions(m); if(!m) return; store.set("gt_draft", asProgram(m)); location.href = "/config.html?draft=1"; };
const runIt = async m => { m = await choisirOptions(m); if(!m) return; setRunProgram(asProgram(m)); location.href = "/timer.html"; };
const editIt = m => { location.href = m.mine ? `/config.html?modele=${encodeURIComponent(m.id)}` : `/config.html?modele=${encodeURIComponent(m.id)}&remplace=1`; };
const copyIt = m => { location.href = `/config.html?modele=new&from=${encodeURIComponent(m.id)}`; };
const pdfIt = async m => {
  if(m.pdf){ window.open(m.pdf, "_blank"); return; }
  const opt = !!m.options;
  m = await choisirOptions(m); if(!m) return;
  store.set("programme_pdf", { ...asProgram(m), patient:"", niveau: m.niveau ? `Niveau ${m.niveau}` : "" });
  if(opt) location.href = "/program_pdf.html"; else window.open("/program_pdf.html", "_blank");
};
const noteOf = e => e.conseil_kine || (e.consignes?.length ? "" : String(e.conseil || "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, ""));

function detail(m, group){
  const levels = group.items.map(x => x.niveau).filter(Boolean);
  const next = Math.max(0, ...levels, m.niveau || 0) + 1;
  const s = openSheet({
    title: m.titre,
    wide: true,
    body: `
      <div class="row wrap" style="--gap:6px;margin-bottom:14px">
        <span class="badge lagon">${esc(catLabel(m.categorie))}</span>
        ${m.zoneLabel ? `<span class="badge">${esc(m.zoneLabel)}</span>` : ""}
        ${m.niveau ? `<span class="badge">${esc(niveauLabel(m.niveau))}</span>` : ""}
        <span class="badge">${plural(m.exercices.length, "exercice")}, ${esc(fmtDuree(sessionDuration(m)))}${m.series > 1 ? `, ${m.series} tours` : ""}</span>
        ${m.mine ? `<span class="badge sun">${icon("star")}${m.remplace ? "Ma version" : "Mon modèle"}</span>` : `<span class="badge">Fourni avec l'application</span>`}
      </div>
      <div class="mo-exos">${m.exercices.map((e, i) => `<div class="mo-exo">${exoImageHTML(e.image, "")}<div><strong>${i + 1}. ${esc(e.nom)}</strong><div class="small muted">${e.reps} × ${esc(fmtDuree(e.ex))}, repos ${esc(fmtDuree(e.repos))}</div>${noteOf(e) ? `<div class="small">${esc(noteOf(e))}</div>` : ""}${evolTexte(e) ? `<div class="small" style="color:var(--lagon-strong);font-weight:700">${icon("trendUp", "ic-inline")} ${esc(evolTexte(e))}</div>` : ""}</div></div>`).join("")}</div>
      <div class="row wrap" style="--gap:8px;margin-top:18px">
        <button class="btn sm" type="button" data-a="pdf">${icon("pdf")}Fiche PDF</button>
        <button class="btn sm" type="button" data-a="print">${icon("print")}Imprimer (1 page)</button>
        <button class="btn sm" type="button" data-a="edit">${icon("edit")}Modifier</button>
        <button class="btn sm" type="button" data-a="copy">${icon("copy")}Dupliquer</button>
        ${next <= niveaux().length ? `<button class="btn sm" type="button" data-a="level">${icon("plus")}Créer : ${esc(niveauLabel(next).toLowerCase())}</button>` : ""}
        ${m.builtin ? `<button class="btn sm" type="button" data-a="hide">${icon(isBuiltinHidden(m.id) ? "eye" : "close")}${isBuiltinHidden(m.id) ? "Réafficher" : "Masquer"}</button>` : ""}
        ${m.mine ? `<button class="btn sm danger" type="button" data-a="del">${icon(m.remplace ? "history" : "trash")}${m.remplace ? "Revenir à la version d'origine" : "Supprimer"}</button>` : ""}
      </div>`,
    foot: `<button class="btn" type="button" data-a="run">${icon("play")}Lancer</button><button class="btn primary" type="button" data-a="use">${icon("share")}Utiliser pour un patient</button>`
  });
  s.el.querySelectorAll("[data-a]").forEach(b => b.onclick = async () => {
    const a = b.dataset.a;
    if(a === "use") useIt(m);
    if(a === "run") runIt(m);
    if(a === "pdf") pdfIt(m);
    if(a === "print"){
      /* Modèle à options : choix d'abord, puis impression dans cet onglet (un nouvel onglet ouvert après coup serait bloqué) */
      const mm = await choisirOptions(m); if(!mm) return;
      store.set("programme_print", { ...asProgram(mm), patient:"" });
      if(m.options) location.href = "/impression.html"; else window.open("/impression.html", "_blank");
    }
    if(a === "edit") editIt(m);
    if(a === "copy") copyIt(m);
    if(a === "hide"){
      const hide = !isBuiltinHidden(m.id);
      try{
        await toggleInList("masques.modeles", m.id, hide);
        s.close(); render();
        toast(hide ? `« ${m.titre} » est masqué. Filtre « Modèles fournis masqués » pour le retrouver.` : `« ${m.titre} » est de nouveau visible.`, { type:"ok", duration:5000 });
      }catch(err){ console.error(err); toast("Enregistrement impossible. Vérifiez la règle « reglages » dans Firebase (voir Aide).", { type:"err", duration:7000 }); }
    }
    if(a === "level") location.href = `/config.html?modele=new&from=${encodeURIComponent(m.id)}&niveau=${next}`;
    if(a === "del"){
      if(!await confirmDialog(m.remplace
        ? { title:"Revenir à la version d'origine ?", message:"Votre version est supprimée et le modèle fourni avec l'application réapparaît.", confirm:"Revenir à l'original" }
        : { title:"Supprimer ce modèle ?", message:`« ${m.titre} » sera supprimé. Les programmes déjà envoyés aux patients ne changent pas.`, confirm:"Supprimer", danger:true })) return;
      await C.deleteModele(m.id);
      mine = mine.filter(x => x.id !== m.id);
      s.close(); toast("Modèle supprimé.", { type:"ok" }); render();
    }
  });
}

/* ---------- Affichage ---------- */
const matchF = (m, k, v) => {
  if(!v.length) return true;
  switch(k){
    case "lieu":   return !m.lieu || m.lieu === "MIXTE" || v.includes(m.lieu);
    case "cat":    return v.includes(m.categorie);
    case "zone":   return v.includes(zoneOf(m));
    case "spec":   return specsOf(m).some(x => v.includes(x));
    case "patho":  return pathosOf(m).some(x => v.includes(x));
    case "niveau": return v.includes(String(m.niveau || ""));
  }
  return true;
};
const okQ = m => {
  if(!F.q) return true;
  const hay = norm([m.nom, m.titre, catLabel(m.categorie), m.zoneLabel, ...m.exercices.map(e => e.nom)].join(" "));
  return norm(F.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
};
/* Modèle qui passe tous les filtres (sauf « skip », pour compter les choix d'un tiroir) */
const passe = (m, skip) => (!F.mine || m.mine) && okQ(m) && FACETS.every(f => f.k === skip || matchF(m, f.k, F[f.k]));
function matches(m){ return passe(m); }

/* Choix d'un tiroir, avec le nombre de modèles qu'ils donneraient */
function options(k){
  const pool = all().filter(m => passe(m, k));
  const n = {};
  const add = v => { if(v) n[v] = (n[v] || 0) + 1; };
  let opts;
  if(k === "lieu"){
    pool.forEach(m => LIEUX.forEach(([v]) => { if(!m.lieu || m.lieu === "MIXTE" || m.lieu === v) add(v); }));
    opts = LIEUX.map(([v, label]) => ({ v, label }));
  }else if(k === "cat"){
    pool.forEach(m => add(m.categorie));
    opts = categories().map(c => ({ v:c.id, label:c.label }));
  }else if(k === "zone"){
    pool.forEach(m => add(zoneOf(m)));
    opts = [...ZONES, ...Object.keys(n).filter(z => !ZONES.includes(z)).sort()].map(v => ({ v, label:v }));
  }else if(k === "spec"){
    pool.forEach(m => specsOf(m).forEach(add));
    opts = SPECIALITES.map(v => ({ v, label:v }));
  }else if(k === "niveau"){
    pool.forEach(m => add(String(m.niveau || "")));
    opts = niveaux().map(x => ({ v:String(x.n), label:x.label }));
  }else{
    pool.forEach(m => pathosOf(m).forEach(add));
    const order = [...ZONES, "Général"];
    opts = PATHOS.filter(p => n[p.nom] || F.patho.includes(p.nom))
      .map(p => ({ v:p.nom, label:p.nom, group: F.zone.length === 1 ? "" : (p.zone || "Général") }))
      .sort((a, b) => (order.indexOf(a.group) - order.indexOf(b.group)) || ((n[b.v] || 0) - (n[a.v] || 0)));
  }
  return opts.map(o => ({ ...o, n: n[o.v] || 0 })).filter(o => o.n || F[k].includes(o.v));
}
const labelOf = (k, v) => k === "lieu" ? (LIEUX.find(x => x[0] === v)?.[1] || v) : k === "cat" ? catLabel(v) : k === "niveau" ? niveauLabel(Number(v)) : v;
let drawer = null;
const cfg = {
  facets: FACETS, state: F, labelOf, options,
  toggles: [{ k:"masques", label:"Afficher seulement les modèles fournis masqués", chip:"Modèles masqués" }],
  total: () => all().filter(matches).length,
  unit: ["modèle", "modèles"],
  onChange: () => update()
};
function renderFilters(){
  renderActifs(cfg, $("#actifs"), $("[data-filters]"));
  $("#mine").setAttribute("aria-pressed", String(F.mine));
  drawer?.refresh();
}
const update = () => { save(); renderFilters(); render(); };

function render(){
  const visible = all().filter(matches);
  const groups = groupModeles(visible).sort((a, b) => (b.mine - a.mine) || a.nom.localeCompare(b.nom, "fr", { numeric:true }));
  $("#count").innerHTML = groups.length ? esc(`${plural(groups.length, "modèle")}${visible.length > groups.length ? `, ${plural(visible.length, "niveau", "niveaux")} au total` : ""}`) : "";
  if(!groups.length){
    const filtered = F.q || F.mine || F.masques || FACETS.some(f => F[f.k].length);
    $("#list").innerHTML = `<div class="panel">${emptyHTML(filtered
      ? { ico:"search", title:"Aucun modèle", text:"Essayez un autre mot ou retirez un filtre.", action:`<button class="btn" type="button" id="reset">Retirer les filtres</button>` }
      : { ico:"layers", title:"Aucun modèle", text:"Créez votre premier modèle.", action:`<a class="btn primary" href="/config.html?modele=new">${icon("plus")}Nouveau modèle</a>` })}</div>`;
    $("#reset")?.addEventListener("click", () => { toutEffacer(); $("#q").value = ""; update(); });
    return;
  }
  $("#list").innerHTML = `<div class="mo-grid">${groups.map(g => {
    const cur = g.items.find(x => x.id === chosen.get(g.key)) || g.items[0];
    const showLevels = g.items.length > 1 || g.items[0].niveau;
    return `
      <article class="mo-card">
        ${cur.mine ? `<span class="badge sun mo-own">${icon("star")}${cur.remplace ? "Ma version" : "Mon modèle"}</span>` : ""}
        <button class="mo-cover" type="button" data-see="${esc(g.key)}" aria-label="Voir ${esc(cur.titre)}">${coverOf(cur) ? `<img src="${esc(coverOf(cur))}" alt="" loading="lazy">` : exoImageHTML(null)}</button>
        <div class="mo-body">
          <span class="small faint" style="font-weight:700">${esc(catLabel(g.categorie))}${g.zoneLabel ? `, ${esc(g.zoneLabel)}` : ""}${cur.lieu === "HEP" ? " · À la maison" : cur.lieu === "CABINET" ? " · Au cabinet" : cur.lieu === "MIXTE" ? ` · <span style="color:var(--danger)">Mixte</span>` : ""}</span>
          <h2>${esc(g.nom)}</h2>
          ${showLevels ? `<div class="mo-levels" role="group" aria-label="Niveau">${g.items.map(x => `<button type="button" data-lv="${esc(g.key)}" data-id="${esc(x.id)}" aria-pressed="${x === cur}">${esc(levelButton(x))}</button>`).join("")}</div>` : ""}
          <span class="small muted">${cur.options ? `${plural(cur.exercices.filter(e => !e.opt).length, "exercice")} + 1 par ${esc(cur.options.titre.toLowerCase().includes("nerf") ? "nerf choisi" : "choix")}` : `${plural(cur.exercices.length, "exercice")}, ${esc(fmtDuree(sessionDuration(cur)))}`}${cur.series > 1 ? `, ${cur.series} tours` : ""}</span>
        </div>
        <div class="mo-actions">
          <button class="btn primary" type="button" data-use="${esc(cur.id)}">${icon("share")}Utiliser</button>
          <button class="btn" type="button" data-run="${esc(cur.id)}" aria-label="Lancer" title="Lancer">${icon("play")}</button>
          <button class="btn" type="button" data-edit="${esc(cur.id)}" aria-label="Modifier" title="Modifier">${icon("edit")}</button>
        </div>
      </article>`;
  }).join("")}</div>`;
  const gByKey = new Map(groups.map(g => [g.key, g]));
  $$("[data-lv]").forEach(b => b.onclick = () => { chosen.set(b.dataset.lv, b.dataset.id); render(); });
  $$("[data-use]").forEach(b => b.onclick = () => useIt(findM(b.dataset.use)));
  $$("[data-run]").forEach(b => b.onclick = () => runIt(findM(b.dataset.run)));
  $$("[data-edit]").forEach(b => b.onclick = () => editIt(findM(b.dataset.edit)));
  $$("[data-see]").forEach(b => b.onclick = () => {
    const g = gByKey.get(b.dataset.see);
    const cur = g.items.find(x => x.id === chosen.get(g.key)) || g.items[0];
    detail(cur, g);
  });
  $("#new").href = `/config.html?modele=new${F.cat.length === 1 ? `&cat=${encodeURIComponent(F.cat[0])}` : ""}`;
}

$("#q").addEventListener("input", debounce(e => { F.q = e.target.value.trim(); save(); render(); drawer?.refresh(); }, 140));
$("[data-filters]").onclick = () => { drawer = openFilterDrawer(cfg); };
$("#mine").onclick = () => { F.mine = !F.mine; update(); };

renderFilters();
try{
  mine = (await C.listModeles()).map(r => normModele(r)).filter(m => m.exercices.length);
  if(nouveau) save();
  $("#q").value = F.q;
  renderFilters();
  render();
  /* Met en évidence le modèle qu'on vient d'enregistrer */
  const m = nouveau && mine.find(x => x.id === nouveau);
  if(m){
    const g = groupModeles(all().filter(matches)).find(g => g.items.includes(m));
    if(g){ chosen.set(g.key, m.id); render(); }
    const card = document.querySelector(`[data-use="${CSS.escape(m.id)}"]`)?.closest(".mo-card");
    if(card){ card.scrollIntoView({ block:"center" }); card.style.outline = "3px solid var(--soleil)"; setTimeout(() => card.style.outline = "", 4000); }
  }else if(nouveau){
    toast("Le modèle vient d'être enregistré mais n'apparaît pas encore. Rechargez la page dans quelques secondes.", { type:"err", duration:8000 });
  }
}catch(err){
  console.error(err);
  render();
  $("#list").insertAdjacentHTML("afterbegin", `<div class="notice warn" style="margin-bottom:12px">${icon("alert")}<span>Vos modèles n'ont pas pu être chargés. Seuls les modèles fournis avec l'application sont affichés.</span></div>`);
}
</script>
</body>
</html>
