<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Modèles</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
<style>
  .m-group + .m-group{ margin-top:16px; }
  .m-row{ flex-wrap:wrap; }
  .m-row .li-main{ flex:1 1 200px; }
  .m-row .m-act{ display:flex; gap:4px; margin-left:auto; }
</style>
</head>
<body>
<main class="page wide" id="app"></main>
<script type="module">
import { $, $$, esc, icon, store, mountShell, registerSW, toast, confirmDialog, loadingHTML, emptyHTML, errorHTML, sessionDuration, fmtDuree, plural, setRunProgram, debounce } from "/assets/app.js";
import { norm } from "/assets/library.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
registerSW();
mountShell({ role:"kine", active:"outils" });
const C = await import("/assets/cloud.js");
const app = $("#app");

app.innerHTML = `
  <div class="page-head"><h1>Modèles</h1><a class="btn primary" href="/config.html?nouveau=1">${icon("plus")}Nouveau modèle</a>
    <p class="lead">Vos séances types du cabinet. Utilisez-en une comme point de départ pour un patient.</p></div>
  <label class="input-icon" style="display:block;margin-bottom:16px"><span class="sr-only">Rechercher</span>${icon("search")}<input class="input" id="q" type="search" placeholder="Rechercher un modèle"></label>
  <div id="list">${loadingHTML()}</div>
  <section class="section"><div class="list">
    <a class="list-item" href="/pathologies.html"><span class="li-ico">${icon("stethoscope")}</span><span class="li-main"><span class="li-title">Programmes par pathologie</span><span class="li-sub">Lombalgie, coiffe, capsulite…</span></span><span class="li-end">${icon("chevron")}</span></a>
    <a class="list-item" href="/mes_programmes.html"><span class="li-ico">${icon("star")}</span><span class="li-main"><span class="li-title">Séances favorites</span><span class="li-sub">Enregistrées sur cet appareil</span></span><span class="li-end">${icon("chevron")}</span></a>
  </div></section>`;

let modeles = [];
const groupName = nom => { const m = String(nom || "").trim().match(/^(.*?)[\s_-]+(P\d+|\d+[A-Za-z]?)$/i); return m ? m[1].trim() : String(nom || "Sans nom").trim(); };

function render(){
  const q = norm($("#q").value.trim());
  const list = modeles.filter(m => !q || norm(m.nom).includes(q));
  if(!modeles.length){ $("#list").innerHTML = `<div class="panel">${emptyHTML({ ico:"layers", title:"Aucun modèle", text:"Créez une séance puis choisissez « Enregistrer comme modèle ».", action:`<a class="btn primary" href="/config.html?nouveau=1">${icon("plus")}Créer une séance</a>` })}</div>`; return; }
  if(!list.length){ $("#list").innerHTML = `<div class="panel">${emptyHTML({ ico:"search", title:"Aucun modèle trouvé" })}</div>`; return; }
  const groups = new Map();
  list.forEach(m => { const g = groupName(m.nom); if(!groups.has(g)) groups.set(g, []); groups.get(g).push(m); });
  $("#list").innerHTML = [...groups.entries()].sort((a, b) => a[0].localeCompare(b[0], "fr")).map(([g, items]) => `
    <section class="m-group">
      ${items.length > 1 ? `<div class="section-title" style="font-size:var(--fs-md)">${icon("folder", "ic-inline lagon")} ${esc(g)}<span class="badge">${items.length}</span></div>` : ""}
      <div class="list">${items.sort((a, b) => a.nom.localeCompare(b.nom, "fr", { numeric:true })).map(m => `
        <div class="list-item m-row">
          <span class="li-ico">${icon("layers")}</span>
          <span class="li-main"><span class="li-title">${esc(m.nom)}</span><span class="li-sub">${plural((m.data?.exercices || []).length, "exercice")}, ${esc(fmtDuree(sessionDuration(m.data)))}</span></span>
          <span class="m-act">
            <button class="btn sm primary" type="button" data-use="${esc(m.id)}">Utiliser</button>
            <button class="icon-btn sm" type="button" data-run="${esc(m.id)}" aria-label="Lancer">${icon("play")}</button>
            <button class="icon-btn sm" type="button" data-edit="${esc(m.id)}" aria-label="Modifier">${icon("edit")}</button>
            <button class="icon-btn sm" type="button" data-pdf="${esc(m.id)}" aria-label="Fiche PDF">${icon("pdf")}</button>
            <button class="icon-btn sm danger" type="button" data-del="${esc(m.id)}" aria-label="Supprimer">${icon("trash")}</button>
          </span>
        </div>`).join("")}</div>
    </section>`).join("");

  const find = id => modeles.find(m => m.id === id);
  $$("[data-use]").forEach(b => b.onclick = () => { const m = find(b.dataset.use); store.set("gt_draft", { nom:m.nom, series:m.data?.series || 1, exercices:m.data?.exercices || [] }); location.href = "/config.html?draft=1"; });
  $$("[data-run]").forEach(b => b.onclick = () => { const m = find(b.dataset.run); setRunProgram({ ...m.data, nom:m.nom }); location.href = "/timer.html"; });
  $$("[data-edit]").forEach(b => b.onclick = () => { store.set("gt_edit", { type:"modele", id:b.dataset.edit }); location.href = "/config.html?edit=1"; });
  $$("[data-pdf]").forEach(b => b.onclick = () => { const m = find(b.dataset.pdf); store.set("programme_pdf", { ...m.data, nom:m.nom, patient:"", niveau:(m.nom.match(/P\d+/) || [""])[0] }); window.open("/program_pdf.html", "_blank"); });
  $$("[data-del]").forEach(b => b.onclick = async () => {
    const m = find(b.dataset.del);
    if(!await confirmDialog({ title:"Supprimer ce modèle ?", message:`« ${m.nom} » sera supprimé. Les programmes déjà envoyés aux patients ne changent pas.`, confirm:"Supprimer", danger:true })) return;
    await C.deleteModele(m.id); modeles = modeles.filter(x => x.id !== m.id); toast("Modèle supprimé.", { type:"ok" }); render();
  });
}

try{ modeles = await C.listModeles(); render(); $("#q").addEventListener("input", debounce(render, 120)); }
catch(err){ $("#list").innerHTML = errorHTML(err); }
</script>
</body>
</html>
