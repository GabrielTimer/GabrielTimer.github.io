<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Courrier au médecin</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Courrier de suivi kiné au médecin : lettre A4 rédigée d'après le bilan, le traitement et le suivi à domicile.
     URL : /courrier.html?patient=CODE (dernier bilan) ou &bilan=ID.
     Cases « Dans la lettre » : ce que la lettre résume. Cases « Joindre » : pièces jointes imprimées à la suite.
     Tout le texte de la lettre reste modifiable avant impression. */
  body{ background:var(--bg); }
  .tools{ position:sticky; top:0; z-index:5; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding:12px var(--gutter); background:var(--surface); border-bottom:1px solid var(--line); }
  .tools .field{ margin:0; min-width:0; }
  .tools .field label{ font-size:var(--fs-xs); }
  .tools .spacer{ flex:1; }
  .tools .hint{ width:100%; margin:0; }
  #med{ min-width:220px; }
  .opts{ width:100%; display:flex; flex-wrap:wrap; gap:6px 14px; align-items:center; font-size:var(--fs-sm); }
  .opts > b{ font-size:var(--fs-xs); text-transform:uppercase; letter-spacing:.06em; color:var(--ink-3); min-width:96px; }
  .sheet-a4{ width:min(100% - 24px, 210mm); margin:20px auto 20px; background:#fff; color:#14303A; padding:18mm 18mm 16mm; box-shadow:var(--shadow-2); border-radius:6px; font-size:11pt; line-height:1.55; }
  #annexes .sheet-a4{ font-size:9.8pt; line-height:1.45; }
  #annexes{ margin-bottom:60px; }
  .lt-from{ display:flex; gap:12px; align-items:flex-start; font-size:9.5pt; color:#47616B; white-space:pre-line; }
  .lt-from img{ width:44px; height:44px; object-fit:contain; }
  .lt-from strong{ display:block; font-size:11.5pt; color:#0B6E80; }
  .lt-to{ margin:26px 0 0 auto; width:min(48%, 80mm); font-size:11pt; }
  .lt-to .vide{ color:#C93A3A; }
  .lt-date{ text-align:right; margin:22px 0 16px; }
  .lt-obj{ margin:0 0 4px; }
  .lt-ref{ margin:0 0 18px; color:#47616B; font-size:10pt; }
  .lt-body p{ margin:0 0 10px; text-align:justify; }
  .lt-body:focus{ outline:2px dashed #9FB6BC; outline-offset:6px; border-radius:4px; }
  .lt-pj{ margin-top:14px; font-size:10pt; }
  .lt-sign{ margin:24px 0 0 auto; width:min(48%, 80mm); }
  .lt-sign .space{ height:52px; }
  .ax h1{ font-size:14pt; color:#0B6E80; margin:0 0 2px; }
  .ax h2{ font-size:10.5pt; margin:14px 0 6px; padding-bottom:3px; border-bottom:1.5px solid #138FA6; color:#0B6E80; }
  .ax .sub{ color:#6F878F; margin:0 0 10px; }
  .ax table{ width:100%; border-collapse:collapse; }
  .ax th{ text-align:left; font-size:8.5pt; color:#6F878F; font-weight:700; border-bottom:1px solid #C9D9DD; padding:4px 6px; }
  .ax td{ border-bottom:1px solid #E3EDEF; padding:4px 6px; vertical-align:top; }
  .ax td.l{ width:34%; color:#47616B; font-weight:600; }
  .ax td.n{ white-space:nowrap; font-variant-numeric:tabular-nums; }
  .ax .alerte{ color:#C93A3A; font-weight:700; margin:4px 0; }
  .ax .muted{ color:#6F878F; }
  @media print{
    @page{ size:A4; margin:14mm; }
    body{ background:#fff; }
    .tools{ display:none; }
    .sheet-a4{ width:auto; margin:0; padding:0; box-shadow:none; border-radius:0; }
    #annexes .sheet-a4{ break-before:page; }
    .lt-to .vide{ color:inherit; }
    .lt-body p{ break-inside:avoid; }
    .ax h2{ break-after:avoid; } .ax tr{ break-inside:avoid; }
  }
</style>
</head>
<body>
<div class="tools">
  <a class="btn sm ghost" id="back" href="/patients.html">Retour</a>
  <div class="field"><label for="med">Médecin destinataire</label><input class="input" id="med" type="text" autocomplete="off" placeholder="Nom du médecin (ex. Martin)"></div>
  <div class="field" id="f-bilan" hidden><label for="bilan">Bilan</label><select class="input" id="bilan"></select></div>
  <span class="spacer"></span>
  <button class="btn" type="button" id="copy">Copier</button>
  <button class="btn" type="button" id="mail">E-mail</button>
  <button class="btn primary" type="button" id="print">Imprimer ou PDF</button>
  <div class="opts" id="o-lettre"><b>Dans la lettre</b></div>
  <div class="opts" id="o-joindre"><b>Joindre</b></div>
  <p class="hint">La lettre résume l'essentiel ; les pièces jointes cochées s'impriment à la suite. Touchez le texte pour le modifier.</p>
</div>
<div class="sheet-a4" id="doc"><div class="loading"><div class="spinner"></div><span>Rédaction du courrier…</span></div></div>
<div id="annexes"></div>
<script type="module">
import { $, $$, esc, icon, params, settings, logoSrc, KINE, toast, confirmDialog, groupProgrammes, evaTrend, fmtNum } from "/assets/app.js";
import { nomAffiche } from "/assets/noms.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
const C = await import("/assets/cloud.js");
const B = await import("/assets/bilan-core.js");
const T = await import("/assets/bilan-traitement.js");
const P = await import("/assets/patient.js");
const { fmtScore } = await import("/assets/questionnaires.js");

const cle = params.get("patient");
if(!cle) location.replace("/patients.html");
$("#back").href = `/cloud.html?patient=${encodeURIComponent(cle)}`;
$("#back").innerHTML = icon("back") + "Retour à la fiche";
$("#print").innerHTML = icon("print") + $("#print").textContent;
$("#copy").innerHTML = icon("copy") + $("#copy").textContent;
$("#mail").innerHTML = icon("mail") + $("#mail").textContent;

const [patient, K, bilans, seancesAll, suivis, questionnaires, notesAll] = await Promise.all([
  C.getPatient(cle, { fiche:true }), B.loadClinic(), C.listBilans(cle).catch(() => []),
  C.listSeances(cle).catch(() => []), C.listSuivis(cle).catch(() => []), C.listQuestionnaires().catch(() => []),
  C.listNotes(cle).catch(() => [])
]);
if(!patient){ $("#doc").innerHTML = "<p>Patient introuvable.</p>"; throw new Error("patient"); }
const nom = nomAffiche(patient.nom);
document.title = `Courrier – ${nom}`;
const liste = bilans.filter(b => b.etat);               // du plus récent au plus ancien
const premier = liste.length ? liste[liste.length - 1] : null;

/* ---------- Petits outils de rédaction ---------- */
const G = patient.genre === "f" ? "f" : patient.genre === "h" ? "h" : "";
const ac = (m, f, n = m + "(e)") => G === "f" ? f : G === "h" ? m : n;   // adressé / adressée / adressé(e)
const civ = G === "f" ? "Mme " : G === "h" ? "M. " : "";
const ilElle = ac("il", "elle", "il ou elle"), Il = ilElle.charAt(0).toUpperCase() + ilElle.slice(1);
const low = s => { s = String(s || ""); return /^.[A-ZÀ-Ý0-9]/.test(s) ? s : s.charAt(0).toLowerCase() + s.slice(1); };   // garde les sigles (HTA, LCA, IRM)
const et = a => { a = a.filter(Boolean); return a.length <= 1 ? (a[0] || "") : a.slice(0, -1).join(", ") + " et " + a[a.length - 1]; };
const phrase = s => { s = String(s || "").trim(); if(!s) return ""; s = s.charAt(0).toUpperCase() + s.slice(1); return /[.!?]$/.test(s) ? s : s + "."; };
const joinSec = (S, key) => [...(S.c?.[key] || []), String(S.f?.[key] || "").trim()].filter(Boolean);
const q = (S, id) => S.q?.[id];
const qa = (S, id) => [].concat(S.q?.[id] || []);
const isoDe = ts => { const d = new Date(ts); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`; };
const cab = settings.cabinet || {};
const ville = (String(cab.adresse || "").trim().split("\n").pop().match(/\d{5}\s+(.+)$/) || [])[1] || "";

/* Mesures du bilan : questionnaires (MES) et tests fonctionnels (TF), avec leur unité */
const sansParen = l => l.replace(/\s*\([^)]*\)$/, "");
function mesures(S, quoi){
  const f = S?.f || {}, out = [];
  if(quoi === "quest") K.MES.forEach(([k, l]) => {
    const v = String(f[k] ?? "").trim(); if(!v) return;
    const u = (l.match(/\(([^)]*)\)$/) || [])[1] || "";
    out.push({ k, label: sansParen(l), val: v + (u === "%" ? " %" : u.startsWith("/") ? u : u === "0-10" ? "/10" : "") });
  });
  if(quoi === "tf") (K.TF || []).forEach(([k, n, u]) => {
    const v = String(f[k] ?? "").trim(); if(v) out.push({ k, label: n, val: `${v} ${u}`.trim() });
  });
  return out;
}
/* Tests cliniques cotés dans le bilan : [{ zone, test, pos, lrp, lrm }] et drapeaux rouges */
function testsCliniques(S){
  const tests = [], rf = [], rfm = [];
  if(!S) return { tests, rf, rfm };
  Object.keys(S.pain || {}).filter(B.regionOf).concat(B.nomsVirtuels().filter(n => S.cl?.[n] && !(n in (S.pain || {})))).forEach(n => {
    const r = K.REG[B.regionOf(n) || "vertiges"], c = S.cl?.[n];
    if(!r || !c) return;
    r.T.forEach(x => { if(c.t?.[x[0]]) tests.push({ zone:n, test:x[0], pos:c.t[x[0]] > 0, lrp:x[2], lrm:x[3] }); });
    const f = (c.s || []).filter(x => r.RF.includes(x));
    if(f.length){ rf.push(...f); if(r.RFm && !rfm.includes(r.RFm)) rfm.push(r.RFm); }
  });
  return { tests, rf, rfm };
}
/* Questionnaires validés par le patient dans l'application */
function questApp(depuis){
  const qS = suivis.filter(s => s.type === "questionnaire" && s.score != null && (!depuis || isoDe(s.date) >= depuis));
  return [...new Set(qS.map(s => s.qid))].map(id => {
    const r = qS.filter(s => s.qid === id).sort((a, b) => a.date - b.date);
    const qq = questionnaires.find(x => x.id === id) || { nom: r[0].nom };
    return { q: qq, r, first: r[0], last: r[r.length - 1] };
  });
}

/* ---------- Options ---------- */
const OPTS_L = [
  ["hist", "Histoire et antécédents", true],
  ["exam", "Douleur et examen", true],
  ["tests", "Tests cliniques", true],
  ["quest", "Questionnaires et mesures", true],
  ["evol", "Évolution", true],
  ["suivi", "Suivi à domicile", true],
  ["tx", "Traitement proposé", true]
];
const OPTS_J = [
  ["j-bilan", "Bilan complet"],
  ["j-tests", "Tests cliniques détaillés"],
  ["j-quest", "Questionnaires et mesures"],
  ["j-suivi", "Suivi à domicile détaillé"]
];
const memoOpts = "gt_courrier_opts";
let memo = {}; try{ memo = JSON.parse(localStorage.getItem(memoOpts) || "{}"); }catch(e){}
$("#o-lettre").insertAdjacentHTML("beforeend", OPTS_L.map(([k, l, d]) => `<label class="check"><input type="checkbox" data-o="${k}" ${(memo[k] ?? d) ? "checked" : ""}> ${esc(l)}</label>`).join(""));
$("#o-joindre").insertAdjacentHTML("beforeend", OPTS_J.map(([k, l]) => `<label class="check"><input type="checkbox" data-o="${k}" ${memo[k] ? "checked" : ""}> ${esc(l)}</label>`).join(""));
const opt = k => !!$(`[data-o="${k}"]`)?.checked;
const optsActuelles = () => Object.fromEntries($$("[data-o]").map(x => [x.dataset.o, x.checked]));

/* ---------- Données du suivi à domicile (depuis le premier bilan) ---------- */
function suiviDomicile(){
  const depuis = premier?.date || "";
  const valides = seancesAll.filter(s => s.data && Array.isArray(s.data.exercices) && s.terminee && s.dateValidation && (!depuis || isoDe(s.dateValidation) >= depuis))
    .sort((a, b) => a.dateValidation - b.dateValidation);
  const progs = groupProgrammes(seancesAll.filter(s => s.data && Array.isArray(s.data.exercices))).programmes;
  const dus = progs.flatMap(p => p.seances).filter(s => !depuis || !s.datePrevue || isoDe(new Date(s.datePrevue)) >= depuis);
  const evas = valides.map(s => s.eva).filter(x => x !== null && x !== undefined && x !== "").map(Number);
  return { depuis, valides, progs, reg: P.regularity(dus), evas, tr: evaTrend(evas) };
}

/* ---------- Le courrier, paragraphe par paragraphe (en phrases) ---------- */
const ART = {
  /* observation */ "Boiterie":"une boiterie", "Attitude antalgique":"une attitude antalgique", "Raideur":"une raideur", "Œdème":"un œdème", "Contracture":"une contracture", "Amplitude limitée":"une limitation des amplitudes", "Force diminuée":"une diminution de la force", "Troubles sensitifs":"des troubles sensitifs",
  /* antécédents */ "HTA":"une HTA", "Diabète":"un diabète", "Cardiopathie":"une cardiopathie", "Chirurgie":"une chirurgie", "Traumatisme":"un traumatisme", "Asthme":"un asthme", "Grossesse":"une grossesse", "Ostéoporose":"une ostéoporose", "Cancer":"un cancer",
  /* examens */ "Radiographie":"une radiographie", "Échographie":"une échographie", "IRM":"une IRM", "Scanner":"un scanner", "EMG":"un EMG",
  /* traitements */ "Médicaments":"un traitement médicamenteux", "Kinésithérapie":"de la kinésithérapie", "Infiltration":"une infiltration", "Ostéopathie":"de l'ostéopathie"
};
const PATHO = { "Lombalgie":"une lombalgie", "Cervicalgie":"une cervicalgie", "Dorsalgie":"une dorsalgie", "Sciatique":"une sciatique", "Gonalgie":"une gonalgie", "Entorse":"une entorse", "Tendinopathie":"une tendinopathie", "Post-opératoire":"une rééducation post-opératoire", "Fracture":"une fracture", "Trouble de l’équilibre":"des troubles de l'équilibre", "Chutes / personne âgée":"un risque de chute", "Neurologie (AVC, Parkinson, SEP…)":"une pathologie neurologique", "Vertiges":"des vertiges", "Respiratoire":"une rééducation respiratoire", "Reprise du sport":"une reprise du sport", "Remise en forme / reconditionnement":"un reconditionnement à l'effort" };
const art = x => ART[x] || PATHO[x] || low(x);
const hypArt = h => (/^(Conflit|Syndrome|VPPB)/.test(h) ? "un " : "une ") + low(h);   // hypothèses du bilan (data.js)
const NOTE_FAIT = ["Travail manuel", "Mobilisations", "Étirements", "Renforcement", "Proprioception / équilibre", "Marche / transferts", "Réentraînement à l'effort", "Respiratoire", "Physiothérapie", "Éducation / conseils"];
const NOTE_FAIT_TXT = { "Travail manuel":"le travail manuel", "Mobilisations":"des mobilisations", "Étirements":"des étirements", "Renforcement":"le renforcement musculaire", "Proprioception / équilibre":"la proprioception et l'équilibre", "Marche / transferts":"la marche et les transferts", "Réentraînement à l'effort":"le réentraînement à l'effort", "Respiratoire":"la kinésithérapie respiratoire", "Physiothérapie":"la physiothérapie", "Éducation / conseils":"l'éducation et les conseils" };
const zoneTxt = z => low(z).replace(/ D$/, ", côté droit").replace(/ G$/, ", côté gauche");
const nb = v => fmtNum(Math.round(Number(String(v).replace(",", ".")) * 10) / 10);
const unite = l => { const u = (l.match(/\(([^)]*)\)$/) || [])[1] || ""; return u === "%" ? " %" : u.startsWith("/") ? u : u === "0-10" ? "/10" : ""; };
const scoreDe = nom => /^[AEIOUYÉÈ]/i.test(nom) ? `le score d'${nom}` : `le score ${nom}`;   // le score d'Oswestry, le score QuickDASH

function rediger(bl){
  const S = bl?.etat || null;
  const type = S?.type || "intermediaire";
  const prev = S ? B.previousOf(liste, bl.id, bl.date) : null;
  const motifs = S ? joinSec(S, "patho") : [];
  const motif = motifs.length ? et(motifs.map(art)) : "";
  const motifObjet = motifs.length ? et(motifs.map(low)) : "";
  const hyp = S?.c?.hyp || [];
  const naiss = S?.f?.naiss ? `, ${ac("né", "née")} le ${S.f.naiss}` : "";
  const prof = S?.f?.prof ? `, ${low(S.f.prof)}` : "";
  const out = [];
  const depuisLe = premier && bl && premier.id !== bl.id ? B.fmtISOLong(premier.date) : "";

  /* Introduction */
  if(!S) out.push(`Je vous adresse des nouvelles de ${civ}${nom}, ${ac("suivi", "suivie")} en kinésithérapie à mon cabinet.`);
  else if(type === "initial") out.push(`Je vous remercie de m'avoir ${ac("adressé", "adressée")} ${civ}${nom}${naiss}${prof}${motif ? `, pour ${motif}` : ""}. Je l'ai ${ac("reçu", "reçue")} en bilan kinésithérapique le ${B.fmtISOLong(bl.date)}.`);
  else if(type === "final") out.push(`${civ}${nom}${naiss}, que vous m'aviez ${ac("adressé", "adressée")}${motif ? ` pour ${motif}` : ""}, arrive au terme de sa prise en charge en kinésithérapie${depuisLe ? `, débutée le ${depuisLe}` : ""}. J'ai réalisé son bilan de fin de traitement le ${B.fmtISOLong(bl.date)}.`);
  else out.push(`Je vous adresse des nouvelles de ${civ}${nom}${naiss}, que je suis en kinésithérapie${depuisLe ? ` depuis le ${depuisLe}` : ""}${motif ? ` pour ${motif}` : ""}. J'ai réalisé un bilan intermédiaire le ${B.fmtISOLong(bl.date)}.`);

  const { tests, rf, rfm } = testsCliniques(S);
  let evolScore = 0;
  /* Bilan de suivi : ressenti et exercices à la maison */
  if(S && type !== "initial"){
    const R = { "Beaucoup mieux":`${Il} se dit nettement ${ac("amélioré", "améliorée")} depuis le dernier bilan.`, "Mieux":`${Il} se dit ${ac("amélioré", "améliorée")} depuis le dernier bilan.`, "Pareil":`${Il} ne ressent pas de changement notable depuis le dernier bilan.`, "Moins bien":`${Il} rapporte une aggravation depuis le dernier bilan.` };
    const O = { "Tous les jours ou presque":"réalise ses exercices à domicile quasiment tous les jours", "Plusieurs fois par semaine":"réalise ses exercices à domicile plusieurs fois par semaine", "Rarement":"réalise rarement ses exercices à domicile", "Pas du tout":"ne réalise pas ses exercices à domicile" };
    const r = [R[q(S, "ressenti")] || "", O[q(S, "observance")] ? `${Il} ${O[q(S, "observance")]}.` : ""].filter(Boolean).join(" ");
    if(r) out.push(r);
    if(q(S, "ressenti")) evolScore = { "Beaucoup mieux":1, "Mieux":1, "Pareil":0, "Moins bien":-1 }[q(S, "ressenti")] || 0;
  }

  if(S){
    /* Histoire (bilan initial) */
    if(opt("hist") && type === "initial"){
      const DUREE = { "Moins d'1 semaine":"depuis moins d'une semaine", "1 à 6 semaines":"depuis une à six semaines", "6 semaines à 3 mois":"depuis six semaines à trois mois", "Plus de 3 mois":"depuis plus de trois mois" };
      const DEBUT = { "Traumatisme / accident":"à la suite d'un traumatisme", "Progressivement":"de façon progressive", "Après une opération":"après une intervention chirurgicale", "Sans cause retrouvée":"sans cause déclenchante retrouvée" };
      const EVOL = { "En amélioration":"tendent à s'améliorer", "Stable":"restent stables", "En aggravation":"s'aggravent", "Fluctuant":"fluctuent" };
      let t = "";
      const h = [DEBUT[q(S, "debut")] ? `sont apparus ${DEBUT[q(S, "debut")]}` : "", DUREE[q(S, "duree")] ? `évoluent ${DUREE[q(S, "duree")]}` : "", EVOL[q(S, "evol")] || ""].filter(Boolean);
      if(h.length) t += `Les symptômes ${et(h)}.`;
      if(q(S, "recid") === "Oui, récidives") t += ` Il s'agit d'une récidive.`;
      else if(q(S, "recid") === "Oui, une fois") t += ` Un épisode similaire est déjà survenu par le passé.`;
      const ex = qa(S, "imag").filter(x => x !== "Aucun"), tt = qa(S, "ttt").filter(x => x !== "Rien");
      if(ex.length) t += ` ${Il} a bénéficié ${et(ex.map(art)).replace(/^une /, "d'une ").replace(/^un /, "d'un ").replace(/ et une /g, " et d'une ").replace(/ et un /g, " et d'un ").replace(/, une /g, ", d'une ").replace(/, un /g, ", d'un ")}.`;
      if(tt.length) t += ` ${Il} a déjà reçu ${et(tt.map(art))}.`;
      const atcd = joinSec(S, "atcd"), med = joinSec(S, "medic").filter(x => x !== "Aucune");
      if(atcd.length) t += ` On note dans ses antécédents ${et(atcd.map(art))}.`;
      if(med.length) t += ` ${Il} est actuellement sous ${et(med.map(low))}.`;
      if(t.trim()) out.push(t.trim());
    }

    /* Douleur et examen */
    let t = "";
    const init = type === "initial";   // suivi et fin : douleur et examen seulement, le reste est déjà connu du médecin
    if(opt("exam")){
      const zones = Object.entries(S.pain || {});
      if(zones.length){
        const types = [...new Set(zones.flatMap(([, p]) => p.types || []))].map(low);
        t += `${init ? `${Il} décrit` : `${Il} rapporte aujourd'hui`} une douleur${types.length ? ` de type ${et(types)}` : ""}, cotée à ${et(zones.map(([z, p]) => `${p.eva}/10 (${zoneTxt(z)})`))} sur l'échelle numérique.`;
      }
      if(init){
        const H = { "À l'effort, mieux au repos":"survient à l'effort et cède au repos", "Au repos aussi":"persiste au repos", "Réveils nocturnes":"provoque des réveils nocturnes" };
        const hor = qa(S, "horaire").map(h => H[h]).filter(Boolean);
        if(hor.length) t += ` Elle ${hor.length > 1 ? hor.slice(0, -1).join(", ") + ", et " + hor[hor.length - 1] : hor[0]}.`;
        if(qa(S, "horaire").some(h => /> 30 min/.test(h))) t += ` Une raideur matinale prolongée est signalée.`;
        if(q(S, "irrad") === "Descend dans le bras ou la jambe") t += ` Elle irradie dans le membre${q(S, "pares") === "Oui" ? ", avec des paresthésies" : ""}.`;
        else if(q(S, "pares") === "Oui") t += ` Des paresthésies sont associées.`;
      }
      const d4 = (S.c?.dn4 || []).length;
      if(d4 >= 4) t += ` Le DN4 est à ${d4}/10, ce qui est en faveur d'une composante neuropathique.`;
      const obs = joinSec(S, "obs");
      if(obs.length) t += ` À l'examen, on retrouve ${et(obs.map(art))}.`;
    }
    if(opt("tests")){
      const pos = tests.filter(x => x.pos).map(x => x.test);
      const neg = tests.filter(x => !x.pos && x.lrm != null && x.lrm <= 0.3).map(x => x.test);
      if(pos.length) t += ` ${pos.length > 1 ? `Les tests ${et(pos.map(p => (/^[AEIOUYÉH]/i.test(p) ? "d'" : "de ") + p))} sont positifs` : `Le test ${/^[AEIOUYÉH]/i.test(pos[0]) ? "d'" : "de "}${pos[0]} est positif`}${hyp.length ? ", ce qui conforte l'hypothèse clinique" : ""}.`;
      if(neg.length) t += ` ${neg.length > 1 ? `Les tests ${et(neg)} sont négatifs` : `Le test ${neg[0]} est négatif`}, ce qui rend peu probable une autre atteinte.`;
      const tf = mesures(S, "tf");
      if(tf.length) t += ` Sur le plan fonctionnel, ${et(tf.map(m => `le résultat au test « ${m.label} » est de ${m.val.replace(/ s$/, " secondes").replace(/ m$/, " mètres")}`))}.`;
    }
    if(opt("quest")){
      const m = mesures(S, "quest").filter(m => m.k !== "m_nprs" && m.k !== "m_psfs");
      if(m.length) t += ` ${phrase(et(m.map(m => `${scoreDe(m.label)} est de ${m.val}`)))}`;
    }
    if(init && opt("exam")){
      const v = [];
      if(q(S, "sommeil") === "Gêné par la douleur") v.push("son sommeil est perturbé");
      if(q(S, "avq") === "Beaucoup") v.push("la gêne est importante dans la vie quotidienne");
      else if(q(S, "avq") === "Activités impossibles") v.push("certaines activités quotidiennes sont devenues impossibles");
      if(q(S, "travail") === "Arrêt de travail") v.push(`${ilElle} est actuellement en arrêt de travail`);
      else if(q(S, "travail") === "Poste aménagé") v.push(`${ilElle} travaille sur un poste aménagé`);
      if(v.length) t += ` Sur le plan du retentissement, ${et(v)}.`;
      if(qa(S, "jaunes").length >= 2) t += ` Des facteurs psychosociaux sont à prendre en compte (${et(qa(S, "jaunes").map(low))}).`;
    }
    if(t.trim()) out.push(t.trim());

    /* Évolution depuis le bilan précédent */
    if(prev && type !== "initial"){
      const ev = B.compare(prev.etat, S).filter(e => e.from != null && e.to != null);
      evolScore = Math.sign(ev.reduce((n, e) => n + (e.sens === "mieux" ? 1 : e.sens === "moins" ? -1 : 0), 0)) || evolScore;
      const zEva = ev.some(e => /^EVA /.test(e.label));
      const utiles = ev.filter(e => (e.sens || /^EVA /.test(e.label)) && !(zEva && /^NPRS/.test(e.label)) && e.delta);
      if(opt("evol") && utiles.length){
        const bouts = utiles.map(e => {
          if(/^EVA /.test(e.label)) return `la douleur (${zoneTxt(e.label.slice(4))}) est passée de ${nb(e.from)} à ${nb(e.to)}/10`;
          const u = unite(e.label), n = e.label.replace(/\s*\([^)]*\)$/, "");
          return `${scoreDe(n)} est passé de ${nb(e.from)} à ${nb(e.to)}${u}`;
        });
        const mieux = utiles.filter(e => e.sens === "mieux").length, moins = utiles.filter(e => e.sens === "moins").length;
        out.push(`Depuis le bilan du ${B.fmtISOLong(prev.date)}, ${et(bouts)}. ${mieux && !moins ? "Il s'agit d'une amélioration cliniquement significative." : moins && !mieux ? "Cette évolution est défavorable." : mieux && moins ? "L'évolution est contrastée selon les critères." : "Les variations restent en deçà du seuil cliniquement significatif."}`);
      }
    }

    /* Diagnostic kinésithérapique */
    const dk = String(S.f?.concl || "").trim().replace(/\.$/, "");
    if(hyp.length || dk) out.push([hyp.length ? `Au terme de ce bilan, le tableau clinique est compatible avec ${et(hyp.map(hypArt))}.` : "", dk ? `${hyp.length ? "Mon" : "Au terme de ce bilan, mon"} diagnostic kinésithérapique est le suivant : ${low(dk)}.` : ""].filter(Boolean).join(" "));

    /* Drapeaux et avis : toujours dans la lettre */
    const alertes = [];
    if(rf.length) alertes.push(`J'ai relevé un signe d'alerte (${et(rf.map(low))}). ${phrase(rfm.join(" "))}`);
    if(S.tx?.avis?.length) alertes.push(phrase(S.tx.avis.join(" ")));
    if(alertes.length) out.push(`<strong>Point d'attention :</strong> ${esc(alertes.join(" "))}`);
  }

  /* Suivi à domicile et questionnaires de l'application */
  const D = suiviDomicile();
  if(D.tr) evolScore = evolScore || (D.tr.delta <= -1 ? 1 : D.tr.delta >= 1 ? -1 : 0);
  let s = "";
  /* Séances au cabinet (notes de séance) */
  if(opt("suivi")){
    const N = notesAll.filter(n => !D.depuis || isoDe(n.date) >= D.depuis).sort((a, b) => a.date - b.date);
    if(N.length){
      const ev = N.filter(n => n.eva != null && n.eva !== "");
      const der = N[N.length - 1], tags = der.tags || [];
      s += `Je l'ai ${ac("vu", "vue")} ${N.length} fois en séance${D.depuis ? ` depuis le ${B.fmtISOLong(D.depuis)}` : ""}.`;
      if(ev.length > 1 && Number(ev[0].eva) !== Number(ev[ev.length - 1].eva)) s += ` La douleur relevée en séance est passée de ${ev[0].eva} à ${ev[ev.length - 1].eva}/10.`;
      else if(ev.length) s += ` Lors de la dernière séance, la douleur était cotée à ${ev[ev.length - 1].eva}/10.`;
      if(tags.includes("Mieux")) s += ` L'évolution était jugée favorable lors de la dernière séance.`;
      else if(tags.includes("Moins bien")) s += ` La dernière séance a montré une évolution moins favorable.`;
      const fait = tags.filter(t => NOTE_FAIT.includes(t));
      if(fait.length) s += ` Le travail actuel porte sur ${et(fait.map(t => NOTE_FAIT_TXT[t] || low(t)))}.`;
      s += " ";
    }
  }
  if(opt("suivi") && D.valides.length){
    const reg = D.reg;
    const comment = reg === null ? "" : reg >= 80 ? "régulièrement " : reg >= 50 ? "de façon assez régulière " : "de façon irrégulière ";
    s += `${Il} réalise ${comment}son programme d'exercices à domicile, avec ${D.valides.length} séance${D.valides.length > 1 ? "s" : ""} effectuée${D.valides.length > 1 ? "s" : ""}${reg !== null ? `, soit ${reg} % des séances prévues` : ""}.`;
    if(D.tr) s += ` La douleur ressentie après les séances ${Math.abs(D.tr.delta) < 1 ? `reste stable, autour de ${nb(D.tr.fin)}/10` : `est passée de ${nb(D.tr.debut)} à ${nb(D.tr.fin)}/10 en moyenne`}.`;
  }
  if(opt("quest")){
    const Q = questApp(D.depuis);
    const bouts = Q.map(x => x.r.length > 1 && x.last.score !== x.first.score ? `${scoreDe(x.q.nom)} est passé de ${fmtScore(x.first.score, x.q)} à ${fmtScore(x.last.score, x.q)}` : `${scoreDe(x.q.nom)} est de ${fmtScore(x.last.score, x.q)}`);
    if(bouts.length) s += ` Aux questionnaires remplis sur l'application, ${et(bouts)}.`;
  }
  if(s.trim()) out.push(s.trim());

  /* Traitement et proposition */
  const pr = S?.tx?.init ? T.profil(S) : null;
  const progEx = S?.tx?.prog?.nom || "";
  if(opt("tx") && S && type !== "final"){
    let t = "";
    const objs = joinSec(S, "obj");
    const O = { "Réduire la douleur":"réduire la douleur", "Récupérer la mobilité":"récupérer la mobilité", "Renforcement":"renforcer la musculature", "Reprise du sport":"permettre la reprise du sport", "Reprise du travail":"permettre la reprise du travail", "Autonomie":"retrouver l'autonomie" };
    if(objs.length) t += `La rééducation a pour objectif${objs.length > 1 ? "s" : ""} ${et(objs.map(o => "de " + (O[o] || low(o))).map(x => x.replace(/^de ([aeiouyéèh])/i, "d'$1")))}.`;
    const ax = (S.tx?.axes || []).length ? S.tx.axes : joinSec(S, "plan");
    if(ax.length) t += ` ${ax.length > 1 ? "Les axes de traitement retenus sont les suivants" : "L'axe de traitement retenu est le suivant"} : ${ax.map(low).join(", ")}.`;
    if(progEx) t += ` Je lui ai remis un programme d'exercices à domicile sur l'application ApiKiné, dans lequel ${ilElle} note sa douleur après chaque séance, ce qui me permet d'ajuster la progression.`;
    if(t.trim()) out.push(t.trim());
  }
  const rythme = pr ? ` à raison de ${pr.freq} séance${pr.freq > 1 ? "s" : ""} par semaine` : "";
  if(type === "initial") out.push(pr ? `Je propose ${pr.freq} séance${pr.freq > 1 ? "s" : ""} par semaine pendant environ ${pr.sem} semaines, avec un bilan intermédiaire dans ${pr.reeval} semaines. Je ne manquerai pas de vous tenir informé de l'évolution.` : `Je ne manquerai pas de vous tenir informé de l'évolution.`);
  else if(type === "final"){
    out.push(evolScore < 0 ? `Les objectifs ne sont que partiellement atteints, et je vous laisse juger de la suite à donner.` : `Les objectifs fixés en début de prise en charge sont atteints${evolScore > 0 ? ", avec une amélioration cliniquement significative" : ""}. Je mets donc fin à la rééducation.`);
    out.push(`${Il} poursuivra en autonomie ${progEx ? "son programme d'exercices" : "ses exercices"} à domicile, que je lui ai expliqués.`);
  }else if(S?.tx?.decision === "Faire progresser") out.push(`${evolScore >= 0 ? "L'évolution est favorable. " : ""}Je fais progresser le programme d'exercices${progEx ? ` (${progEx})` : ""} et vous propose de poursuivre la rééducation${rythme} et, si vous en êtes d'accord, de renouveler la prescription.`);
  else if(S?.tx?.decision === "Alléger") out.push(`J'allège le programme pour tenir compte de la tolérance actuelle et poursuis la rééducation${rythme}${evolScore < 0 ? ". Si l'évolution reste défavorable, un nouvel avis de votre part me paraîtrait utile" : ""}.`);
  else out.push(evolScore > 0 ? `L'évolution est favorable. Je vous propose de poursuivre la rééducation${rythme} et, si vous en êtes d'accord, de renouveler la prescription.`
    : evolScore < 0 ? `L'évolution est insuffisante à ce stade. Je poursuis la rééducation${rythme} en l'adaptant, mais un nouvel avis de votre part me paraît utile.`
    : `Je vous propose de poursuivre la rééducation${rythme} et, si vous en êtes d'accord, de renouveler la prescription.`);

  const pour = hyp.length ? et(hyp.map(low)) : motifObjet;
  return {
    objet: (S ? (type === "initial" ? "Bilan kinésithérapique initial" : type === "final" ? "Fin de prise en charge en kinésithérapie" : "Suivi de rééducation") : "Suivi de rééducation") + (pour ? ` (${pour})` : ""),
    paras: out.filter(Boolean).map(x => x.startsWith("<strong>") ? x : esc(x))
  };
}

/* ---------- Pièces jointes ---------- */
const enTete = (titre, sub) => `<div class="lt-from" style="margin-bottom:14px"><img src="${esc(logoSrc())}" alt=""><div><strong>${esc(KINE.nom)}</strong>${esc(KINE.titre)}</div></div><h1>${esc(titre)}</h1><p class="sub">${esc(civ + nom)}${sub ? " · " + esc(sub) : ""}</p>`;
const table = rows => `<table><tbody>${rows.map(([l, v]) => `<tr><td class="l">${esc(l)}</td><td>${esc(v)}</td></tr>`).join("")}</tbody></table>`;

function annexes(bl){
  const S = bl?.etat, out = [], noms = [];
  const prev = S ? B.previousOf(liste, bl.id, bl.date) : null;
  if(opt("j-bilan") && S){
    const R = B.report(S, { ...patient, nom }, prev ? { prev: prev.etat, prevDate: prev.date } : {});
    noms.push(`${R.titre} du ${R.date}`);
    out.push(`<div class="sheet-a4 ax">${enTete(R.titre, R.date)}${table(R.patient.filter(p => p[0] !== "Patient"))}${R.sections.map(s => `<h2>${esc(s.h)}</h2>${s.alerte ? `<p class="alerte">${esc(s.alerte)}</p>` : ""}${table(s.rows)}`).join("")}</div>`);
  }
  if(opt("j-tests") && S){
    const { tests } = testsCliniques(S), tf = mesures(S, "tf");
    if(tests.length || tf.length){
      noms.push("Tests cliniques");
      out.push(`<div class="sheet-a4 ax">${enTete("Tests cliniques", B.fmtISO(bl.date))}
        ${tests.length ? `<h2>Tests diagnostiques</h2><table><thead><tr><th>Zone</th><th>Test</th><th>Résultat</th><th>LR+</th><th>LR−</th><th>Apport</th></tr></thead><tbody>${tests.map(x => `<tr><td>${esc(x.zone)}</td><td>${esc(x.test)}</td><td><strong>${x.pos ? "Positif" : "Négatif"}</strong></td><td class="n">${esc(B.f1(x.lrp))}</td><td class="n">${esc(B.f1(x.lrm))}</td><td>${esc(x.pos ? (x.lrp != null && x.lrp >= 5 ? "aide à confirmer" : "apport limité") : (x.lrm != null && x.lrm <= 0.2 ? "aide à exclure" : "apport limité"))}</td></tr>`).join("")}</tbody></table>
        <p class="muted" style="font-size:8.5pt">LR : rapports de vraisemblance issus de la littérature (LR+ ≥ 5 : aide à confirmer ; LR− ≤ 0,2 : aide à exclure).</p>` : ""}
        ${tf.length ? `<h2>Tests fonctionnels</h2>${table(tf.map(m => [m.label, m.val]))}` : ""}</div>`);
    }
  }
  if(opt("j-quest")){
    const mq = mesures(S, "quest"), qa_ = questApp(premier?.date || "");
    if(mq.length || qa_.length){
      noms.push("Questionnaires");
      out.push(`<div class="sheet-a4 ax">${enTete("Questionnaires et mesures")}
        ${mq.length ? `<h2>Relevés au bilan du ${esc(B.fmtISO(bl.date))}</h2>${table(mq.map(m => [m.label, m.val]))}` : ""}
        ${qa_.length ? `<h2>Questionnaires remplis par le patient</h2><table><thead><tr><th>Questionnaire</th><th>Premier score</th><th>Dernier score</th></tr></thead><tbody>${qa_.map(x => `<tr><td>${esc(x.q.nom)}${x.q.interpretation ? `<br><span class="muted" style="font-size:8.5pt">${esc(x.q.interpretation)}</span>` : ""}</td><td class="n">${esc(fmtScore(x.first.score, x.q))}<br><span class="muted">${esc(new Date(x.first.date).toLocaleDateString("fr-FR"))}</span></td><td class="n">${x.r.length > 1 ? `${esc(fmtScore(x.last.score, x.q))}<br><span class="muted">${esc(new Date(x.last.date).toLocaleDateString("fr-FR"))}</span>` : "–"}</td></tr>`).join("")}</tbody></table>` : ""}</div>`);
    }
  }
  if(opt("j-suivi")){
    const D = suiviDomicile();
    if(D.valides.length){
      noms.push("Suivi à domicile");
      out.push(`<div class="sheet-a4 ax">${enTete("Suivi des exercices à domicile")}
        <h2>Programmes</h2><table><thead><tr><th>Programme</th><th>Séances faites</th><th>Assiduité</th></tr></thead><tbody>${D.progs.map(p => { const r = P.regularity(p.seances); return `<tr><td>${esc(p.nom)}</td><td class="n">${p.faites} / ${p.total}</td><td class="n">${r === null ? "–" : r + " %"}</td></tr>`; }).join("")}</tbody></table>
        ${D.evas.length ? `<h2>Douleur après les séances (0–10)</h2><table><thead><tr><th>Date</th><th>Séance</th><th>Douleur</th></tr></thead><tbody>${D.valides.filter(s => s.eva != null && s.eva !== "").slice(-15).map(s => `<tr><td class="n">${esc(new Date(s.dateValidation).toLocaleDateString("fr-FR"))}</td><td>${esc(s.label || s.nom || "Séance")}</td><td class="n">${esc(s.eva)}/10</td></tr>`).join("")}</tbody></table>${D.evas.length > 15 ? `<p class="muted" style="font-size:8.5pt">15 dernières mesures sur ${D.evas.length}.</p>` : ""}` : ""}</div>`);
    }
  }
  return { html: out.join(""), noms };
}

/* ---------- Mise en page ---------- */
const memoMed = `gt_courrier_med_${cle}`;
let bl = liste.find(b => b.id === params.get("bilan")) || liste[0] || null;
const medDe = b => String(b?.etat?.f?.med || "").replace(/^(dr\.?|docteur)\s+/i, "").trim();
let saisi = ""; try{ saisi = localStorage.getItem(memoMed) || ""; }catch(e){}
$("#med").value = medDe(bl) || saisi;
if(liste.length > 1){
  $("#f-bilan").hidden = false;
  $("#bilan").innerHTML = liste.map(b => `<option value="${esc(b.id)}" ${b.id === bl?.id ? "selected" : ""}>${esc(B.typeLabel(b.etat.type))} du ${esc(B.fmtISO(b.date))}</option>`).join("");
}
const coord = [cab.adresse, cab.telephone ? "Tél. " + cab.telephone : "", cab.email || KINE.email].filter(Boolean).join("\n");
let edited = false;

function destinataire(){
  const m = $("#med").value.trim().replace(/^(dr\.?|docteur)\s+/i, "");
  $("#to").innerHTML = m ? `Docteur ${esc(m)}` : `<span class="vide">Docteur …</span>`;
}
function rendreAnnexes(){
  const A = annexes(bl);
  $("#annexes").innerHTML = A.html;
  $("#pj").innerHTML = A.noms.length ? `<strong>Pièce${A.noms.length > 1 ? "s" : ""} jointe${A.noms.length > 1 ? "s" : ""} :</strong> ${esc(A.noms.join(" ; "))}` : "";
}
function rendre(){
  const L = rediger(bl);
  $("#doc").innerHTML = `
    <div class="lt-from"><img src="${esc(logoSrc())}" alt=""><div><strong>${esc(KINE.nom)}</strong>${esc(KINE.titre)}\n${esc(coord)}</div></div>
    <div class="lt-to" id="to"></div>
    <p class="lt-date">${ville ? esc(ville) + ", le" : "Le"} ${esc(new Date().toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" }))}</p>
    <p class="lt-obj"><strong>Objet :</strong> ${esc(L.objet)}</p>
    <p class="lt-ref">Patient${G === "f" ? "e" : ""} : ${esc(civ + nom)}${bl?.etat?.f?.naiss ? `, ${ac("né", "née")} le ${esc(bl.etat.f.naiss)}` : ""}</p>
    <div class="lt-body" id="corps" contenteditable="true" spellcheck="true">
      <p>Docteur,</p>
      ${L.paras.map(p => `<p>${p}</p>`).join("")}
      <p>Je reste à votre disposition pour tout renseignement complémentaire et vous remercie de votre confiance.</p>
      <p>Je vous prie d'agréer, Docteur, l'expression de mes salutations distinguées.</p>
    </div>
    <div class="lt-sign"><strong>${esc(KINE.nom)}</strong><br>${esc(KINE.titre)}<div class="space"></div></div>
    <div class="lt-pj" id="pj"></div>`;
  destinataire();
  rendreAnnexes();
  edited = false;
  $("#corps").addEventListener("input", () => { edited = true; }, { once:true });
}

if(!liste.length){
  toast("Aucun bilan enregistré : la lettre reprend seulement le suivi à domicile.", { duration:6000 });
  ["hist", "exam", "tests", "evol", "tx", "j-bilan", "j-tests"].forEach(k => { const x = $(`[data-o="${k}"]`); if(x) x.closest("label").hidden = true; });
}
rendre();

async function regenerer(){
  if(edited && !(await confirmDialog({ title:"Réécrire la lettre ?", message:"Vos modifications du texte seront remplacées par une nouvelle rédaction.", confirm:"Réécrire" }))) return false;
  rendre();
  return true;
}
$("#med").addEventListener("input", () => { destinataire(); try{ localStorage.setItem(memoMed, $("#med").value.trim()); }catch(e){} });
$("#bilan").onchange = async () => {
  const avant = bl;
  bl = liste.find(b => b.id === $("#bilan").value) || bl;
  if(!(await regenerer())){ bl = avant; $("#bilan").value = avant.id; return; }
  if(medDe(bl) && !$("#med").value.trim()){ $("#med").value = medDe(bl); destinataire(); }
};
$$("[data-o]").forEach(x => x.onchange = async () => {
  if(x.dataset.o.startsWith("j-")) rendreAnnexes();          // les pièces jointes ne touchent pas au texte de la lettre
  else if(!(await regenerer())){ x.checked = !x.checked; return; }
  try{ localStorage.setItem(memoOpts, JSON.stringify(optsActuelles())); }catch(e){}
});

const texte = () => {
  const d = $("#doc");
  return [d.querySelector(".lt-from").innerText, "", $("#to").innerText, "", d.querySelector(".lt-date").innerText, "", d.querySelector(".lt-obj").innerText, d.querySelector(".lt-ref").innerText, "",
    [...$("#corps").querySelectorAll("p")].map(p => p.innerText.trim()).filter(Boolean).join("\n\n"), "", KINE.nom, KINE.titre, $("#pj").innerText ? "\n" + $("#pj").innerText : ""].join("\n");
};
const verifMed = () => { if($("#med").value.trim()) return true; $("#med").focus(); toast("Indiquez le nom du médecin.", { type:"err" }); return false; };
$("#print").onclick = () => { if(verifMed()) print(); };
$("#copy").onclick = async () => {
  try{ await navigator.clipboard.writeText(texte()); toast("Lettre copiée.", { type:"ok" }); }
  catch(e){ B.copyText(texte()); }
};
$("#mail").onclick = () => {
  if(!verifMed()) return;
  if($("#pj").innerText) toast("Pensez à joindre le PDF des pièces jointes (Imprimer ou PDF).", { duration:6000 });
  const objet = $("#doc .lt-obj").innerText.replace(/^Objet :\s*/, "") + " – " + nom;
  location.href = `mailto:${encodeURIComponent(bl?.etat?.f?.medmail || "")}?subject=${encodeURIComponent(objet)}&body=${encodeURIComponent(texte())}`;
};
</script>
</body>
</html>
