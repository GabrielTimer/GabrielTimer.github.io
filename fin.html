<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Séance terminée</title>
<meta name="theme-color" content="#EDF3F4">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .fin{ max-width:560px; margin:0 auto; padding:max(20px,env(safe-area-inset-top)) var(--gutter) calc(32px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:18px; }
  .fin-head{ text-align:center; padding:18px 0 6px; display:flex; flex-direction:column; align-items:center; gap:10px; }
  .medal{ width:88px; height:88px; border-radius:50%; display:grid; place-items:center; background:var(--ok); color:#fff; box-shadow:0 0 0 10px var(--ok-soft); animation:pop .6s cubic-bezier(.2,1.6,.4,1) both; }
  .medal svg{ width:46px; height:46px; stroke-width:2.6; }
  @keyframes pop{ from{ transform:scale(.3); opacity:0; } }
  .fin-head h1{ font-size:clamp(1.9rem,7vw,2.4rem); }
  .fin-stats{ display:flex; justify-content:center; gap:10px; flex-wrap:wrap; }
  .fin-stats .badge{ font-size:var(--fs-sm); padding:6px 12px; }
  .eva-top{ display:flex; align-items:center; gap:16px; }
  .eva-face{ width:76px; height:76px; flex:none; transition:transform .15s; }
  .eva-val{ font-family:var(--mono); font-weight:700; font-size:2.6rem; line-height:1; }
  .eva-val small{ font-size:.45em; color:var(--ink-3); }
  .eva-lab{ font-weight:700; color:var(--ink-2); }
  .eva-range{ -webkit-appearance:none; appearance:none; width:100%; height:44px; background:transparent; margin:6px 0 0; cursor:pointer; }
  .eva-range::-webkit-slider-runnable-track{ height:14px; border-radius:999px; background:linear-gradient(90deg,var(--eva-0),var(--eva-2),var(--eva-4),var(--eva-6),var(--eva-8),var(--eva-10)); }
  .eva-range::-moz-range-track{ height:14px; border-radius:999px; background:linear-gradient(90deg,var(--eva-0),var(--eva-2),var(--eva-4),var(--eva-6),var(--eva-8),var(--eva-10)); }
  .eva-range::-webkit-slider-thumb{ -webkit-appearance:none; width:40px; height:40px; margin-top:-13px; border-radius:50%; background:var(--surface); border:4px solid var(--ink); box-shadow:var(--shadow-1); }
  .eva-range::-moz-range-thumb{ width:32px; height:32px; border-radius:50%; background:var(--surface); border:4px solid var(--ink); }
  .eva-range.untouched::-webkit-slider-thumb{ border-color:var(--ink-3); }
  .eva-scale{ display:flex; justify-content:space-between; font-size:var(--fs-xs); color:var(--ink-3); font-weight:700; padding:0 6px; }
  .eva-steps{ display:flex; justify-content:center; gap:10px; margin-top:6px; }
  .q-title{ font-size:var(--fs-lg); font-weight:800; margin-bottom:4px; }
  .q-sub{ color:var(--ink-2); font-size:var(--fs-sm); margin-bottom:14px; }
  .chips.ressenti .chip{ min-height:44px; padding:0 16px; font-size:var(--fs-md); }
  .done-screen{ text-align:center; }
  .confetti{ position:fixed; inset:0; pointer-events:none; overflow:hidden; z-index:5; }
  .confetti i{ position:absolute; top:-12px; width:9px; height:14px; border-radius:2px; animation:fall linear forwards; }
  @keyframes fall{ to{ transform:translateY(110vh) rotate(540deg); } }
</style>
</head>
<body>
<main class="fin" id="app"></main>
<script type="module" src="/assets/pages/fin.js"></script>
</body>
</html>
