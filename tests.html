<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tests cliniques et fonctionnels</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .ts-tools{ display:flex; flex-direction:column; gap:10px; margin-bottom:12px; }
  .ts-row{ display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-top:1px solid var(--line); cursor:pointer; background:none; border-left:0; border-right:0; border-bottom:0; width:100%; text-align:left; color:inherit; font:inherit; }
  .ts-row:first-child{ border-top:0; }
  .ts-row:hover{ background:var(--surface-2); }
  .ts-ico{ flex:none; width:38px; height:38px; border-radius:var(--r-sm); display:grid; place-items:center; background:var(--lagon-soft, var(--surface-2)); color:var(--lagon-strong); }
  .ts-ico svg{ width:20px; height:20px; }
  .ts-main{ flex:1; min-width:0; }
  .ts-title{ font-weight:800; display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
  .ts-sub{ font-size:var(--fs-sm); color:var(--ink-2); margin-top:2px; }
  .ts-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .ts-meta .badge{ font-size:var(--fs-xs); }
  .g-sheet p{ margin:0 0 10px; }
</style>
</head>
<body>
<main class="page wide" id="app"><div class="loading" style="min-height:50dvh"><div class="spinner"></div><span>Chargement…</span></div></main>
<script type="module">
import { $, $$, esc, icon, mountShell, registerSW, store, debounce, plural } from "/assets/app.js";
import { SPECIALITES } from "/assets/classement.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
registerSW();
mountShell({ role:"kine", active:"", back:"/admin_tools.html" });
const B = await import("/assets/bilan-core.js");
const TC = await import("/assets/tests-catalogue.js");
const K = await B.loadClinic();
const all = TC.catalogue(K);

const KEY = "gt_tests_filtres";
const F = { q:"", kind:"", region:"", spec:"", ...(store.get(KEY, {}) || {}) };
const save = () => store.set(KEY, F);
const norm = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase();
const regions = [...new Set(all.map(t => t.region))];
const specs = SPECIALITES.filter(s => all.some(t => t.specs.includes(s)));

$("#app").innerHTML = `
  <div class="page-head"><h1>Tests</h1><p class="lead">Tous les tests du bilan, en accès libre : technique, interprétation, valeurs diagnostiques et vidéo.</p></div>
  <div class="ts-tools">
    <label class="input-icon"><span class="sr-only">Rechercher un test</span>${icon("search")}<input class="input" type="search" id="q" placeholder="Lachman, TUG, coiffe, LCA…" autocomplete="off" value="${esc(F.q)}"></label>
    <div class="segmented" role="group" aria-label="Type de test" style="align-self:flex-start">
      <button type="button" data-kind="">Tous</button><button type="button" data-kind="clinique">Tests cliniques</button><button type="button" data-kind="fonctionnel">Tests fonctionnels</button>
    </div>
    <div class="chips scroll" id="regions" role="group" aria-label="Région"></div>
    <select class="select sm-select" id="spec" aria-label="Spécialité" style="align-self:flex-start"><option value="">Toutes spécialités</option>${specs.map(s => `<option value="${esc(s)}">${esc(s)}</option>`).join("")}</select>
  </div>
  <div class="small muted" id="count" style="margin-bottom:8px"></div>
  <div class="panel" style="padding:0" id="list"></div>`;

const match = t => {
  if(F.kind && t.kind !== F.kind) return false;
  if(F.region && t.region !== F.region) return false;
  if(F.spec && !t.specs.includes(F.spec)) return false;
  if(!F.q) return true;
  const hay = norm([t.nom, t.region, ...(t.hyp || []), ...(t.specs || []), ...(t.motifs || []), t.g?.t, t.g?.p].join(" "));
  return norm(F.q).split(/\s+/).filter(Boolean).every(w => hay.includes(w));
};
const f1 = x => x == null ? null : String(x).replace(".", ",");

function render(){
  $$("[data-kind]").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.kind === F.kind)));
  $("#spec").value = F.spec; $("#spec").classList.toggle("on", !!F.spec);
  const rc = {};
  all.filter(t => (!F.kind || t.kind === F.kind) && (!F.spec || t.specs.includes(F.spec))).forEach(t => rc[t.region] = (rc[t.region] || 0) + 1);
  if(F.region && !rc[F.region]) F.region = "";
  $("#regions").innerHTML = `<button class="chip" type="button" data-region="" aria-pressed="${!F.region}">Toutes régions</button>` +
    regions.filter(r => rc[r]).map(r => `<button class="chip" type="button" data-region="${esc(r)}" aria-pressed="${F.region === r}">${esc(r === "Fonction" ? "Équilibre, marche, force" : r)}<span class="count">${rc[r]}</span></button>`).join("");
  $$("[data-region]").forEach(b => b.onclick = () => { F.region = b.dataset.region; save(); render(); });
  const list = all.filter(match);
  $("#count").textContent = plural(list.length, "test");
  $("#list").innerHTML = list.length ? list.map((t, i) => `
    <button class="ts-row" type="button" data-i="${all.indexOf(t)}">
      <span class="ts-ico">${icon(t.kind === "fonctionnel" ? "clock" : "stethoscope")}</span>
      <span class="ts-main">
        <span class="ts-title">${esc(t.nom)}${t.g?.v ? `<span class="badge lagon">${icon("video")}vidéo</span>` : ""}</span>
        <span class="ts-sub">${t.kind === "clinique" ? `${esc(t.region)} · ${esc(t.hyp.join(", "))}` : `Test fonctionnel${t.unite ? ` (${esc(t.unite)})` : ""}${t.motifs?.length ? ` · ${esc(t.motifs.slice(0, 3).join(", ").toLowerCase())}` : ""}`}</span>
        <span class="ts-meta">
          ${t.lrp != null ? `<span class="badge ${t.lrp >= 5 ? "ok" : ""}">LR+ ${esc(f1(t.lrp))}</span>` : ""}
          ${t.lrm != null ? `<span class="badge ${t.lrm <= 0.2 ? "ok" : ""}">LR− ${esc(f1(t.lrm))}</span>` : ""}
          ${t.prec ? `<span class="badge">${esc(t.prec)}</span>` : ""}
          ${t.specs.slice(0, 3).map(s => `<span class="badge">${esc(s)}</span>`).join("")}
        </span>
      </span>
    </button>`).join("") : `<div class="empty" style="padding:24px"><h3>Aucun test</h3><p>Essayez un autre mot ou retirez un filtre.</p></div>`;
  $$("[data-i]").forEach(b => b.onclick = () => { const t = all[+b.dataset.i]; TC.ficheTest(K, t.nom, t.kind); });
}
$$("[data-kind]").forEach(b => b.onclick = () => { F.kind = b.dataset.kind; save(); render(); });
$("#spec").onchange = e => { F.spec = e.target.value; save(); render(); };
$("#q").addEventListener("input", debounce(e => { F.q = e.target.value.trim(); save(); render(); }, 140));
render();
</script>
</body>
</html>
