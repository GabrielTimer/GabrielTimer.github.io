<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reprise de course</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .form-grid{ display:grid; gap:16px; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); }
  .form-sec + .form-sec{ margin-top:16px; }
  .form-sec h2{ font-size:var(--fs-lg); margin-bottom:14px; }
</style>
</head>
<body>
<main class="page" id="app">
  <div class="page-head"><h1>Reprise de course</h1><p class="lead">Un programme progressif d'alternance course et marche, adapté au niveau et à la pathologie du patient.</p></div>

  <section class="panel form-sec">
    <h2>Patient</h2>
    <div class="field"><label for="patient">Patient</label>
      <div class="row"><select class="select" id="patient"><option value="">Aucun (aperçu seulement)</option></select><button class="btn" type="button" id="new-patient"><span class="nowrap">Nouveau</span></button></div>
    </div>
  </section>

  <section class="panel form-sec">
    <h2>Profil de course</h2>
    <div class="form-grid">
      <div class="field"><label for="objectif">Objectif</label><select class="select" id="objectif"><option>5 km</option><option selected>10 km</option><option>Semi</option></select></div>
      <div class="field"><label for="niveau">Niveau</label><select class="select" id="niveau"><option>Débutant</option><option selected>Reprise</option><option>Occasionnel</option><option>Régulier</option></select></div>
      <div class="field"><label for="pathologie">Pathologie</label><select class="select" id="pathologie"><option>Aucune</option><option>Syndrome rotulien</option><option>Tendinopathie achilléenne</option><option>Fasciite plantaire</option><option>Lombalgie</option></select></div>
      <div class="field"><label for="sexe">Illustrations</label><select class="select" id="sexe"><option value="H" selected>Homme</option><option value="F">Femme</option></select></div>
      <div class="field"><label for="tempsActuel">Course continue actuelle (min)</label><input class="input" id="tempsActuel" type="number" inputmode="numeric" value="10" min="0"></div>
      <div class="field"><label for="allure">Allure moyenne (min/km)</label><input class="input" id="allure" type="number" inputmode="decimal" step="0.1" value="6" min="3" max="12"></div>
    </div>
  </section>

  <section class="panel form-sec">
    <h2>Planning</h2>
    <div class="form-grid">
      <div class="field"><label for="semaines">Nombre de semaines</label><input class="input" id="semaines" type="number" inputmode="numeric" value="8" min="1"></div>
      <div class="field"><label for="seances">Séances par semaine</label><input class="input" id="seances" type="number" inputmode="numeric" value="3" min="1" max="5"></div>
      <div class="field"><label for="dateDebut">Date de début</label><input class="input" id="dateDebut" type="date"></div>
      <div class="field"><label for="modeProgramme">Affichage de la fiche</label><select class="select" id="modeProgramme"><option value="auto" selected>Automatique</option><option value="temps">En temps</option><option value="distance">En distance</option></select></div>
    </div>
    <label class="check" style="margin-top:12px"><input id="tapis" type="checkbox" checked> Tapis de course disponible</label>
  </section>

  <div class="btn-row section">
    <button class="btn" type="button" id="preview">Prévisualiser la fiche</button>
    <button class="btn primary big" type="button" id="generate">Générer et envoyer au patient</button>
  </div>
</main>

<script type="module">
import { $, icon, mountShell, registerSW, toast } from "/assets/app.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
registerSW();
mountShell({ role:"kine", active:"", back:"/admin_tools.html" });
const C = await import("/assets/cloud.js");
let patients = [];
const q = new URLSearchParams(location.search);

async function loadPatients(sel){
  patients = await C.listPatients().catch(() => []);
  $("#patient").innerHTML = `<option value="">Aucun (aperçu seulement)</option>` + patients.map(p => `<option value="${p.cle}">${p.nom.replace(/</g, "&lt;")}</option>`).join("");
  if(sel) $("#patient").value = sel;
}
await loadPatients(q.get("patient"));
$("#new-patient").innerHTML = icon("userPlus") + $("#new-patient").innerHTML;
$("#new-patient").onclick = async () => { const { newPatientSheet } = await import("/assets/kine-ui.js"); const p = await newPatientSheet(); if(p) await loadPatients(p.cle); };
$("#dateDebut").value = new Date().toISOString().split("T")[0];
$("#preview").innerHTML = icon("pdf") + $("#preview").innerHTML;
$("#generate").innerHTML = icon("share") + $("#generate").innerHTML;

async function buildProgram(
saveToCloud = true
){

const cle = document.getElementById("patient").value;
const patientObj = patients.find(p => p.cle === cle) || null;
if(saveToCloud && !patientObj){ toast("Choisissez un patient pour enregistrer le programme.", { type:"err" }); return; }
const patient = patientObj ? patientObj.patientId : "apercu";
const patientNom = patientObj ? patientObj.nom : "";
const aEnvoyer = [];

const objectif =
document.getElementById("objectif")
.value;

const niveau =
document.getElementById("niveau")
.value;

const pathologie =
document.getElementById("pathologie")
.value;

const tempsActuel =
parseInt(
document.getElementById("tempsActuel")
.value
) || 10;

const allure =
parseFloat(
document.getElementById("allure")
.value
) || 6;

const modeProgramme =
document.getElementById(
"modeProgramme"
).value;

const semaines =
parseInt(
document.getElementById("semaines")
.value
) || 8;

const seancesParSemaine =
Math.max(
1,
Math.min(
5,
parseInt(
document.getElementById("seances")
.value
) || 3
)
);

const dateDebut =
document.getElementById(
"dateDebut"
).value;

const tapis =
document.getElementById("tapis")
.checked;

const sexe =
document.getElementById("sexe")
.value;

const lettres =
["A","B","C","D","E"];

const dossier =
`Reprise course ${objectif}`;

const programmeId =
`${patient}_${Date.now()}`;

const programmeNom =
`Reprise course ${objectif}`;

const exercises =
await fetch(
"/exercises/data/exercises.json"
).then(r => r.json());

let modeAffichage =
modeProgramme;

if(modeProgramme === "auto"){

modeAffichage =
(
niveau === "Débutant"
||
niveau === "Reprise"
)
? "temps"
: "distance";

}

let marcheBase;
let courseBase;

if(tapis){

marcheBase =
structuredClone(
exercises.find(
e => e.id === "tapismarche"
)
);

courseBase =
structuredClone(
exercises.find(
e => e.id === "tapiscourse"
)
);

}else{

marcheBase =
structuredClone(
exercises.find(
e => e.id === "marche"
)
);

courseBase =
structuredClone(
exercises.find(
e => e.id === "course"
)
);

}





if(!marcheBase || !courseBase){
  toast("Exercices de marche ou de course introuvables dans la bibliothèque.", { type:"err" });
  return;
}

let totalCrees = 0;

try{

const pdfData = [];

for(
let semaine = 1;
semaine <= semaines;
semaine++
){

for(
let s = 0;
s < seancesParSemaine;
s++
){

const lettre =
lettres[s];

let dateSeance = null;

if(dateDebut){

const dateBase =
new Date(dateDebut);

const numeroSeance =
((semaine - 1)
* seancesParSemaine)
+ s;

dateSeance =
new Date(dateBase);

dateSeance.setDate(
dateBase.getDate()
+ (numeroSeance * 2)
);

}

let typeSeance;

if(seancesParSemaine === 2){

typeSeance =
[
"endurance",
"longue"
][s];

}else if(seancesParSemaine === 3){

if(niveau === "Débutant"){

typeSeance =
[
"endurance",
"endurance",
"longue"
][s];

}else{

typeSeance =
[
"endurance",

(semaine % 2 === 0)
? "fractionne"
: "tempo",

"longue"
][s];

}

}else if(seancesParSemaine === 4){

typeSeance =
[
"endurance",
"tempo",
"longue",
"fractionne"
][s];

}else{

typeSeance =
[
"endurance",
"tempo",
"recuperation",
"fractionne",
"longue"
][s];

}

const indexSeance =
(
(semaine - 1)
* seancesParSemaine
)
+ s;

const totalSeances =
semaines
* seancesParSemaine;

let dureeDebut;
let dureeFin;

switch(niveau){

case "Débutant":
dureeDebut = 20;
dureeFin = 35;
break;

case "Reprise":
dureeDebut = 25;
dureeFin = 45;
break;

case "Occasionnel":
dureeDebut = 35;
dureeFin = 60;
break;

case "Régulier":
dureeDebut = 45;
dureeFin = 75;
break;

default:
dureeDebut = 25;
dureeFin = 45;

}

let dureeCible =
Math.round(
dureeDebut +
(
(dureeFin - dureeDebut)
*
(indexSeance /
Math.max(
1,
totalSeances - 1
))
)
);

if(
semaine > 1
&& semaine % 4 === 0
){
dureeCible =
Math.round(
dureeCible * 0.8
);
}

let courseMinutes;
let marcheMinutes;

const progression =
indexSeance /
Math.max(
1,
totalSeances - 1
);

if(tempsActuel < 5){

courseMinutes =
Math.round(
1 + progression * 4
);

marcheMinutes = 2;

}else if(tempsActuel < 10){

courseMinutes =
Math.round(
2 + progression * 6
);

marcheMinutes =
progression > 0.5
? 1
: 2;

}else if(tempsActuel < 20){

courseMinutes =
Math.round(
3 + progression * 7
);

marcheMinutes =
progression > 0.5
? 1
: 2;

}else{

courseMinutes =
Math.round(
5 + progression * 10
);

marcheMinutes = 1;

}

const tempsDisponible =
dureeCible - 8;

const repetitions =
Math.max(
2,
Math.round(
tempsDisponible /
(
courseMinutes +
marcheMinutes
)
)
);

let semaineDebutSortieLongue;

switch(niveau){

case "Débutant":
semaineDebutSortieLongue = 4;
break;

case "Reprise":
semaineDebutSortieLongue = 3;
break;

case "Occasionnel":
semaineDebutSortieLongue = 2;
break;

case "Régulier":
semaineDebutSortieLongue = 2;
break;

default:
semaineDebutSortieLongue = 3;

}

if(
typeSeance === "longue"
&& semaine < semaineDebutSortieLongue
){
  typeSeance = "endurance";
}

const estSortieLongue =
(
typeSeance === "longue"
&& semaine >= semaineDebutSortieLongue
);

let distanceFinale;

switch(objectif){

case "5 km":

switch(niveau){

case "Débutant":
distanceFinale = 6;
break;

case "Reprise":
distanceFinale = 7;
break;

case "Occasionnel":
distanceFinale = 8;
break;

case "Régulier":
distanceFinale = 8;
break;

}

break;

case "10 km":

switch(niveau){

case "Débutant":
distanceFinale = 10;
break;

case "Reprise":
distanceFinale = 10;
break;

case "Occasionnel":
distanceFinale = 11;
break;

case "Régulier":
distanceFinale = 12;
break;

}

break;

case "Semi":

switch(niveau){

case "Débutant":
distanceFinale = 18;
break;

case "Reprise":
distanceFinale = 19;
break;

case "Occasionnel":
distanceFinale = 20;
break;

case "Régulier":
distanceFinale = 21;
break;

}

break;

default:

distanceFinale = 10;

}

let dureeContinueFinale =
Math.round(
distanceFinale * allure
);

switch(pathologie){

case "Syndrome rotulien":
dureeContinueFinale =
Math.round(dureeContinueFinale * 0.8);
break;

case "Tendinopathie achilléenne":
dureeContinueFinale =
Math.round(dureeContinueFinale * 0.85);
break;

case "Fasciite plantaire":
dureeContinueFinale =
Math.round(dureeContinueFinale * 0.75);
break;

case "Lombalgie":
dureeContinueFinale =
Math.round(dureeContinueFinale * 0.9);
break;

}


const progressionSortieLongue =
Math.max(
1,
semaines - semaineDebutSortieLongue
);

let dureeContinue;

if(semaine < semaineDebutSortieLongue){

dureeContinue = tempsActuel;

}else{

dureeContinue =
Math.round(
tempsActuel +
(
(semaine - semaineDebutSortieLongue)
*
(dureeContinueFinale - tempsActuel)
/
progressionSortieLongue
)
);

}

if(
objectif === "Semi"
&& semaine === semaines
){

dureeContinue =
Math.round(
dureeContinueFinale * 0.65
);

}

pdfData.push({

semaine,

seance: lettre,

rpe:

estSortieLongue
? "4-5"

: typeSeance === "endurance"
? "3-4"

: typeSeance === "tempo"
? "6-7"

: typeSeance === "recuperation"
? "2-3"

: "7-8",

duree:
estSortieLongue
? dureeContinue
: dureeCible,

courseMinutes,

marcheMinutes,

repetitions,

estSortieLongue,

dureeContinue,

distanceKm:
(
dureeContinue /
allure
).toFixed(1),

typeSeance:
estSortieLongue
? "longue"
: typeSeance

});

const exoMarche =
structuredClone(
marcheBase
);

exoMarche.ex = 300;
exoMarche.repos = 0;
exoMarche.reps = 1;

const exoCourse =
structuredClone(
courseBase
);

if(estSortieLongue){

exoCourse.ex =
dureeContinue * 60;

exoCourse.repos = 0;

exoCourse.reps = 1;

}else if(typeSeance === "endurance"){

exoCourse.ex =
Math.round(
dureeCible * 0.8
) * 60;

exoCourse.repos = 0;
exoCourse.reps = 1;

}else if(typeSeance === "tempo"){

exoCourse.ex =
Math.round(
dureeCible * 0.4
) * 60;

exoCourse.repos = 0;
exoCourse.reps = 1;
}else if(typeSeance === "recuperation"){

exoCourse.ex =
Math.round(
dureeCible * 0.5
) * 60;

exoCourse.repos = 0;
exoCourse.reps = 1;

}else{

// Fractionné

exoCourse.ex =
courseMinutes * 60;

exoCourse.repos =
marcheMinutes * 60;

exoCourse.reps =
repetitions;

}

const exoRecup =
structuredClone(
marcheBase
);

exoRecup.ex = 180;
exoRecup.repos = 0;
exoRecup.reps = 1;


const programme = {

id:
crypto.randomUUID(),

programmeId,
programmeNom,

objectif,
niveau,
pathologie,
semainesProgramme: semaines,
modeAffichage,

pdfData,

nom:
`S${semaine}${lettre}`,

patientId:
patient,

categorie:
"course",

dossier:
dossier,

semaine:
semaine,

seance:
lettre,

createdAt:
Date.now(),

updatedAt:
Date.now(),

dateDebut,

datePrevue:
dateSeance
? dateSeance.toISOString()
: null,

datePrevueTexte:
dateSeance
? dateSeance.toLocaleDateString(
"fr-FR"
)
: "",

auteur:
"gabriel",

data:{

nom:
`S${semaine}${lettre}`,

series:1,

exercices:[

exoMarche,

exoCourse,

exoRecup

]

}


};

if(saveToCloud){ aEnvoyer.push(programme); }
totalCrees++;

}

}

if(saveToCloud){
  await C.saveSeances(cle, aEnvoyer);
  toast(`${aEnvoyer.length} séances envoyées à ${patientNom}.`, { type:"ok" });
}
localStorage.setItem(
  "coursePdfData",
  JSON.stringify({
    patient: patientNom,
    objectif,
    niveau,
    pathologie,
    semaines,
    dateDebut,
    modeAffichage,
    pdfData
  })
);

if(saveToCloud){
  setTimeout(() => { location.href = `/cloud.html?patient=${encodeURIComponent(cle)}`; }, 900);
  window.open("/coursepdf.html", "_blank");
}else{
  window.open("/coursepdf.html", "_blank");
}


}catch(error){

console.error(error);

toast("Erreur lors de la génération : " + (error.message || error), { type:"err" });

}

};


$("#preview").onclick = () => buildProgram(false);
$("#generate").onclick = async () => { $("#generate").disabled = true; try{ await buildProgram(true); } finally { $("#generate").disabled = false; } };
</script>
</body>
</html>
