<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Programmes</title>
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
<style>
  .pt-head{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
  .pt-head .avatar{ width:64px; height:64px; font-size:1.3rem; background:var(--lagon-soft); color:var(--lagon-strong); }
  .pt-head .pt-id{ flex:1 1 220px; min-width:0; }
  .pt-head h1{ font-size:clamp(1.6rem,5vw,2.1rem); }
  .pt-contact{ display:flex; gap:8px 16px; flex-wrap:wrap; margin-top:4px; color:var(--ink-2); font-size:var(--fs-sm); }
  .pt-contact a,.pt-contact span{ display:inline-flex; align-items:center; gap:6px; color:inherit; }
  .pt-contact svg{ width:16px; height:16px; }
  .pt-actions{ display:flex; gap:8px; flex-wrap:wrap; margin-top:16px; }
  .kpis.four{ grid-template-columns:repeat(2,minmax(0,1fr)); }
  @media (min-width:700px){ .kpis.four{ grid-template-columns:repeat(4,minmax(0,1fr)); } }
  .cols{ display:grid; gap:16px; }
  @media (min-width:1000px){ .cols{ grid-template-columns:1.4fr 1fr; align-items:start; } }
  .msg-list{ display:flex; flex-direction:column; gap:12px; }
  .msg-list .m-meta{ font-size:var(--fs-xs); color:var(--ink-3); font-weight:700; }
  .msg-list .is-new .quote{ border-left-color:var(--danger); background:var(--danger-soft, var(--surface-2)); }
  .msg-list .m-meta .badge{ font-size:.68rem; padding:1px 7px; vertical-align:1px; }
  .quote.pre{ white-space:pre-wrap; max-height:14em; overflow:auto; }
  .menu{ position:relative; }
</style>
</head>
<body>
<main class="page" id="app"><div class="loading" style="min-height:50dvh"><div class="spinner"></div><span>Chargement…</span></div></main>
<script type="module" src="/assets/pages/cloud.js"></script>
</body>
</html>
