<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mon suivi</title>
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .sv{ max-width:640px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
  .sv-top{ display:flex; align-items:center; gap:12px; }
  .sv-top .bar{ flex:1; }
  .sv-count{ font-size:var(--fs-sm); color:var(--ink-2); font-weight:700; white-space:nowrap; }
  .sv-sec{ font-size:var(--fs-sm); font-weight:800; color:var(--lagon-strong); }
  .sv-q{ font-size:clamp(1.3rem,4.6vw,1.65rem); font-weight:700; line-height:1.3; }
  .sv-opts{ display:flex; flex-direction:column; gap:10px; }
  .sv-opt{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; min-height:58px; padding:12px 16px; border-radius:var(--r-lg); border:1.5px solid var(--line-strong); background:var(--surface); cursor:pointer; font-size:var(--fs-md); line-height:1.35; transition:border-color .15s, background .15s; }
  .sv-opt:hover{ border-color:var(--lagon); }
  .sv-opt .rad{ width:24px; height:24px; border-radius:50%; border:2px solid var(--line-strong); flex:none; display:grid; place-items:center; }
  .sv-opt[aria-pressed="true"]{ border-color:var(--lagon); background:var(--lagon-soft); }
  .sv-opt[aria-pressed="true"] .rad{ border-color:var(--lagon); background:var(--lagon); }
  .sv-opt[aria-pressed="true"] .rad::after{ content:""; width:8px; height:8px; border-radius:50%; background:#fff; }
  .sv-nav{ display:flex; gap:10px; }
  .sv-nav .btn{ flex:1; }
  .goal{ padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); display:flex; flex-direction:column; gap:12px; }
  .goal h2{ font-size:var(--fs-lg); }
  .scale{ display:grid; grid-template-columns:repeat(11,minmax(0,1fr)); gap:3px; }
  .scale button{ height:44px; min-width:0; border-radius:10px; font-size:var(--fs-sm); border:1.5px solid var(--line-strong); background:var(--surface); font-weight:800; font-family:var(--mono); cursor:pointer; color:var(--ink-2); padding:0; }
  .scale button[aria-pressed="true"]{ background:var(--lagon); border-color:var(--lagon); color:var(--on-lagon); }
  .scale-lab{ display:flex; justify-content:space-between; font-size:var(--fs-xs); color:var(--ink-3); font-weight:700; gap:12px; }
  .scale-lab span:last-child{ text-align:right; }
  .prev{ font-size:var(--fs-xs); color:var(--ink-3); }
</style>
</head>
<body>
<main class="page no-nav" id="app"><div class="loading" style="min-height:50dvh"><div class="spinner"></div><span>Chargement…</span></div></main>
<script type="module">
import { $, $$, esc, icon, params, readPatientContext, mountShell, registerSW, emptyHTML, errorHTML, toast, confirmDialog, fmtShortDate } from "/assets/app.js";
import { computeScore } from "/assets/questionnaires.js";
registerSW();
const app = $("#app");
const ctx = readPatientContext();
const essai = params.get("essai") === "1";
const C = await import("/assets/cloud.js");
/* Le kiné peut remplir un questionnaire avec le patient, au cabinet */
const pour = params.get("pour");
if(pour && await C.currentKine().catch(() => null)){ ctx.cle = pour; ctx.apercu = false; }
const home = pour ? `/cloud.html?patient=${encodeURIComponent(pour)}` : essai ? "/questionnaires.html" : "/index.html";
mountShell({ role:"none", back: home, apercu:ctx.apercu && !pour });

const qid = params.get("q");
const done = (title, text) => {
  app.innerHTML = `<section class="sv" style="padding-top:8vh;text-align:center">
    <div class="empty" style="padding:0"><div class="e-ico" style="background:var(--ok-soft);color:var(--ok)">${icon("check")}</div></div>
    <h1>${esc(title)}</h1><p class="muted">${esc(text)}</p>
    <a class="btn primary big block" href="${home}">${icon(pour || essai ? "back" : "home")}${pour ? "Retour à la fiche" : essai ? "Retour aux questionnaires" : "Retour à l'accueil"}</a></section>`;
};
const save = async suivi => {
  if(essai || ctx.apercu) return true;
  try{ await C.addSuivi(ctx.cle, suivi); return true; }
  catch(err){ toast(navigator.onLine ? "L'envoi n'a pas abouti. Réessayez dans un instant." : "Pas de connexion. Réessayez une fois connecté.", { type:"err" }); return false; }
};

if(!ctx.cle && !essai){ location.replace("/index.html"); }
else if(qid) questionnaire();
else if(params.get("objectifs")) objectifs();
else location.replace("/index.html");

/* ---------- Questionnaire, une question par écran ---------- */
async function questionnaire(){
  let q;
  try{ q = await C.getQuestionnaire(qid); }catch(err){ app.innerHTML = errorHTML(err); return; }
  if(!q || !q.items?.length){ app.innerHTML = `<div class="panel">${emptyHTML({ ico:"list", title:"Questionnaire introuvable", action:`<a class="btn" href="${home}">Retour</a>` })}</div>`; return; }
  const rep = Array(q.items.length).fill(null);
  let i = -1;
  const intro = () => {
    app.innerHTML = `<section class="sv">
      ${essai ? `<div class="notice warn">${icon("eye")}<span>Essai : vos réponses ne sont pas enregistrées.</span></div>` : ""}
      <div class="page-head" style="margin-bottom:0"><h1>${esc(q.nom)}</h1></div>
      ${q.consigne ? `<p style="font-size:var(--fs-lg)">${esc(q.consigne)}</p>` : ""}
      <p class="muted">${q.items.length} questions, environ ${Math.max(2, Math.round(q.items.length * 0.2))} minutes. Il n'y a pas de bonne ou de mauvaise réponse : répondez spontanément.</p>
      <button class="btn primary big block" type="button" id="go">${icon("play")}Commencer</button></section>`;
    $("#go").onclick = () => { i = 0; show(); };
  };
  const show = () => {
    const it = q.items[i];
    const prevSec = i > 0 ? q.items[i - 1].section : null;
    app.innerHTML = `<section class="sv">
      <div class="sv-top"><div class="bar"><i style="--p:${Math.round(i * 100 / q.items.length)}%"></i></div><span class="sv-count">${i + 1} / ${q.items.length}</span></div>
      ${it.section && it.section !== prevSec ? `<div class="sv-sec">${esc(it.section)}</div>` : ""}
      <h1 class="sv-q" id="sv-q">${esc(it.texte)}</h1>
      <div class="sv-opts" role="radiogroup" aria-labelledby="sv-q">${it.options.map((o, k) => `<button class="sv-opt" type="button" role="radio" data-k="${k}" aria-pressed="${rep[i] === o.valeur && rep[i] !== null}" aria-checked="${rep[i] === o.valeur}"><span class="rad"></span><span>${esc(o.texte)}</span></button>`).join("")}</div>
      <div class="sv-nav">
        <button class="btn" type="button" id="prev" ${i === 0 ? "disabled" : ""}>${icon("back")}Précédente</button>
        <button class="btn ${rep[i] === null ? "ghost" : "primary"}" type="button" id="next">${rep[i] === null ? "Passer" : (i === q.items.length - 1 ? "Terminer" : "Suivante")}</button>
      </div></section>`;
    $$(".sv-opt").forEach(b => b.onclick = () => {
      rep[i] = it.options[+b.dataset.k].valeur;
      $$(".sv-opt").forEach(x => { x.setAttribute("aria-pressed", String(x === b)); x.setAttribute("aria-checked", String(x === b)); });
      setTimeout(next, 280);
    });
    $("#prev").onclick = () => { if(i > 0){ i--; show(); } };
    $("#next").onclick = next;
    window.scrollTo(0, 0);
  };
  const next = async () => {
    if(i < q.items.length - 1){ i++; show(); return; }
    const missing = rep.filter(x => x === null).length;
    if(missing && !await confirmDialog({ title:"Envoyer vos réponses ?", message:`${missing} question${missing > 1 ? "s sont restées" : " est restée"} sans réponse.`, confirm:"Envoyer", cancel:"Revenir" })) return;
    const { score, sousScores } = computeScore(q, rep);
    const ok = await save({ type:"questionnaire", qid:q.id, nom:q.nom, reponses:rep, ...(score !== null ? { score } : {}), ...(sousScores ? { sousScores } : {}), unite:q.unite || null });
    if(ok) done("Merci !", essai ? `Score calculé : ${score === null ? "non calculable" : score}.` : "Vos réponses sont transmises à votre kiné. Il en discutera avec vous.");
  };
  intro();
}

/* ---------- Objectifs personnels ---------- */
async function objectifs(){
  let p, suivis = [];
  try{ [p, suivis] = await Promise.all([C.getPatient(ctx.cle), C.listSuivis(ctx.cle)]); }
  catch(err){ app.innerHTML = errorHTML(err); return; }
  const goals = (p?.objectifs || []);
  if(!goals.length){ app.innerHTML = `<div class="panel">${emptyHTML({ ico:"target", title:"Pas d'objectif pour l'instant", text:"Votre kiné les définira avec vous." })}</div>`; return; }
  const last = suivis.filter(s => s.type === "objectifs").pop();
  const notes = {};
  app.innerHTML = `<section class="sv">
    <div class="page-head" style="margin-bottom:0"><h1>Mes objectifs</h1><p class="lead">Pour chaque objectif, où en êtes-vous aujourd'hui ? 0 = impossible à faire, 10 = comme avant votre problème.</p></div>
    ${goals.map(g => `<div class="goal" data-g="${esc(g.id)}">
      <h2>${esc(g.texte)}</h2>
      <div class="scale" role="radiogroup" aria-label="${esc(g.texte)}">${Array.from({ length:11 }, (_, v) => `<button type="button" role="radio" data-v="${v}" aria-pressed="false" aria-checked="false">${v}</button>`).join("")}</div>
      <div class="scale-lab"><span>Impossible</span><span>Comme avant</span></div>
      ${last?.notes?.[g.id] !== undefined ? `<div class="prev">La dernière fois (${esc(fmtShortDate(last.date))}) : ${esc(last.notes[g.id])}/10</div>` : ""}
    </div>`).join("")}
    <button class="btn primary big block" type="button" id="send" disabled>${icon("check")}Enregistrer</button></section>`;
  $$(".goal").forEach(box => box.querySelectorAll("[data-v]").forEach(b => b.onclick = () => {
    notes[box.dataset.g] = Number(b.dataset.v);
    box.querySelectorAll("[data-v]").forEach(x => { x.setAttribute("aria-pressed", String(x === b)); x.setAttribute("aria-checked", String(x === b)); });
    $("#send").disabled = Object.keys(notes).length < goals.length;
  }));
  $("#send").onclick = async () => {
    $("#send").disabled = true;
    if(await save({ type:"objectifs", notes })) done("Merci !", "Votre kiné verra vos progrès. Rendez-vous dans deux semaines pour faire le point.");
    else $("#send").disabled = false;
  };
}
</script>
</body>
</html>
