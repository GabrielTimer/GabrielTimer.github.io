<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ordonnance</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Ordonnance du kiné : en-tête du cabinet (Réglages du cabinet, dont RPPS et n° AM), date du jour,
     nom et prénom du patient, prescription libre. Sortie : Word (.doc), impression ou PDF.
     URL : /ordonnance.html ou /ordonnance.html?patient=CODE (nom et prénom pré-remplis). */
  body{ background:var(--bg); }
  .tools{ position:sticky; top:0; z-index:5; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end; padding:12px var(--gutter); background:var(--surface); border-bottom:1px solid var(--line); }
  .tools .field{ margin:0; min-width:0; }
  .tools .field label{ font-size:var(--fs-xs); }
  .tools .spacer{ flex:1; }
  .tools .hint{ width:100%; margin:0; }
  #pick{ min-width:220px; }
  .sheet-a4{ width:min(100% - 24px, 210mm); min-height:270mm; margin:20px auto 60px; background:#fff; color:#14303A; padding:18mm 18mm 16mm; box-shadow:var(--shadow-2); border-radius:6px; font-size:11pt; line-height:1.5; display:flex; flex-direction:column; }
  .or-head{ display:flex; justify-content:space-between; gap:16px; align-items:flex-start; padding-bottom:12px; border-bottom:1.5px solid #138FA6; }
  .or-id{ display:flex; gap:12px; align-items:flex-start; }
  .or-id img{ width:48px; height:48px; object-fit:contain; }
  .or-id strong{ display:block; font-size:13pt; color:#0B6E80; }
  .or-id .or-num{ font-size:9.5pt; color:#47616B; margin-top:4px; }
  .or-cab{ text-align:right; font-size:9.5pt; color:#47616B; white-space:pre-line; }
  .or-date{ text-align:right; margin:22px 0 18px; }
  .or-pat{ display:flex; flex-wrap:wrap; gap:8px 26px; margin-bottom:22px; }
  .or-pat label{ display:flex; align-items:baseline; gap:8px; flex:1 1 200px; font-weight:600; }
  .or-pat input{ flex:1; min-width:0; border:0; border-bottom:1.5px dotted #9FB6BC; background:transparent; font:inherit; font-weight:400; color:inherit; padding:2px 4px; }
  .or-pat input:focus{ outline:none; border-bottom-color:#138FA6; background:#F2F8F9; }
  .or-pat .nom input{ text-transform:uppercase; }
  .or-presc{ flex:1; min-height:110mm; white-space:pre-wrap; padding:6px; border-radius:4px; }
  .or-presc:focus{ outline:2px dashed #9FB6BC; outline-offset:4px; }
  .or-presc:empty::before{ content:attr(data-ph); color:#9FB6BC; }
  .or-sign{ margin:18px 0 0 auto; width:min(48%, 80mm); text-align:center; }
  .or-sign .space{ height:60px; }
  @media print{
    @page{ size:A4; margin:14mm; }
    body{ background:#fff; }
    .tools{ display:none; }
    .sheet-a4{ width:auto; min-height:calc(297mm - 28mm); margin:0; padding:0; box-shadow:none; border-radius:0; }
    .or-presc:empty::before{ content:""; }
    .or-pat input{ border-bottom-color:#14303A; background:transparent; }
  }
</style>
</head>
<body>
<div class="tools">
  <a class="btn sm ghost" id="back" href="/admin_tools.html">Retour</a>
  <div class="field"><label for="pick">Patient enregistré (facultatif)</label><input class="input" id="pick" list="pick-list" autocomplete="off" placeholder="Rechercher un patient"><datalist id="pick-list"></datalist></div>
  <div class="field"><label for="date">Date</label><input class="input" id="date" type="date"></div>
  <span class="spacer"></span>
  <button class="btn" type="button" id="clear">Vider</button>
  <button class="btn" type="button" id="word">Word</button>
  <button class="btn primary" type="button" id="print">Imprimer ou PDF</button>
  <p class="hint" id="hint">Remplissez le nom, le prénom et la prescription directement sur l'ordonnance.</p>
</div>
<div class="sheet-a4" id="doc">
  <div class="or-head">
    <div class="or-id"><img id="o-logo" alt=""><div><strong id="o-nom"></strong><span id="o-titre"></span><div class="or-num" id="o-num"></div></div></div>
    <div class="or-cab" id="o-cab"></div>
  </div>
  <p class="or-date" id="o-date"></p>
  <div class="or-pat">
    <label class="nom">Nom :<input id="p-nom" type="text" autocomplete="off" spellcheck="false"></label>
    <label>Prénom :<input id="p-prenom" type="text" autocomplete="off" spellcheck="false"></label>
  </div>
  <div class="or-presc" id="presc" contenteditable="true" data-ph="Prescription : touchez ici pour écrire…"></div>
  <div class="or-sign"><div class="space"></div><span id="o-sign"></span></div>
</div>
<script type="module">
import { $, esc, icon, params, settings, logoSrc, KINE, toast, confirmDialog } from "/assets/app.js";
import { loadSettings } from "/assets/settings.js";
import { nomDeFamille } from "/assets/noms.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
const C = await import("/assets/cloud.js");

$("#back").innerHTML = icon("back") + "Retour";
$("#print").innerHTML = icon("print") + $("#print").textContent;
$("#word").innerHTML = icon("download") + $("#word").textContent;
$("#clear").innerHTML = icon("trash") + $("#clear").textContent;

/* ---------- En-tête du cabinet ---------- */
const PROVISOIRES = { rpps:"10101234567", am:"86 1 23456 7" };
function entete(){
  const c = settings.cabinet || {};
  $("#o-logo").src = logoSrc();
  $("#o-nom").textContent = c.nom || KINE.nom;
  $("#o-titre").textContent = c.titre || KINE.titre;
  $("#o-num").innerHTML = [c.rpps && `N° RPPS : ${esc(c.rpps)}`, c.am && `N° AM : ${esc(c.am)}`].filter(Boolean).join("<br>");
  $("#o-cab").textContent = [c.adresse, c.telephone && `Tél. ${c.telephone}`].filter(Boolean).join("\n");
  $("#o-sign").textContent = c.nom || KINE.nom;
  const prov = (c.rpps && c.rpps === PROVISOIRES.rpps) || (c.am && c.am === PROVISOIRES.am);
  $("#hint").innerHTML = prov
    ? `${icon("alert")} RPPS et n° AM provisoires : remplacez-les dans <a href="/reglages_cabinet.html">Réglages du cabinet</a> avant d'utiliser l'ordonnance.`
    : "Remplissez le nom, le prénom et la prescription directement sur l'ordonnance.";
  $("#hint").style.color = prov ? "var(--danger)" : "";
}
entete();
loadSettings({ force:true }).then(entete);

/* ---------- Date (du jour par défaut) ---------- */
const iso = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
const ville = () => (String(settings.cabinet?.adresse || "").trim().split("\n").pop().match(/\d{5}\s+(.+)$/) || [])[1] || "";
function dateTexte(){
  const v = $("#date").value || iso(new Date());
  const [y, m, d] = v.split("-").map(Number);
  const txt = new Date(y, m - 1, d).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
  return `${ville() ? ville() + ", le" : "Le"} ${txt}`;
}
$("#date").value = iso(new Date());
const majDate = () => { $("#o-date").textContent = dateTexte(); };
majDate();
$("#date").addEventListener("change", majDate);
loadSettings().then(majDate);

/* ---------- Patient ---------- */
function remplirPatient(nomComplet){
  const n = String(nomComplet || "").trim().replace(/\s+/g, " ");
  const fam = nomDeFamille(n);
  const prenom = fam && fam !== n ? (n.startsWith(fam) ? n.slice(fam.length) : n.slice(0, n.length - fam.length)).trim() : "";
  $("#p-nom").value = (fam || n).toLocaleUpperCase("fr");
  $("#p-prenom").value = prenom.split(" ").map(w => w.split("-").map(x => x.charAt(0).toLocaleUpperCase("fr") + x.slice(1)).join("-")).join(" ");
  document.title = `Ordonnance – ${$("#p-nom").value} ${$("#p-prenom").value}`.trim();
}
const cle = params.get("patient");
if(cle){
  C.getPatient(cle).then(p => {
    if(!p) return;
    remplirPatient(p.nom);
    $("#back").href = `/cloud.html?patient=${encodeURIComponent(cle)}`;
    $("#back").innerHTML = icon("back") + "Retour à la fiche";
  }).catch(() => {});
}
let patients = [];
C.listPatients().then(l => {
  patients = l.filter(p => p.nom && !p.archive);
  $("#pick-list").innerHTML = patients.map(p => `<option value="${esc(p.nom)}"></option>`).join("");
}).catch(() => {});
$("#pick").addEventListener("change", () => {
  const p = patients.find(x => x.nom === $("#pick").value);
  if(p){ remplirPatient(p.nom); $("#presc").focus(); }
});

/* Collage : texte brut seulement (pas de mise en forme venue d'ailleurs) */
$("#presc").addEventListener("paste", e => {
  e.preventDefault();
  document.execCommand("insertText", false, (e.clipboardData || window.clipboardData).getData("text"));
});
const prescription = () => $("#presc").innerText.replace(/ /g, " ").replace(/\n{3,}/g, "\n\n").trim();

$("#clear").onclick = async () => {
  if((prescription() || $("#p-nom").value) && !await confirmDialog({ title:"Vider l'ordonnance ?", message:"Le nom, le prénom et la prescription seront effacés.", confirm:"Vider" })) return;
  $("#p-nom").value = $("#p-prenom").value = $("#pick").value = "";
  $("#presc").textContent = "";
  $("#date").value = iso(new Date()); majDate();
  document.title = "Ordonnance";
};

function verif(){
  if(!prescription()){ toast("La prescription est vide.", { type:"err" }); $("#presc").focus(); return false; }
  return true;
}
$("#print").onclick = () => { if(verif()) print(); };

/* ---------- Word : document .doc (ouvert et modifiable dans Word, Pages ou LibreOffice) ---------- */
$("#word").onclick = () => {
  const c = settings.cabinet || {};
  const br = s => esc(s).replace(/\n/g, "<br>");
  const ligne = "……………………………";
  const nom = $("#p-nom").value.trim().toLocaleUpperCase("fr"), prenom = $("#p-prenom").value.trim();
  const presc = prescription();
  const html = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40">
<head><meta charset="utf-8"><title>Ordonnance</title>
<!--[if gte mso 9]><xml><w:WordDocument><w:View>Print</w:View><w:Zoom>100</w:Zoom></w:WordDocument></xml><![endif]-->
<style>
@page Section1{ size:21cm 29.7cm; margin:1.6cm 1.8cm 1.6cm 1.8cm; }
div.Section1{ page:Section1; }
body{ font-family:Calibri, Arial, sans-serif; font-size:11pt; color:#14303A; }
p{ margin:0 0 6pt; }
.nom{ font-size:14pt; font-weight:bold; color:#0B6E80; margin:0; }
.petit{ font-size:9.5pt; color:#47616B; }
</style></head>
<body><div class="Section1">
<table width="100%" cellpadding="0" cellspacing="0" style="border-collapse:collapse;border-bottom:1.5pt solid #138FA6">
<tr><td valign="top" style="padding-bottom:8pt">
<p class="nom">${esc(c.nom || KINE.nom)}</p>
<p style="margin:0">${esc(c.titre || KINE.titre)}</p>
<p class="petit" style="margin:4pt 0 0">${[c.rpps && `N° RPPS : ${esc(c.rpps)}`, c.am && `N° AM : ${esc(c.am)}`].filter(Boolean).join("<br>")}</p>
</td><td valign="top" align="right" style="padding-bottom:8pt">
<p class="petit" style="margin:0;text-align:right">${br([c.adresse, c.telephone && `Tél. ${c.telephone}`].filter(Boolean).join("\n"))}</p>
</td></tr></table>
<p style="text-align:right;margin:22pt 0 18pt">${esc(dateTexte())}</p>
<p style="margin:0 0 20pt"><b>Nom :</b> ${esc(nom) || ligne}&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;<b>Prénom :</b> ${esc(prenom) || ligne}</p>
<p style="min-height:12cm">${presc ? br(presc) : "&nbsp;"}</p>
${"<p>&nbsp;</p>".repeat(presc ? 10 : 14)}
<p>&nbsp;</p><p>&nbsp;</p>
<p style="text-align:right;margin-top:40pt">${esc(c.nom || KINE.nom)}</p>
</div></body></html>`;
  const blob = new Blob(["﻿", html], { type:"application/msword" });
  const slug = s => String(s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^A-Za-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
  const fichier = ["Ordonnance", slug(nom), slug(prenom), $("#date").value].filter(Boolean).join("_") + ".doc";
  const a = Object.assign(document.createElement("a"), { href: URL.createObjectURL(blob), download: fichier });
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  toast("Ordonnance téléchargée au format Word.", { type:"ok" });
};
</script>
</body>
</html>
