<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Espace kiné – Connexion</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .login{ min-height:100dvh; display:grid; place-items:center; padding:24px var(--gutter); }
  .login-box{ width:min(100%,420px); display:flex; flex-direction:column; gap:22px; }
  .login-head{ text-align:center; }
  .login-head img{ width:72px; height:72px; margin:0 auto 12px; }
  .login-head p{ color:var(--ink-2); }
  .pwd{ position:relative; }
  .pwd .input{ padding-right:52px; }
  .pwd .icon-btn{ position:absolute; right:2px; top:2px; }
</style>
</head>
<body>
<main class="login">
  <div class="login-box">
    <div class="login-head">
      <img src="/logo.png" alt="">
      <h1>Espace kiné</h1>
      <p>Connectez-vous pour gérer vos patients et leurs programmes.</p>
    </div>
    <form class="panel raised stack" style="--gap:16px" id="form" novalidate>
      <div class="field"><label for="email">Adresse e-mail</label><input class="input" id="email" type="email" autocomplete="username" inputmode="email" required></div>
      <div class="field"><label for="pwd">Mot de passe</label>
        <div class="pwd"><input class="input" id="pwd" type="password" autocomplete="current-password" required><button class="icon-btn" type="button" id="show" aria-label="Afficher le mot de passe"></button></div>
      </div>
      <p class="hint" id="msg" role="alert" style="min-height:1.2em"></p>
      <button class="btn primary big block" type="submit" id="go">Se connecter</button>
      <button class="btn ghost sm" type="button" id="forgot" style="align-self:center">Mot de passe oublié</button>
    </form>
    <a class="btn ghost" href="/index.html">Retour à l'accueil</a>
  </div>
</main>
<script type="module">
import { $, icon, kineHint, toast, logoSrc } from "/assets/app.js";
document.querySelectorAll('img[src="/logo.png"]').forEach(i => i.src = logoSrc());
import { ADMIN_EMAILS } from "/assets/config.js";
const C = await import("/assets/cloud.js");

const next = new URLSearchParams(location.search).get("next");
const safeNext = next && next.startsWith("/") && !next.startsWith("//") ? next : "/index.html";

if(await C.currentKine().catch(() => null)){ kineHint.set(true); location.replace(safeNext); }

$("#email").value = localStorage.getItem("gt_kine_email") || ADMIN_EMAILS[0] || "";
$("#show").innerHTML = icon("eye");
$("#show").onclick = () => { const p = $("#pwd"); p.type = p.type === "password" ? "text" : "password"; };

const msgs = {
  "auth/invalid-credential":"E-mail ou mot de passe incorrect.",
  "auth/wrong-password":"E-mail ou mot de passe incorrect.",
  "auth/user-not-found":"Aucun compte avec cette adresse.",
  "auth/too-many-requests":"Trop de tentatives. Patientez quelques minutes.",
  "auth/network-request-failed":"Pas de connexion internet.",
  "auth/invalid-email":"Adresse e-mail invalide.",
  "app/not-kine":"Ce compte n'a pas accès à l'espace kiné."
};

$("#form").addEventListener("submit", async e => {
  e.preventDefault();
  const email = $("#email").value.trim(), pwd = $("#pwd").value;
  if(!email || !pwd){ $("#msg").textContent = "Renseignez l'e-mail et le mot de passe."; return; }
  $("#go").disabled = true; $("#msg").textContent = "Connexion…";
  try{
    await C.loginKine(email, pwd);
    localStorage.setItem("gt_kine_email", email);
    kineHint.set(true);
    location.replace(safeNext);
  }catch(err){
    $("#go").disabled = false;
    $("#msg").textContent = msgs[err.code] || "Connexion impossible. Réessayez.";
  }
});
$("#forgot").onclick = async () => {
  const email = $("#email").value.trim();
  if(!email){ $("#msg").textContent = "Indiquez d'abord votre adresse e-mail."; return; }
  try{ await C.resetPassword(email); toast("Un e-mail de réinitialisation vous a été envoyé.", { type:"ok" }); }
  catch(err){ $("#msg").textContent = msgs[err.code] || "Envoi impossible."; }
};
</script>
</body>
</html>
