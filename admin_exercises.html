<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Exercises V1</title>

<meta name="robots" content="noindex">
<link rel="icon" href="/icon-192.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .container{ max-width:1100px; }
  .container h1{ margin:12px 0 6px; }
  .subtitle{ color:var(--ink-2); margin-bottom:20px; }
  .container .card{ background:var(--surface); border:1px solid var(--line); border-radius:var(--r-lg); padding:20px; margin-bottom:20px; }
  .container label{ display:block; font-weight:700; color:var(--ink-2); margin:10px 0 8px; font-size:var(--fs-sm); }
  .container textarea{ width:100%; min-height:180px; border:1.5px solid var(--line-strong); border-radius:var(--r-md); padding:14px; background:var(--surface-2); color:var(--ink); font-family:var(--mono); font-size:var(--fs-sm); resize:vertical; }
  .container textarea:focus{ outline:none; border-color:var(--lagon); }
  #generatedJson{ min-height:380px; }
  .container button{ display:inline-flex; align-items:center; gap:8px; min-height:44px; padding:0 16px; margin:0 8px 10px 0; border-radius:var(--r-md); border:1.5px solid var(--line-strong); background:var(--surface); color:var(--ink); font-weight:700; cursor:pointer; }
  .container button.primary{ background:var(--lagon); border-color:var(--lagon); color:var(--on-lagon); }
  .container button.secondary{ background:var(--lagon-soft); border-color:transparent; color:var(--lagon-strong); }
  .container button.success{ background:var(--ok); border-color:var(--ok); color:#fff; }
  .container hr{ border:0; border-top:1px solid var(--line); }
  .stats{ display:flex; flex-wrap:wrap; gap:10px; margin-top:16px; }
  .stat{ background:var(--surface-2); padding:10px 14px; border-radius:var(--r-md); font-weight:700; }
  .small{ color:var(--ink-3); }
</style>
</head>
<body>

<main class="page wide"><div class="container">

<h1>Gestion des exercices</h1>

<div class="subtitle">
Créer et fusionner rapidement des exercices/programmes JSON.
</div>

<div class="card">

<label>Prompt programme</label>

<textarea id="promptInput">
Tu es un kinésithérapeute expert.

Génère un JSON compatible avec mon site.

IMPORTANT :
- Si la demande concerne un EXERCICE :
  → générer un exercice complet

- Si la demande concerne un PROGRAMME :
  → générer uniquement un programme contenant des IDs exercices

────────────────────
FORMAT EXERCICE
────────────────────

{
  "id": "",
  "nom": "",
  "type": "timer",

  "categorie": "",

  "objectif": "",

  "niveau": 1,

  "exercise_mode": "dynamique",

  "duree": "",

  "consignes": [],

  "precautions": [],

  "tags": [],

  "timer_config": {
    "mode": "dynamique",
    "phase_monte": 3,
    "maintien": 1,
    "phase_descente": 3,
    "cycles": 10
  },

  "ex": 30,

  "repos": 20,

  "reps": 10,

  "image": "/exercises/images/placeholders/default.png",

  "video": "",

  "pathologies": [],

  "objectifs": [],

  "zones": [],

  "materiel": []
}

────────────────────
FORMAT PROGRAMME
────────────────────

{
  "id": "",

  "nom": "",

  "categorie": "",

  "niveau": 1,

  "description": "",

  "objectif": "",

  "objectifs": [],

  "pathologies": [],

  "zones": [],

  "materiel": [],

  "tags": [],

  "image": "/exercises/images/placeholders/default.png",

  "video": "",

  "consignes": [],

  "exercices": []
}

IMPORTANT :
- Un programme NE contient PAS les exercices complets
- "exercices" contient uniquement des IDs
- Ne jamais utiliser timer_config dans un programme
- Réutiliser les exercices existants au maximum
- Éviter les doublons inutiles
- Construire des progressions cohérentes et réalistes</textarea>

<div class="small">
Tu écris ici le programme souhaité puis tu demandes à ChatGPT de générer le JSON.
</div>

</div>

<div class="card">

<h2>Gestion Exercices</h2>

<label>JSON exercices</label>

<textarea
id="exercisesJson"
placeholder='Colle ici les exercices JSON...'></textarea>

<div style="margin-top:20px;">

<button
class="secondary"
onclick="mergeExercisesOnly()">
Importer exercices
</button>

<button
class="success"
onclick="exportExercisesJson()">
Exporter exercises.json
</button>

</div>

<hr style="margin:40px 0;">

<h2>Gestion Programmes</h2>

<label>JSON programmes</label>

<textarea
id="programsJson"
placeholder='Colle ici les programmes JSON...'></textarea>

<div style="margin-top:20px;">

<button
class="primary"
onclick="mergeProgramsOnly()">
Importer programmes
</button>

<button
class="success"
onclick="exportProgramsJson()">
Exporter program_templates.json
</button>

</div>

<div style="margin-top:20px;">


</div>

<div class="stats">

<div class="stat">
Exercices actuels : <span id="currentCount">0</span>
</div>

<div class="stat">
Nouveaux exercices : <span id="newCount">0</span>
</div>

<div class="stat">
Total final : <span id="finalCount">0</span>
</div>

</div>

</div>

</div>

</main>
<script>

if(
  localStorage.getItem("admin_ok")
  !== "true"
){

  window.location.href =
  "login.html";

}

let currentExercises = [];
let mergedExercises = [];

let currentPrograms = [];
let mergedPrograms = [];

function updateStats(newExercises = []){

  document.getElementById('currentCount').textContent =
  currentExercises.length;

  document.getElementById('newCount').textContent =
  newExercises.length;

  document.getElementById('finalCount').textContent =
  mergedExercises.length;
}

function normalizeText(text){

  return (text || '')
  .toLowerCase()
  .normalize('NFD')
  .replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]/g,'');

}

async function loadCurrentJson(){

  try{

    const exResponse =
    await fetch('./exercises/data/exercises.json');

    currentExercises =
    await exResponse.json();

    mergedExercises = [...currentExercises];

    const progResponse =
    await fetch('./exercises/data/program_templates.json');

    currentPrograms =
    await progResponse.json();

    mergedPrograms = [...currentPrograms];

    updateStats();



    alert('JSON chargés avec succès');

  } catch(error){

    console.error(error);

    alert('Erreur chargement JSON');

  }
}

function mergeExercisesOnly(){

  try{

    const jsonText =
    document.getElementById(
      'exercisesJson'
    ).value;

    if(!jsonText.trim()){

      alert('Aucun JSON exercices');

      return;
    }

    const parsed =
    JSON.parse(jsonText);

    const newExercises =
    Array.isArray(parsed)
    ? parsed
    : [parsed];

    let added = 0;

    newExercises.forEach(newEx => {

      const exists =
      mergedExercises.some(ex =>
        ex.id === newEx.id
      );

      if(!exists){

        mergedExercises.push(newEx);

        added++;

      }

    });

    updateStats(newExercises);

    alert(
      added +
      ' exercices ajoutés'
    );

  }catch(error){

    console.error(error);

    alert(
      'JSON exercices invalide'
    );

  }

}

function mergeProgramsOnly(){

  try{

    const jsonText =
    document.getElementById(
      'programsJson'
    ).value;

    if(!jsonText.trim()){

      alert('Aucun JSON programmes');

      return;
    }

    const parsed =
    JSON.parse(jsonText);

    const newPrograms =
    Array.isArray(parsed)
    ? parsed
    : [parsed];

    let added = 0;

    newPrograms.forEach(program => {

      const exists =
      mergedPrograms.some(p =>
        p.id === program.id
      );

      if(!exists){

        mergedPrograms.push(program);

        added++;

      }

    });

    validatePrograms();

    alert(
      added +
      ' programmes ajoutés'
    );

  }catch(error){

    console.error(error);

    alert(
      'JSON programmes invalide'
    );

  }

}

function validatePrograms(){

  let errors = [];

  mergedPrograms.forEach(program => {

    (program.exercices || [])
    .forEach(id => {

      const exists =
      mergedExercises.some(ex =>
        ex.id === id
      );

      if(!exists){

        errors.push(
          program.nom +
          ' -> exercice manquant : ' +
          id
        );

      }

    });

  });

  if(errors.length){

    console.error(errors);

    alert(
      'Erreurs programmes. Voir console.'
    );

  }

}

function exportExercisesJson(){

  if(!mergedExercises.length){

    alert('Aucun exercice');

    return;
  }

  const jsonString =
  JSON.stringify(mergedExercises, null, 2);

  downloadJson(
    jsonString,
    'exercises.json'
  );
}

function exportProgramsJson(){

  if(!mergedPrograms.length){

    alert('Aucun programme');

    return;
  }

  const jsonString =
  JSON.stringify(mergedPrograms, null, 2);

  downloadJson(
    jsonString,
    'program_templates.json'
  );
}

function downloadJson(jsonString, filename){

  const blob = new Blob(
    [jsonString],
    { type:'application/json' }
  );

  const url =
  URL.createObjectURL(blob);

  const a =
  document.createElement('a');

  a.href = url;

  a.download = filename;

  a.click();

  URL.revokeObjectURL(url);
}

</script>

<script type="module">
import { mountShell } from "/assets/app.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
mountShell({ role:"kine", active:"", back:"/admin_tools.html" });
</script>
</body>
</html>
