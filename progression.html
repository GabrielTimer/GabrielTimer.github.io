<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma progression</title>
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/home.css">
<style>
  .pg-top{ display:grid; gap:14px; grid-template-columns:1fr; }
  @media (min-width:640px){ .pg-top{ grid-template-columns:auto 1fr; align-items:center; } }
  .ring-big{ position:relative; width:180px; height:180px; margin:0 auto; }
  .ring-big svg{ width:100%; height:100%; transform:rotate(-90deg); }
  .ring-big circle{ fill:none; stroke-width:14; }
  .ring-big .bg{ stroke:var(--surface-3); }
  .ring-big .fg{ stroke:var(--lagon); stroke-linecap:round; transition:stroke-dashoffset 1s ease-out; }
  .ring-big .in{ position:absolute; inset:0; display:grid; place-content:center; text-align:center; }
  .ring-big .pct{ font-family:var(--mono); font-weight:700; font-size:2.6rem; line-height:1; }
  .ring-big .lab{ font-size:var(--fs-sm); color:var(--ink-2); }
  .compare{ display:flex; align-items:center; gap:14px; flex-wrap:wrap; }
  .compare .c-box{ display:flex; align-items:center; gap:10px; }
  .compare img{ width:46px; height:46px; }
  .compare .c-val{ font-family:var(--mono); font-weight:700; font-size:1.8rem; line-height:1; }
  .compare .c-lab{ font-size:var(--fs-xs); color:var(--ink-3); font-weight:700; }
  .compare .arrow{ color:var(--ink-3); }
  .compare .arrow svg{ width:28px; height:28px; }
  .cal{ display:grid; grid-template-columns:repeat(7,1fr); gap:6px; }
  .cal .h{ text-align:center; font-size:var(--fs-xs); font-weight:700; color:var(--ink-3); }
  .cal .d{ aspect-ratio:1; border-radius:10px; display:grid; place-items:center; font-family:var(--mono); font-size:var(--fs-sm); color:var(--ink-3); background:var(--surface-2); position:relative; }
  .cal .d.out{ background:transparent; color:transparent; }
  .cal .d.planned{ box-shadow:inset 0 0 0 2px var(--lagon); color:var(--lagon-strong); font-weight:700; background:var(--surface); }
  .cal .d.done{ background:var(--lagon); color:var(--on-lagon); font-weight:700; }
  .cal .d.missed{ box-shadow:inset 0 0 0 2px var(--danger); color:var(--danger); background:var(--surface); }
  .cal .d.today::after{ content:""; position:absolute; bottom:4px; width:5px; height:5px; border-radius:50%; background:var(--soleil); }
  .cal .m{ grid-column:1/-1; font-weight:800; margin-top:8px; }
</style>
</head>
<body>
<main class="page" id="app"><div class="loading" style="min-height:50dvh"><div class="spinner"></div><span>Chargement…</span></div></main>
<script type="module" src="/assets/pages/progression.js"></script>
</body>
</html>
