<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Séance en cours</title>
<meta name="theme-color" content="#EDF3F4">
<link rel="manifest" href="/manifest.json">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="stylesheet" href="/assets/app.css">
<link rel="stylesheet" href="/assets/pages/timer.css">
</head>
<body class="timer-page" data-phase="prep">

<div class="t-wrap">
  <header class="t-top">
    <button class="icon-btn" type="button" id="quit" aria-label="Arrêter la séance"><svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
    <div class="t-count" id="count" aria-live="polite"></div>
    <button class="icon-btn" type="button" id="sound" aria-label="Couper le son"></button>
  </header>

  <div class="spine thick t-spine" id="spine" aria-hidden="true"></div>

  <main class="t-main">
    <section class="t-visual">
      <figure class="t-figure" id="figure"></figure>
      <div class="t-names">
        <h1 class="t-name" id="name">Chargement…</h1>
        <p class="t-sub" id="sub"></p>
      </div>
    </section>

    <section class="t-control">
      <button class="t-ring" type="button" id="ring" aria-label="Démarrer">
        <svg viewBox="0 0 200 200" aria-hidden="true">
          <circle class="r-bg" cx="100" cy="100" r="90"/>
          <circle class="r-fg" id="arc" cx="100" cy="100" r="90" transform="rotate(-90 100 100)"/>
        </svg>
        <span class="t-ring-in">
          <span class="t-phase" id="phase">Prêt ?</span>
          <span class="t-time num" id="time">–</span>
          <span class="t-hint" id="hint">Appuyez pour commencer</span>
        </span>
      </button>

      <div class="t-next" id="next" hidden></div>

      <div class="t-buttons">
        <button class="t-btn" type="button" id="prev" aria-label="Exercice précédent"></button>
        <button class="t-btn main" type="button" id="play" aria-label="Démarrer"></button>
        <button class="t-btn" type="button" id="skip" aria-label="Exercice suivant"></button>
      </div>
    </section>
  </main>

  <footer class="t-foot">
    <button class="t-info" type="button" id="info"></button>
    <div class="t-total">
      <div class="bar"><i id="totalbar"></i></div>
      <span id="totaltxt"></span>
    </div>
  </footer>
</div>

<script type="module" src="/assets/pages/timer.js"></script>
</body>
</html>
