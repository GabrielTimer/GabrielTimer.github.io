<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma marche du jour</title>
<meta name="theme-color" content="#EDF3F4">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="apple-touch-icon" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  /* Programme marche : aide au départ (le patient marche sans l'appli), validation au retour. */
  .mar{ max-width:560px; margin:0 auto; padding:max(14px,env(safe-area-inset-top)) var(--gutter) calc(32px + env(safe-area-inset-bottom)); display:flex; flex-direction:column; gap:16px; }
  .mar-top{ display:flex; align-items:center; gap:8px; }
  .mar-top .btn{ min-height:44px; }
  .mar-hero{ display:flex; gap:14px; align-items:center; background:var(--surface); border-radius:var(--r-lg, 18px); padding:16px; box-shadow:var(--shadow-1); }
  .mar-hero img{ width:96px; height:120px; object-fit:contain; flex:none; }
  .mar-hero .lv{ font-size:var(--fs-sm); font-weight:800; color:var(--lagon, #138FA6); text-transform:uppercase; letter-spacing:.04em; }
  .mar-hero h1{ font-size:clamp(1.5rem,6vw,1.9rem); margin:2px 0 6px; line-height:1.15; }
  .mar-plan{ font-size:var(--fs-lg); font-weight:800; color:var(--ink); }
  .mar-plan small{ display:block; font-weight:600; color:var(--ink-2); font-size:var(--fs-sm); margin-top:2px; }
  .mar-msg{ font-size:var(--fs-md); line-height:1.5; }
  .mar-boost{ background:var(--ok-soft, #E6F5EC); border-radius:14px; padding:14px 16px; font-weight:700; display:flex; gap:10px; align-items:flex-start; }
  .mar-boost svg{ flex:none; width:22px; height:22px; color:var(--ok, #1E7A4C); margin-top:2px; }
  .mar-list{ margin:0; padding-left:20px; }
  .mar-list li{ margin:5px 0; }
  .mar h2{ font-size:var(--fs-lg); margin:0 0 8px; display:flex; gap:8px; align-items:center; }
  .mar h2 svg{ width:22px; height:22px; }
  .mar-stop{ background:#FDECEC; border-radius:14px; padding:14px 16px; }
  .mar-stop h2{ color:#B42F2F; }
  .mar-actions{ display:flex; flex-direction:column; gap:10px; }
  .mar-astuce{ color:var(--ink-2); font-size:var(--fs-sm); }
</style>
</head>
<body>
<main class="mar" id="app"></main>
<script type="module" src="/assets/pages/marche.js"></script>
</body>
</html>
