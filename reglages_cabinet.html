<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Réglages du cabinet</title>
<meta name="robots" content="noindex">
<meta name="theme-color" content="#EDF3F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0B181D" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="/manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png">
<link rel="stylesheet" href="/assets/app.css">
<style>
  .rc{ display:flex; flex-direction:column; gap:18px; padding-bottom:110px; }
  .rc .panel h2{ font-size:var(--fs-lg); display:flex; align-items:center; gap:10px; }
  .rc .panel h2 svg{ width:22px; height:22px; color:var(--lagon); }
  .rc .panel > p.muted{ margin:4px 0 14px; }
  .rc-grid{ display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:14px; }
  .rc-row{ display:flex; gap:8px; align-items:center; }
  .rc-row .input{ flex:1; min-width:0; }
  .rc-list{ display:flex; flex-direction:column; gap:8px; }
  .rc-logo{ display:flex; gap:14px; align-items:center; flex-wrap:wrap; }
  .rc-logo .prev{ width:84px; height:84px; border-radius:var(--r-md); border:1px solid var(--line); background:#fff; display:grid; place-items:center; overflow:hidden; }
  .rc-logo .prev img{ width:100%; height:100%; object-fit:contain; }
  .rc-vars{ display:flex; flex-wrap:wrap; gap:6px; margin-top:6px; }
  .rc-vars button{ border:1px dashed var(--line-strong, var(--line)); background:var(--surface-2); border-radius:8px; padding:3px 8px; font:inherit; font-size:var(--fs-xs); cursor:pointer; color:var(--ink-2); font-family:var(--mono); }
  .rc-preview{ white-space:pre-wrap; background:var(--surface-2); border-radius:var(--r-sm); padding:12px 14px; font-size:var(--fs-sm); color:var(--ink-2); }
  .rc-switch{ display:flex; gap:10px; align-items:center; font-weight:700; }
  .rc-switch input{ width:20px; height:20px; }
  .rc-save{ position:fixed; z-index:45; left:0; right:0; bottom:calc(var(--nav-h) + env(safe-area-inset-bottom)); padding:12px 16px; background:color-mix(in srgb,var(--bg) 88%,transparent); backdrop-filter:blur(8px); border-top:1px solid var(--line); display:flex; justify-content:center; gap:10px; align-items:center; }
  @media (min-width:960px){ .rc-save{ bottom:0; left:var(--side-w); } }
  .rc-save .btn{ min-width:240px; }
  .rc-save .state{ font-size:var(--fs-sm); color:var(--ink-3); }
  @media (max-width:600px){ .rc-save .state{ display:none; } .rc-save .btn{ flex:1; min-width:0; } }
  .rc-h{ display:flex; flex-direction:column; gap:10px; }
  .rc-hj{ display:grid; grid-template-columns:96px 1fr 1fr; gap:8px 12px; align-items:center; padding:8px 0; border-top:1px solid var(--line); }
  .rc-hj:first-child{ border-top:0; }
  .rc-hj > b{ font-size:var(--fs-sm); }
  .rc-hc{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
  .rc-hc select{ flex:1 1 130px; min-width:0; }
  .rc-hc input{ width:96px; flex:none; }
  .rc-hc.ferme input{ opacity:.35; }
  .rc-hc.domicile select{ color:var(--sun-strong, #A15C00); font-weight:700; }
  @media (max-width:640px){ .rc-hj{ grid-template-columns:1fr; } }
  .rc-ph{ display:grid; grid-template-columns:repeat(auto-fill, minmax(150px, 1fr)); gap:12px; margin-bottom:12px; }
  .rc-ph figure{ margin:0; border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden; background:var(--surface); display:flex; flex-direction:column; }
  .rc-ph img{ width:100%; aspect-ratio:4/3; object-fit:cover; display:block; background:var(--surface-2); }
  .rc-ph .input{ border:0; border-top:1px solid var(--line); border-radius:0; font-size:var(--fs-sm); }
  .rc-ph .acts{ display:flex; justify-content:space-between; padding:4px; border-top:1px solid var(--line); }
  .rc-rule{ font-family:var(--mono); font-size:var(--fs-xs); background:var(--surface-2); padding:10px 12px; border-radius:var(--r-sm); white-space:pre; overflow:auto; }

</head>
<body>
<main class="page" id="app"></main>
<script type="module">
import { $, $$, esc, icon, mountShell, registerSW, toast, confirmDialog, promptDialog, openSheet, accessLink, prenom } from "/assets/app.js";
import { settings, DEFAULTS, saveSettings, loadSettings, fillTemplate, logoSrc } from "/assets/settings.js";
import * as H from "/assets/horaires.js";
const { requireKine } = await import("/assets/kine.js");
await requireKine();
{ const C0 = await import("/assets/cloud.js");
  if(!C0.estTitulaire()){ document.getElementById("app").innerHTML = `<div class="page-head"><h1>Réservé au titulaire</h1><p class="lead">Les réglages du cabinet sont gérés par le titulaire du cabinet.</p></div><a class="btn" href="/index.html">Retour à l'accueil</a>`; throw new Error("reserve"); } }
registerSW();
mountShell({ role:"kine", active:"", back:"/admin_tools.html", title:"Réglages du cabinet" });
const C = await import("/assets/cloud.js");
const app = $("#app");
const IM = await import("/assets/info-mois.js");
const AFF = IM.affiches(await C.listConseils().catch(() => []));

await loadSettings({ force:true });
const R = structuredClone(settings);   // brouillon en cours de modification
R.cabinet.horaires = H.normaliser(R.cabinet.horaires);
let dirty = false;
let logo = R.cabinet.logo || null;

const RULE = `    match /reglages/{id} {
      allow read: if true;
      allow write: if isKine();
    }`;

const slug = v => String(v || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9]+/g, "_").replace(/^_+|_+$/g, "");
const field = (id, label, value, { type = "text", ph = "", hint = "", attrs = "" } = {}) => `
  <div class="field"><label for="${id}">${esc(label)}</label><input class="input" id="${id}" type="${type}" value="${esc(value ?? "")}" placeholder="${esc(ph)}" ${attrs}>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
const area = (id, label, value, { rows = 4, hint = "", ph = "" } = {}) => `
  <div class="field"><label for="${id}">${esc(label)}</label><textarea class="textarea" id="${id}" rows="${rows}" placeholder="${esc(ph)}">${esc(value ?? "")}</textarea>${hint ? `<span class="hint">${esc(hint)}</span>` : ""}</div>`;
const num = (id, label, value, min, max, hint = "") => field(id, label, value, { type:"number", hint, attrs:`min="${min}" max="${max}" inputmode="numeric"` });

/* ---------- Comptes autorisés (titulaire seulement) ---------- */

/* Un compte qui a suivi vos patients connaît l'identifiant de leurs dossiers : même retiré,
   il pourrait encore lire leurs séances. Changer leurs codes lui coupe tout accès. */
async function changerCodes(patients){
  toast(`Nouveaux codes : 0 / ${patients.length}…`, { duration: 600000 });
  const { faits, erreurs } = await C.renouvelerCodes(patients.map(p => p.cle), (i, n) => {
    const el = document.querySelector(".toasts .toast:last-child .t-msg"); if(el) el.textContent = `Nouveaux codes : ${i} / ${n}…`;
  });
  document.querySelectorAll(".toasts .toast").forEach(x => { if(/^Nouveaux codes :/.test(x.textContent)) x.remove(); });
  toast(erreurs.length
    ? `${faits.length} code${faits.length > 1 ? "s" : ""} changé${faits.length > 1 ? "s" : ""}, ${erreurs.length} impossible${erreurs.length > 1 ? "s" : ""} (connexion ?) : réessayez plus tard.`
    : `${faits.length} code${faits.length > 1 ? "s" : ""} changé${faits.length > 1 ? "s" : ""}. Envoyez à chacun son nouveau lien : un rappel s'affiche dans sa fiche.`, { type: erreurs.length ? "err" : "ok", duration: 10000 });
}
async function proposerNouveauxCodes(compte){
  if(!compte?.aVuMesPatients && !compte?.voitMesPatients) return;
  const mes = (await C.listPatients()).filter(p => C.estSien(p));
  if(!mes.length) return;
  if(await confirmDialog({ title:"Couper complètement son accès ?", message:`${compte.nom || compte.email} a suivi vos patients : il connaît l'identifiant de leurs dossiers et pourrait encore lire leurs séances et questionnaires (pas vos messages). Pour lui couper tout accès, donnez un nouveau code à vos ${mes.length} patient${mes.length > 1 ? "s" : ""}. Il faudra ensuite renvoyer son lien à chacun.`, confirm:"Changer les codes", cancel:"Plus tard" })){
    await changerCodes(mes);
  }
}

async function initComptes(){
  const box = $("#cp-list"); if(!box) return;
  const quand = t => new Date(t).toLocaleDateString("fr-FR", { day:"numeric", month:"long", year:"numeric" });
  const afficher = async () => {
    let comptes = [];
    try{ comptes = await C.getComptes(); }catch(e){ box.innerHTML = `<p class="small muted">Liste indisponible (connexion ?).</p>`; return; }
    box.innerHTML = comptes.length ? comptes.map(c => `<div class="list-item"><span class="li-ico">${icon("user")}</span>
      <span class="li-main"><span class="li-title">${esc(c.nom || c.email)}</span><span class="li-sub">${esc(c.email)}${c.depuis ? ` · depuis le ${esc(quand(c.depuis))}` : ""}</span></span>
      <span class="li-end" style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:flex-end">
        <label class="rc-switch small" style="margin:0"><input type="checkbox" data-cp-voit="${esc(c.email)}" ${c.voitMesPatients ? "checked" : ""}>Voit mes patients</label>
        <button class="btn sm ghost" type="button" data-cp-del="${esc(c.email)}">${icon("trash")}Retirer</button></span></div>`).join("")
      : `<p class="small muted">Aucun autre compte : vous êtes seul à accéder à l'espace kiné.</p>`;
    box.querySelectorAll("[data-cp-voit]").forEach(cb => cb.onchange = async () => {
      try{
        if(cb.checked){
          /* Patients à l'ancien lien : leur messagerie serait lisible par ce compte */
          const anciens = (await C.listPatients()).filter(p => C.estSien(p) && C.ancienLien(p));
          if(anciens.length && await confirmDialog({ title:"Protéger d'abord vos messages ?", message:`${anciens.length} patient${anciens.length > 1 ? "s ont" : " a"} encore un lien d'avant la version 2.29 : ce compte pourrait lire vos messages avec ${anciens.length > 1 ? "eux" : "lui"}. Leur donner un nouveau code maintenant protège votre messagerie, mais il faudra leur renvoyer leur lien (rappel dans chaque fiche).`, confirm:"Nouveaux codes", cancel:"Continuer sans" })){
            await changerCodes(anciens);
          }
        }
        await C.setVoitMesPatients(cb.dataset.cpVoit, cb.checked);
        if(!cb.checked) await proposerNouveauxCodes(comptes.find(c => c.email === cb.dataset.cpVoit));
        toast(cb.checked ? `${cb.dataset.cpVoit} peut suivre vos patients (sans votre messagerie ni vos notes).` : `${cb.dataset.cpVoit} ne voit plus vos patients.`, { type:"ok", duration:6000 });
      }catch(e){ cb.checked = !cb.checked; toast("Impossible de modifier : " + (e.message || e), { type:"err" }); }
    });
    box.querySelectorAll("[data-cp-del]").forEach(b => b.onclick = async () => {
      if(!await confirmDialog({ title:"Retirer l'accès ?", message:`${b.dataset.cpDel} ne pourra plus ouvrir l'espace kiné.`, confirm:"Retirer", danger:true })) return;
      try{ await C.retirerCompte(b.dataset.cpDel); toast("Accès retiré.", { type:"ok" }); await proposerNouveauxCodes(comptes.find(c => c.email === b.dataset.cpDel)); afficher(); }
      catch(e){ toast("Impossible de retirer l'accès : " + (e.message || e), { type:"err" }); }
    });
  };
  afficher();
  $("#cp-add").onclick = async e => {
    const email = $("#cp-mail").value.trim(), nom = $("#cp-nom").value.trim();
    if(!email){ $("#cp-mail").focus(); return; }
    const b = e.currentTarget; b.disabled = true;
    try{
      await C.ajouterCompte({ email, nom });
      $("#cp-mail").value = ""; $("#cp-nom").value = "";
      toast(`Accès donné. ${email} va recevoir un e-mail pour choisir son mot de passe (pensez aux courriers indésirables).`, { type:"ok", duration:8000 });
      afficher();
    }catch(err){ toast(err.message || "Impossible de donner l'accès.", { type:"err" }); }
    finally{ b.disabled = false; }
  };
}

async function initModeSeance(){
  const MS = await import("/assets/mode-seance.js");
  const box = $("#ms");
  ["input", "change"].forEach(t => box.addEventListener(t, e => e.stopPropagation()));
  const maj = () => {
    $("#ms-on").checked = MS.reglage.actifParDefaut();
    $("#ms-pin-t").textContent = MS.reglage.pinPerso() ? "Changer le code" : "Changer le code (actuellement 7777)";
    $("#ms-del").hidden = !MS.reglage.pinPerso();
  };
  maj();
  $("#ms-on").onchange = e => { MS.reglage.setActifParDefaut(e.target.checked); toast(e.target.checked ? "Mode séance activé sur cet appareil." : "Mode séance désactivé sur cet appareil."); };
  $("#ms-pin").onclick = async () => {
    if(!(await MS.verifierPin("Saisissez le code actuel."))) return;
    await MS.creerPin(); maj();
  };
  $("#ms-del").onclick = async () => {
    if(!(await MS.verifierPin("Saisissez le code actuel."))) return;
    MS.reglage.pinParDefaut(); toast("Le code est de nouveau 7777."); maj();
  };
}

async function initDossiers(){
  const D = await import("/assets/dossiers.js");
  const box = $("#dos");
  if(!D.supporte()){
    box.querySelector("#dos-list").innerHTML = `<div class="notice">${icon("info")}<span>Sur cet appareil, le navigateur ne permet pas de choisir un dossier : les bilans et documents vont dans <strong>Téléchargements</strong>. Le choix du dossier fonctionne sur ordinateur, avec Chrome ou Edge.</span></div>`;
    return;
  }
  const maj = async () => {
    const lignes = await Promise.all(Object.entries(D.TYPES).map(async ([type, label]) => {
      const h = await D.dossier(type);
      return `<div class="row wrap" style="--gap:10px;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)">
        <div><strong>${esc(label)}</strong><div class="small muted">${h ? `${icon("folder")} Dossier « ${esc(h.name)} »` : "Téléchargements (par défaut)"}</div></div>
        <div class="row wrap" style="--gap:8px">
          <button class="btn" type="button" data-dos-choisir="${type}">${icon("folder")}${h ? "Changer de dossier" : "Choisir le dossier"}</button>
          ${h ? `<button class="btn" type="button" data-dos-oublier="${type}">Revenir aux Téléchargements</button>` : ""}
        </div></div>`;
    }));
    box.querySelector("#dos-list").innerHTML = lignes.join("");
    $$("[data-dos-choisir]", box).forEach(b => b.onclick = async () => {
      try{ const h = await D.choisir(b.dataset.dosChoisir); toast(`Les fichiers iront dans « ${h.name} ».`); maj(); }
      catch(e){ if(e?.name !== "AbortError") toast("Ce dossier ne peut pas être utilisé. Choisissez-en un autre (pas un dossier système).", { type:"err" }); }
    });
    $$("[data-dos-oublier]", box).forEach(b => b.onclick = async () => { await D.oublier(b.dataset.dosOublier); toast("Retour au dossier Téléchargements."); maj(); });
  };
  maj();
}

function render(){
  R.cabinet.horaires = H.normaliser(R.cabinet.horaires);
  const A = R.messages.annonce;
  app.innerHTML = `
  <div class="page-head"><h1>Réglages du cabinet</h1><p class="lead">Tout ce qui se modifie sans toucher au code. Les changements s'appliquent sur tous vos appareils et chez vos patients.</p></div>

  <div class="rc">

    <section class="panel">

      <div class="rc-logo" style="margin-bottom:14px">
        <div class="prev" id="logo-prev"></div>
        <div class="stack" style="--gap:8px">
          <label class="btn soft sm ee-file">${icon("upload")}<span>Changer le logo</span><input type="file" id="logo-file" accept="image/*" hidden></label>
          <button class="btn ghost sm" type="button" id="logo-del">${icon("history")}Logo d'origine</button>
        </div>
      </div>
      <div class="rc-grid">
        ${field("c-nom", "Nom", R.cabinet.nom)}
        ${field("c-titre", "Profession", R.cabinet.titre, { ph:"Masseur-kinésithérapeute" })}
        ${field("c-sous", "Sous le nom (menu)", R.cabinet.sousTitre, { ph:"Kinésithérapie" })}
        ${field("c-email", "E-mail de contact", R.cabinet.email, { type:"email", hint:"Les patients vous écrivent à cette adresse." })}
        ${field("c-tel", "Téléphone", R.cabinet.telephone, { type:"tel" })}
        ${area("c-adr", "Adresse", R.cabinet.adresse, { rows:2 })}
        ${field("c-rpps", "N° RPPS", R.cabinet.rpps, { attrs:'inputmode="numeric"', hint:"Imprimé sur les ordonnances." })}
        ${field("c-am", "N° Assurance Maladie", R.cabinet.am, { hint:"Imprimé sur les ordonnances." })}
      </div>
      <div style="margin-top:14px">${area("c-msg", "Message en haut de la page publique", R.cabinet.message, { rows:3, hint:"Bien visible en haut de la page du cabinet. {telephone} est remplacé par le numéro. Laissez vide pour ne rien afficher." })}</div>
      <p class="hint" style="margin-top:10px">${icon("link")} Page publique du cabinet (à mettre sur Google Maps) : <a href="/cabinet.html" target="_blank" rel="noopener">gabrieltimer.github.io/cabinet.html</a></p>
      <p class="hint" style="margin-top:6px">L'adresse e-mail de <strong>connexion</strong> à l'espace kiné ne change pas ici : elle est liée à votre compte Firebase.</p>
    </section>

    <section class="panel">
      <h2>${icon("clock")}Horaires</h2>
      <p class="muted">Affichés aux patients, dans la rubrique « Le cabinet » de leur accueil, avec l'état du moment (ouvert, en soins à domicile, fermé). Pour chaque demi-journée, choisissez où vous êtes et les heures.</p>
      <div class="rc-h" id="hor">${H.ORDRE.map(i => `
        <div class="rc-hj"><b>${H.JOURS[i]}</b>${R.cabinet.horaires.jours[i].map((c, k) => `
          <div class="rc-hc ${esc(c.lieu)}" data-hc="${i}-${k}">

            <input class="input" type="time" id="h-${i}-${k}-de" value="${esc(c.de)}" aria-label="De">
            <input class="input" type="time" id="h-${i}-${k}-a" value="${esc(c.a)}" aria-label="À">
          </div>`).join("")}
        </div>`).join("")}
      </div>
      <div class="row wrap" style="--gap:8px;margin:12px 0">
        <button class="btn sm" type="button" id="h-copy">${icon("copy")}Copier le lundi du mardi au vendredi</button>
      </div>
      ${area("h-note", "Remarque (facultatif)", R.cabinet.horaires.note, { rows:2, ph:"Sur rendez-vous uniquement. Fermé les jours fériés." })}

    <section class="panel" id="photos">

      <div class="rc-ph" id="ph-list"><div class="loading"><div class="spinner"></div></div></div>
      <label class="btn soft ee-file" id="ph-add">${icon("upload")}<span>Ajouter des photos</span><input type="file" id="ph-file" accept="image/*" multiple hidden></label>

    <section class="panel" id="info-mois">
      <h2>${icon("library")}L'info kiné du mois</h2>

      <label class="rc-switch" style="margin-bottom:12px"><input type="checkbox" id="im-on" ${R.infoMois?.active !== false ? "checked" : ""}>Afficher l'info du mois chez les patients</label>
      <div class="field"><label for="im-choix">Affiche de ${esc(IM.NOM_MOIS())}</label>
        <select class="select" id="im-choix">
          <option value="">Automatique, une nouvelle chaque mois${AFF.length ? ` (ce mois-ci : ${esc(IM.rotation(AFF)?.titre || "")})` : ""}</option>
          ${AFF.map(c => `<option value="${esc(IM.idFiche(c))}" ${R.infoMois?.choix === IM.idFiche(c) ? "selected" : ""}>${esc(c.titre)}</option>`).join("")}
        </select>
        <span class="hint">Choisir une affiche la garde tant que vous ne remettez pas « Automatique ».</span></div>

    <section class="panel">

    <section class="panel">

/* ---------- Photos du cabinet (enregistrées tout de suite, hors bouton Enregistrer) ---------- */
const MAX_PHOTOS = 12;
let photos = null;
async function initPhotos(){
  const box = $("#photos");
  ["input", "change"].forEach(t => box.addEventListener(t, e => e.stopPropagation()));   // ne compte pas comme « modifications à enregistrer »
  const list = $("#ph-list");
  const show = () => {
    if(!photos.length){ list.innerHTML = `<p class="small muted" style="grid-column:1/-1;margin:0">Aucune photo pour l'instant.</p>`; return; }
    list.innerHTML = photos.map((p, i) => `
      <figure data-ph="${esc(p.id)}">
        <img src="${esc(p.data)}" alt="" loading="lazy">
        <input class="input" type="text" value="${esc(p.legende || "")}" placeholder="Légende (facultatif)" data-leg="${esc(p.id)}" maxlength="80">
        <div class="acts">
          <button class="icon-btn sm" type="button" data-mv="-1" aria-label="Avant" ${i ? "" : "disabled"}>${icon("back")}</button>
          <button class="icon-btn sm" type="button" data-del aria-label="Supprimer">${icon("trash")}</button>
          <button class="icon-btn sm" type="button" data-mv="1" aria-label="Après" ${i < photos.length - 1 ? "" : "disabled"}>${icon("chevron")}</button>
        </div>
      </figure>`).join("");
  };
  try{ photos = await C.getPhotosCabinet(); }catch(e){ photos = []; }
  show();
  const saveIndex = async () => { try{ await C.savePhotosIndex(photos); }catch(err){ failed(err); } };
  list.addEventListener("click", async e => {
    const fig = e.target.closest("[data-ph]"); if(!fig) return;
    const i = photos.findIndex(p => p.id === fig.dataset.ph);
    const mv = e.target.closest("[data-mv]");
    if(mv){
      const j = i + Number(mv.dataset.mv); if(j < 0 || j >= photos.length) return;
      [photos[i], photos[j]] = [photos[j], photos[i]]; show(); await saveIndex(); return;
    }
    if(e.target.closest("[data-del]")){
      if(!await confirmDialog({ title:"Supprimer cette photo ?", message:"Elle disparaîtra de la page du cabinet.", confirm:"Supprimer", danger:true })) return;
      try{ await C.deletePhotoCabinet(photos[i].id); photos.splice(i, 1); show(); toast("Photo supprimée."); }catch(err){ failed(err); }
    }
  });
  list.addEventListener("change", async e => {
    const id = e.target.dataset.leg; if(!id) return;
    const p = photos.find(x => x.id === id); if(!p) return;
    p.legende = e.target.value.trim(); await saveIndex(); toast("Légende enregistrée.");
  });
  $("#ph-file").onchange = async ev => {
    const files = [...ev.target.files]; ev.target.value = "";
    if(!files.length) return;
    const place = MAX_PHOTOS - photos.length;
    if(place <= 0){ toast(`${MAX_PHOTOS} photos au plus : supprimez-en une d'abord.`, { type:"err" }); return; }
    const lab = $("#ph-add span"), txt = lab.textContent;
    const { compressPhoto } = await import("/assets/photos-cabinet.js");
    let ok = 0;
    for(const f of files.slice(0, place)){
      lab.textContent = `Envoi ${ok + 1} sur ${Math.min(files.length, place)}…`;
      try{
        const data = await compressPhoto(f);
        const id = await C.addPhotoCabinet(data);
        photos.push({ id, legende:"", data }); ok++; show();
      }catch(err){ failed(err); break; }
    }
    lab.textContent = txt;
    if(ok) toast(ok > 1 ? `${ok} photos ajoutées.` : "Photo ajoutée.", { type:"ok" });
    if(files.length > place) toast(`${MAX_PHOTOS} photos au plus : les autres n'ont pas été ajoutées.`, { type:"err" });
  };
}

const val = id => $("#" + id).value;
const int = (id, min, max, d) => { const n = Math.round(Number(val(id))); return Number.isFinite(n) && val(id) !== "" ? Math.max(min, Math.min(max, n)) : d; };

function failed(err){
  console.error(err);
  if(err?.code === "permission-denied"){
    $("#rule-warn").innerHTML = `<div class="notice danger" style="margin-bottom:16px">${icon("alert")}<div class="stack" style="--gap:8px"><strong>Firebase refuse l'enregistrement.</strong><span>Ajoutez une seule fois cette règle dans Firebase (Firestore Database → Règles), juste avant le bloc <code>match /programmes/{id}</code>, puis Publier. Le détail est dans l'Aide.</span><div class="rc-rule">${esc(RULE)}</div></div></div>`;
    scrollTo({ top:0, behavior:"smooth" });
    toast("Enregistrement refusé par Firebase : voir l'encadré en haut de la page.", { type:"err", duration:7000 });
  }else toast("Enregistrement impossible : " + (err.message || err), { type:"err", duration:6000 });
}

  if(!cats.some(c => c.id === "autre")) cats.push({ id:"autre", label:"Autres", one:"Autre" });
  const ids = new Set(); cats.forEach(c => { while(ids.has(c.id)) c.id += "_"; ids.add(c.id); });
  const patch = {
    cabinet: { nom: val("c-nom").trim() || DEFAULTS.cabinet.nom, titre: val("c-titre").trim(), sousTitre: val("c-sous").trim(), email: val("c-email").trim(), telephone: val("c-tel").trim(), adresse: val("c-adr").trim(), message: val("c-msg").trim(), rpps: val("c-rpps").trim(), am: val("c-am").trim(),
      horaires: { jours: Object.fromEntries([0, 1, 2, 3, 4, 5, 6].map(i => [String(i), [0, 1].map(k => {
        const lieu = val(`h-${i}-${k}-lieu`), de = val(`h-${i}-${k}-de`), a = val(`h-${i}-${k}-a`);
        return lieu === "ferme" || !de || !a ? { lieu:"ferme", de:"", a:"" } : { lieu, de: de < a ? de : a, a: de < a ? a : de };
      })])), note: val("h-note").trim() },
      logo: logo || "" },
    messages: {
      invitation: val("m-inv").trim() || DEFAULTS.messages.invitation,
      encouragements: val("m-enc").split("\n").map(s => s.trim()).filter(Boolean),
      piedPdf: val("m-pdf").trim(),
      annonce: { active: $("#a-on").checked, texte: val("a-txt").trim(), debut: val("a-deb"), fin: val("a-fin") }
    },
    exercice: { reps: int("e-reps", 1, 200, 10), ex: int("e-ex", 1, 7200, 30), repos: int("e-repos", 0, 7200, 10) },
    alertes: { douleur: int("al-douleur", 1, 10, 7), hausse: int("al-hausse", 1, 10, 2), retard: int("al-retard", 1, 30, 2), joursSans: int("al-jours", 1, 90, 10) },
    evolution: { jours: int("ev-jours", 7, 42, 14), minSeances: int("ev-min", 1, 20, 4), evaMax: int("ev-eva", 0, 10, 3), hausse: int("ev-hausse", 1, 10, 2), tropDur: int("ev-dur", 1, 10, 2) },
    infoMois: { active: $("#im-on").checked, choix: val("im-choix") },
    listes: { categories: cats, niveaux: R.listes.niveaux.map((n, i) => ({ ...n, n: i + 1 })), zones: val("z-list").split("\n").map(s => s.trim()).filter(Boolean) }
  };
  if(!patch.messages.encouragements.length) patch.messages.encouragements = DEFAULTS.messages.encouragements;
  const btn = $("#save");
  btn.disabled = true; btn.innerHTML = `<span class="spinner" style="width:18px;height:18px"></span>Enregistrement…`;
  try{
    await saveSettings(patch);
    $("#rule-warn").innerHTML = "";
    Object.assign(R, structuredClone(settings));
    setDirty(false);
    toast("Réglages enregistrés.", { type:"ok" });
    renderCats();
  }catch(err){ failed(err); setDirty(true); }
  btn.innerHTML = `${icon("check")}Enregistrer les réglages`;
}

/* ---------- Sauvegarde / restauration ---------- */
async function downloadBackup(){
  const b = $("#bk-dl");
  b.disabled = true;
  let ok = false;
  try{
    const data = await C.exportAll(step => { b.innerHTML = `<span class="spinner" style="width:18px;height:18px"></span>${esc(step)}…`; });
    const blob = new Blob([JSON.stringify(data)], { type:"application/json" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = `sauvegarde-kine-${new Date().toISOString().slice(0, 10)}.json`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
    localStorage.setItem("gt_last_backup", String(Date.now()));
    saveSettings({ sauvegarde:{ derniere: Date.now() } }).catch(() => {}); // date partagée entre appareils (rappel sur l'accueil)
    const n = Object.fromEntries(Object.entries(data.collections).map(([k, v]) => [k, v.length]));
    toast(`Sauvegarde téléchargée : ${n.patients || 0} patients, ${n.seances || 0} séances, ${n.modeles || 0} modèles.`, { type:"ok", duration:6000 });
    $("#bk-last").textContent = `Dernière sauvegarde : aujourd'hui.`;
    ok = true;
  }catch(err){ failed(err); }
  b.disabled = false; b.innerHTML = `${icon("download")}Données seulement`;
  return ok;
}

/* Déchiffre une sauvegarde automatique (voir .github/scripts/sauvegarde.mjs : gzip puis AES-256-GCM,
   clé PBKDF2-SHA256 tirée du mot de passe). Renvoie la sauvegarde, ou null. */
async function dechiffrerSauvegarde(env){
  const b64 = v => Uint8Array.from(atob(v), c => c.charCodeAt(0));
  for(let essai = 0; essai < 3; essai++){
    const mdp = await promptDialog({ title:"Sauvegarde chiffrée", label: essai ? "Mot de passe incorrect. Réessayez :" : "Mot de passe de la sauvegarde automatique", type:"password", confirm:"Déchiffrer" });
    if(mdp === null) return null;
    try{
      const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(mdp), "PBKDF2", false, ["deriveKey"]);
      const cle = await crypto.subtle.deriveKey({ name:"PBKDF2", hash: env.kdf?.hash || "SHA-256", salt: b64(env.salt), iterations: env.kdf?.iterations || 600000 }, base, { name:"AES-GCM", length:256 }, false, ["decrypt"]);
      const gz = await crypto.subtle.decrypt({ name:"AES-GCM", iv: b64(env.iv) }, cle, b64(env.data));
      const flux = new Blob([gz]).stream().pipeThrough(new DecompressionStream("gzip"));
      return JSON.parse(await new Response(flux).text());
    }catch(e){
      if(typeof DecompressionStream === "undefined"){ toast("Ce navigateur est trop ancien pour ouvrir une sauvegarde chiffrée : mettez-le à jour.", { type:"err" }); return null; }
    }
  }
  toast("Mot de passe incorrect : rien n'a été restauré.", { type:"err" });
  return null;
}

async function restoreBackup(ev){
  const f = ev.target.files?.[0]; ev.target.value = "";
  if(!f) return;
  let data;
  try{ data = JSON.parse(await f.text()); }catch(e){ toast("Ce fichier n'est pas lisible.", { type:"err" }); return; }
  if(data?.format === "apikine-sauvegarde-chiffree"){
    /* Sauvegarde automatique (dépôt privé apikine-sauvegardes) : chiffrée avec votre mot de passe */
    data = await dechiffrerSauvegarde(data);
    if(!data) return;
  }
  if(data?.format !== "gabrieltimer-sauvegarde"){ toast("Ce fichier n'est pas une sauvegarde de l'application.", { type:"err" }); return; }
  const parts = [
    ["patients", "Patients, coordonnées et codes d'accès", ["patients", "fiches", "codes"]],
    ["seances", "Séances des patients", ["seances"]],
    ["suivis", "Messages, notes de séance et questionnaires", ["messages", "notes", "suivis"]],
    ["bilans", "Bilans kiné", ["bilans"]],
    ["modeles", "Modèles", ["modeles"]],
    ["exercices", "Exercices créés et corrections", ["exercices"]],
    ["reglages", "Réglages du cabinet", ["reglages"]]
  ];
  const count = k => (data.collections[k] || []).length;
  const s = openSheet({
    title:"Restaurer une sauvegarde",
    body:`<div class="stack" style="--gap:12px">
      <p>Sauvegarde du <strong>${esc(new Date(data.date).toLocaleString("fr-FR", { dateStyle:"long", timeStyle:"short" }))}</strong>. Choisissez ce qu'il faut restaurer :</p>
      ${parts.map(([id, label, cols]) => `<label class="check"><input type="checkbox" data-part="${id}" checked> ${esc(label)} <span class="faint">(${cols.reduce((a, c) => a + count(c), 0)})</span></label>`).join("")}
      <p class="small muted">Les éléments de la sauvegarde remplacent ceux qui existent déjà avec le même identifiant. Rien n'est effacé : ce qui a été créé depuis la sauvegarde est conservé.</p>
      <p class="small" id="rs-prog"></p>
    </div>`,
    foot:`<button class="btn" type="button" data-close>Annuler</button><button class="btn primary" type="button" id="rs-go">${icon("upload")}Restaurer</button>`
  });
  s.el.querySelector("#rs-go").onclick = async () => {
    const only = [];
    s.el.querySelectorAll("[data-part]:checked").forEach(c => parts.find(p => p[0] === c.dataset.part)[2].forEach(x => only.push(x)));
    if(!only.length) return;
    const go = s.el.querySelector("#rs-go"); go.disabled = true;
    try{
      const res = await C.importAll(data, { only, onProgress: (d, t) => { s.el.querySelector("#rs-prog").textContent = `Restauration… ${d} / ${t}`; } });
      s.close();
      toast(`Restauration terminée (${Object.values(res).reduce((a, b) => a + b, 0)} éléments).`, { type:"ok", duration:6000 });
      if(only.includes("reglages")){ await loadSettings({ force:true }); Object.assign(R, structuredClone(settings)); logo = R.cabinet.logo || null; render(); }
    }catch(err){ go.disabled = false; s.close(); failed(err); }
  };
}

render();
